<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Test — recuperar contraseña en Mi Agenda</title>

<!--
  POR QUÉ EXISTE

  1. mi-agenda.html no tenía NINGÚN chequeo de sintaxis versionado. Es el único
     HTML con lógica que quedaba fuera: reservar.html y club.html los cubre
     test-reserva-publica.html, y app.html lo compila test-comollegar.html. Si
     su <script> inline no parsea, la página queda viva e inservible y ningún
     otro test se entera.

  2. La recuperación de contraseña depende de un ORDEN que no falla de forma
     ruidosa. El enlace de correo trae los tokens en el hash
     (#access_token=...&type=recovery), y el cliente de Supabase corre en
     flowType 'implicit' con detectSessionInUrl activado: apenas se crea,
     consume el hash, arma una sesión válida y lo BORRA de la URL.

     O sea que la lectura del hash tiene que ocurrir ANTES de createClient().
     Si alguien la mueve debajo —que es donde uno la pondría al ordenar el
     archivo— no explota nada: el profesional entra directo a la agenda sin
     haber elegido contraseña nunca, y el enlace se gasta en silencio. Este
     test es lo único que ve esa regresión.

  QUÉ COMPRUEBA
  Corre el parseo REAL del archivo contra hashes inventados, y verifica el
  orden de las dos líneas en el fuente. No abre Supabase ni manda correos.

  CÓMO SE CORRE EN HEADLESS
  Ver README.md — con Chrome abierto hay una trampa que devuelve salida vacía
  y parece que pasó.
-->
<style>
body{background:#0f1018;color:#e8e6e0;font:13px/1.7 ui-monospace,Consolas,monospace;padding:24px;max-width:900px;margin:0 auto}
h1{font-size:15px;font-family:system-ui,sans-serif;color:#e8e6e0}
p{color:#888;font-family:system-ui,sans-serif;font-size:12px}
#resultado{white-space:pre-wrap;word-break:break-all}
.ok{color:#4ade80}.fail{color:#f87171}
#manual{display:none;margin:16px 0;padding:14px;border:0.5px solid #2a2a2a;border-radius:10px}
</style>

<h1>Test — recuperar contraseña en Mi Agenda</h1>
<p>Compila el <code>&lt;script&gt;</code> de <b>mi-agenda.html</b> y verifica el
flujo del enlace de correo, incluido el orden del que depende en silencio.</p>

<div id="manual">
  <p style="margin-top:0">El navegador no me deja leer los archivos por mi cuenta.
  Pásame <b>mi-agenda.html</b> e <b>index.html</b> juntos y sigo:</p>
  <input type="file" id="archivo" accept=".html" multiple>
</div>

<pre id="resultado">corriendo…</pre>

<script>
'use strict';

var lineas = [], fallos = 0, comprobaciones = 0;

function titulo(t){ lineas.push('', t, '─'.repeat(t.length)); }
function check(nombre, real, esperado){
  comprobaciones++;
  var ok = (real === esperado);
  if(!ok) fallos++;
  lineas.push((ok ? 'OK   ' : 'FALLO') + ' │ ' + nombre);
  if(!ok){
    lineas.push('      │   esperado: ' + esperado);
    lineas.push('      │   obtenido: ' + real);
  }
}
function pintar(){
  var fin = fallos === 0
    ? '\n\n>>> TODO OK — ' + comprobaciones + ' comprobaciones'
    : '\n\n>>> ' + fallos + ' FALLO(S) de ' + comprobaciones + ' comprobaciones';
  var pre = document.getElementById('resultado');
  pre.textContent = lineas.join('\n') + fin;
  pre.className = fallos === 0 ? 'ok' : 'fail';
}

// Los comentarios explican el bug, así que nombran justo lo que se busca.
function sinComentarios(js){
  return js.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^[ \t]*\/\/.*$/gm, '');
}
function inlineScripts(html){
  var re = /<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)<\/script>/gi, m, out = [];
  while((m = re.exec(html)) !== null){ if(m[1].trim()) out.push(m[1]); }
  return out;
}

// Saca el código de una función por nombre, cerrando las llaves de verdad.
// Se usa para EJECUTAR la función real del archivo, no para mirarla como texto.
function extraerFuncion(js, nombre){
  var i = js.indexOf('function ' + nombre + '(');
  if(i === -1) return '';
  var ini = js.indexOf('{', i), prof = 0;
  for(var k = ini; k < js.length; k++){
    if(js[k] === '{') prof++;
    else if(js[k] === '}'){ prof--; if(prof === 0) return js.slice(i, k + 1); }
  }
  return '';
}

// Corre el parseo REAL del hash contra una URL inventada. El bloque solo toca
// window.location.hash, así que alcanza con inyectar un window de mentira.
function parsearEnlace(js, hash){
  var m = /const HASH_ENLACE[\s\S]*?const ERROR_ENLACE\s*=\s*[^;]+;/.exec(js);
  if(!m) return null;
  try{
    return new Function('window',
      m[0] + '\nreturn {tipo:TIPO_ENLACE, esCorreo:ES_ENLACE_CORREO, error:ERROR_ENLACE};'
    )({ location:{ hash:hash } });
  }catch(e){ return { tipo:'ERROR:'+e.message, esCorreo:false, error:null }; }
}

function correr(html){
  var scripts = inlineScripts(html);
  var js = sinComentarios(scripts.join('\n'));

  // ── 1. Que parsee. El hueco que este archivo vino a tapar. ──────────────
  titulo('mi-agenda.html');
  check('tiene <script> inline', scripts.length > 0, true);
  var err = '';
  scripts.forEach(function(s){
    try { new Function(s); } catch(e){ if(!err) err = e.message; }
  });
  check('el <script> inline compila' + (err ? ' — ' + err : ''), err === '', true);

  // ── 2. EL ORDEN. Lo que no falla de forma ruidosa. ──────────────────────
  titulo('el hash se lee antes de crear el cliente');
  var iHash = js.indexOf('HASH_ENLACE');
  var iClient = js.indexOf('createClient');
  check('define HASH_ENLACE', iHash !== -1, true);
  check('crea el cliente de Supabase', iClient !== -1, true);
  check('lee el hash ANTES de createClient (si no, la pantalla nunca aparece)',
        iHash !== -1 && iClient !== -1 && iHash < iClient, true);

  // ── 3. El parseo del enlace, contra hashes reales ───────────────────────
  titulo('qué se hace con cada enlace');
  var r;

  r = parsearEnlace(js, '#access_token=abc123&expires_in=3600&type=recovery');
  check('recovery abre la pantalla de contraseña', r && r.esCorreo, true);
  check('recovery no se confunde con un error', r && !r.error, true);

  r = parsearEnlace(js, '#access_token=abc123&type=magiclink');
  check('magic link también la abre', r && r.esCorreo, true);

  r = parsearEnlace(js, '#access_token=abc123&type=invite');
  check('invitación también la abre', r && r.esCorreo, true);

  // Un enlace de confirmación de alta no es una recuperación: si esto se
  // tratara igual, se le pediría contraseña a quien ya la tiene.
  r = parsearEnlace(js, '#access_token=abc123&type=signup');
  check('signup NO la abre', r && r.esCorreo, false);

  // Navegación normal: sin hash no puede aparecer nunca.
  r = parsearEnlace(js, '');
  check('sin hash no la abre', r && r.esCorreo, false);
  r = parsearEnlace(js, '#');
  check('con hash vacío tampoco', r && r.esCorreo, false);

  // Enlace vencido: Supabase lo informa por el hash, no por HTTP. Si no se
  // mirara, el profesional vería la pantalla de contraseña y el guardado
  // fallaría con un error del servidor sin explicación.
  r = parsearEnlace(js, '#error=access_denied&error_code=otp_expired&error_description=Email+link+is+invalid+or+has+expired');
  check('detecta el enlace vencido', !!(r && r.error), true);
  check('el enlace vencido no abre la pantalla', r && r.esCorreo, false);

  // ── 4. Las piezas del flujo ─────────────────────────────────────────────
  titulo('piezas del flujo');
  check('hay botón de "¿Olvidaste tu contraseña?"', /pedirRecuperacion\(\)/.test(html), true);
  check('dispara el correo de recuperación', /resetPasswordForEmail\(/.test(js), true);
  check('el enlace del correo vuelve a mi-agenda.html, no al default del proyecto',
        /redirectTo\s*:\s*window\.location\.origin\s*\+\s*'\/mi-agenda\.html'/.test(js), true);
  check('guarda la contraseña con updateUser', /auth\.updateUser\(\{password/.test(js), true);
  check('exige que las dos coincidan', /p1\s*!==\s*p2/.test(js), true);
  check('limpia los tokens de la URL', /history\.replaceState/.test(js), true);

  // La pantalla no puede quedar visible por defecto: se muestra solo por JS.
  check('la pantalla de contraseña arranca oculta',
        /id="recuperar-view"\s+style="display:none"/.test(html), true);

  // No confirmar ni desmentir si el correo existe.
  check('no revela si el correo está registrado',
        /Si ese correo tiene una cuenta/.test(html), true);

  pintar();
}

// ── index.html: la red que atrapa el enlace mal apuntado ─────────────────
//
// Si Supabase rechaza el redirectTo —basta con que el profesional entre por
// www y la lista blanca tenga el dominio sin www— el enlace cae a la Site URL,
// que es la raíz del sitio. Pasó en producción: el correo terminó llevando a
// app.html, el panel del dueño.
function correrIndex(html){
  var scripts = inlineScripts(html);
  var js = sinComentarios(scripts.join('\n'));

  titulo('index.html');
  check('tiene <script> inline', scripts.length > 0, true);
  var err = '';
  scripts.forEach(function(s){
    try { new Function(s); } catch(e){ if(!err) err = e.message; }
  });
  check('el <script> inline compila' + (err ? ' — ' + err : ''), err === '', true);

  // Mismo orden crítico que en mi-agenda.html: si el cliente se crea primero,
  // se come el hash y el enlace queda gastado sin pedir contraseña.
  //
  // Se mide la LLAMADA, no la declaración: las funciones se hoistean, así que
  // mover solo la invocación debajo de createClient rompe el comportamiento
  // dejando el nombre igual de arriba. Buscar el nombre a secas daría verde.
  var iLlamada = js.indexOf('destinoEnlaceDeCorreo(window.location.hash)');
  var iClient = js.indexOf('createClient');
  check('existe la llamada a destinoEnlaceDeCorreo()', iLlamada !== -1, true);
  check('la llamada corre ANTES de createClient',
        iLlamada !== -1 && iClient !== -1 && iLlamada < iClient, true);

  var fuente = extraerFuncion(js, 'destinoEnlaceDeCorreo');
  check('define destinoEnlaceDeCorreo()', fuente !== '', true);
  if(fuente){
    var f = new Function(fuente + '\nreturn destinoEnlaceDeCorreo;')();

    check('un enlace de recuperación se reenvía a Mi Agenda con el hash entero',
          f('#access_token=abc&type=recovery'),
          'mi-agenda.html#access_token=abc&type=recovery');
    check('magic link también se reenvía',
          typeof f('#access_token=abc&type=magiclink') === 'string', true);
    check('invitación también se reenvía',
          typeof f('#access_token=abc&type=invite') === 'string', true);
    check('el enlace vencido también, para que Mi Agenda lo explique',
          typeof f('#error=access_denied&error_description=expired') === 'string', true);

    // Y lo que NO debe secuestrar: una visita normal a la landing.
    check('sin hash no reenvía nada', f(''), null);
    check('con hash vacío tampoco', f('#'), null);
    check('un ancla común de la landing no reenvía', f('#precios'), null);
    check('signup no reenvía', f('#access_token=abc&type=signup'), null);
  }

  // Ruteo por rol: antes mandaba a app.html a cualquiera con sesión.
  titulo('index.html — a dónde va cada rol');
  check('lee el rol del perfil antes de redirigir',
        /from\('perfiles'\)[\s\S]{0,80}select\('rol'\)/.test(js), true);
  check('un profesional va a Mi Agenda, no al panel del dueño',
        /rol\s*===\s*'profesional'\s*\?\s*'mi-agenda\.html'\s*:\s*'app\.html'/.test(js), true);
  check('ya no manda a app.html sin mirar el rol',
        /if\(session\)\s*window\.location\.replace\('app\.html'\)/.test(js), false);
}

Promise.all([
  fetch('mi-agenda.html').then(function(r){
    if(!r.ok) throw new Error('mi-agenda.html respondió HTTP ' + r.status);
    return r.text();
  }),
  fetch('index.html').then(function(r){
    if(!r.ok) throw new Error('index.html respondió HTTP ' + r.status);
    return r.text();
  })
]).then(function(t){
  // El try/catch va acá y NO en el .catch de abajo a propósito: si un error del
  // propio test cayera en el catch del fetch, la página mostraría "pásame los
  // archivos" y parecería un problema de permisos del navegador. Un test que
  // se rompe tiene que decir que se rompió.
  try{
    correrIndex(t[1]);
    correr(t[0]);
  }catch(e){
    var pre = document.getElementById('resultado');
    pre.className = 'fail';
    pre.textContent = 'ERROR EN EL TEST (no en los archivos probados):\n' + e.message + '\n\n' + (e.stack || '');
  }
}).catch(function(){
  document.getElementById('manual').style.display = 'block';
  document.getElementById('resultado').textContent =
    'Esperando mi-agenda.html e index.html… (el navegador no me deja leerlos solo)';
  document.getElementById('archivo').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files);
    var src = {}, pend = ['mi-agenda.html','index.html'];
    files.forEach(function(f){
      var fr = new FileReader();
      fr.onload = function(){
        src[f.name] = String(fr.result);
        pend = pend.filter(function(x){ return x !== f.name; });
        if(pend.length === 0){ correrIndex(src['index.html']); correr(src['mi-agenda.html']); }
      };
      fr.readAsText(f);
    });
  });
});
</script>
</html>
