<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>test · tema en páginas públicas y lado escritor</title>
<style>
body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b0c10;color:#d8dae0;padding:18px;line-height:1.5}
pre{white-space:pre-wrap;font-size:12px}
pre.ok{color:#5cd685}
pre.fail{color:#ff6b6b}
h1{font-size:14px;margin-bottom:10px;color:#9aa3af;font-weight:600}
</style>
</head>
<body>
<h1>test · tema en páginas públicas y lado escritor</h1>
<pre id="resultado">corriendo…</pre>

<script>
// ═══════════════════════════════════════════════════════════════════════
// Prueba el tema público contra las PÁGINAS REALES y el lado escritor
// contra las FUNCIONES REALES de app.html. No hay réplicas de la lógica
// acá: todo lo que se afirma se afirma sobre el archivo que se despliega.
//
// CÓMO FUNCIONA. Baja la página por XHR, le quita la llamada `init();`
// —que es lo único que la haría arrancar sola y pedir datos a la red— y la
// monta en un iframe con srcdoc. srcdoc conserva el origen del padre, así
// que se puede leer contentWindow y parchear sb, S y notify. Los src
// relativos (tema.js, supabase-config.js) resuelven contra la URL de ESTE
// archivo, que vive en la misma carpeta.
//
// ⚠ CÓMO CORRERLO. Necesita leer archivos vecinos por XHR, y Chrome lo
// prohíbe desde file:// salvo con una bandera:
//
//   chrome --headless=old --allow-file-access-from-files \
//          --virtual-time-budget=120000 --dump-dom \
//          "file:///.../test-paginas-publicas-tema.html"
//
// Y el veredicto se lee en la CLASE del <pre id="resultado"> (ok o fail),
// NUNCA buscando un texto de éxito en la salida: un grep de "TODO VERDE"
// encuentra la cadena en este propio código y da verde siempre.
//
// ⚠ NADA DE TEMPORIZADORES PROPIOS que compitan con el reloj virtual. Con
// --virtual-time-budget un setTimeout se dispara casi al instante en
// tiempo real, así que un "tope" de 2 s declara colgado algo que solo iba
// por el tercer await. Se espera con await y punto.
// ═══════════════════════════════════════════════════════════════════════

var total = 0, fallas = [];
function check(nombre, obtenido, esperado) {
  total++;
  var ok = String(obtenido) === String(esperado);
  if (!ok) fallas.push(nombre + '\n      obtenido: ' + obtenido + '\n      esperado: ' + esperado);
  return ok;
}
function verdad(nombre, cond, detalle) {
  total++;
  if (!cond) fallas.push(nombre + (detalle ? '\n      ' + detalle : ''));
  return !!cond;
}

function bajar(url) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onload = function () { res(x.responseText); };
    x.onerror = function () { rej(new Error('no se pudo bajar ' + url)); };
    x.send();
  });
}

// Monta un documento en un iframe srcdoc y espera a que termine de cargar.
function montar(html, ancho, alto) {
  return new Promise(function (res) {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:' + (ancho || 420) + 'px;height:' + (alto || 300) + 'px;position:absolute;left:-9999px';
    f.srcdoc = html;
    f.addEventListener('load', function () { res(f.contentWindow); });
    document.body.appendChild(f);
  });
}

// ─── grupo P: la página pública ────────────────────────────────────────
// Se le quita `init();` para controlar cuándo arranca y con qué datos.
// Un documento srcdoc hereda la URL del padre, así que no tiene query
// string y la página saldría en su primera línea:
//   if(!BARBERIA_ID || !TOKEN){ mostrarError(...); return; }
// En vez de reescribir esas líneas —que son código bajo prueba— se stubbea
// el ENTORNO: un preludio inyectado antes del script de la página cambia
// URLSearchParams para que devuelva el id y el token. El código de la
// página no se toca ni una letra.
var PRELUDIO = '<script>window.URLSearchParams=function(){return{get:function(k){' +
  'return {id:"TEST-ID",barberia:"TEST-ID",k:"TOKEN-DE-PRUEBA"}[k]||null;}};};<\/script>';

function prepararPagina(txt, opciones) {
  opciones = opciones || {};
  var out = txt.replace(/^init\(\);\s*$/m, '');
  verdadGlobalInit = out.indexOf('\ninit();') === -1;
  out = out.replace('<head>', '<head>' + PRELUDIO);
  if (opciones.romperTema) {
    // Simula el 404: el src apunta a un archivo que no existe, así que
    // tema.js no define nada y las guardas typeof tienen que atajarlo.
    out = out.replace('src="tema.js"', 'src="tema-ESTE-ARCHIVO-NO-EXISTE.js"');
  }
  return out;
}
var verdadGlobalInit = false;

// Parchea sb/S/notify en la página y corre su init() con la fila dada.
async function correrPagina(w, fila) {
  // `sb` se declara con const en la página, así que NO se puede reasignar:
  // se mutan sus propiedades. Reasignarlo lanza "Assignment to constant
  // variable" y el arnés se cae antes de probar nada.
  w.eval([
    'window.__fila = ' + JSON.stringify(fila) + ';',
    'sb.from = function(){ return { select: function(){ return { eq: function(){ return {',
    '    single: async function(){ return { data: window.__fila, error: null }; }',
    '  }; } }; } }; };',
    'sb.rpc = async function(){ return { data: null, error: null }; };'
  ].join('\n'));
  await w.eval('init()');
}

function estiloRaiz(w) {
  var s = w.document.documentElement.getAttribute('style');
  return s === null ? '' : s;
}
function leer(w, nombre) {
  return w.document.documentElement.style.getPropertyValue(nombre).trim();
}

// ─── grupo Q: contrastes REALES con 8 colores de marca ─────────────────
// No hay un informe aparte: cada número de las tablas sale de correr la
// página con ese color y medir con contrasteHex() sobre los tokens que la
// página escribió. Las tablas se imprimen debajo del veredicto.
//
// Amarillo y cian puros están a propósito: son los dos colores de marca que
// MÁS aclaran la tarjeta derivada (mezcla de 0,07), o sea el peor caso para
// el texto gris. La tabla "sin aclarar" muestra el contraste que tendrían
// #888 y #E8E6E0 si aclararHasta() no existiera, y el check de cada color
// exige que el valor APLICADO cumpla 4,5:1.
var informe = [];
var COLORES_Q = [
  ['violeta',        '#3104F2'], ['blanco',     '#FFFFFF'],
  ['dorado',         '#D4A853'], ['amarillo puro', '#FFFF00'],
  ['cian puro',      '#00FFFF'], ['rojo',       '#E11D48'],
  ['verde',          '#16A34A'], ['casi negro', '#1A1A1A']
];
function f2(n) { return n.toFixed(2); }
function col(s, n) { s = String(s); while (s.length < n) s += ' '; return s; }
function rgbAHex(s) { var m = String(s).match(/\d+/g) || [0,0,0];
  return '#' + m.slice(0, 3).map(function (x) { return ('0' + (+x).toString(16)).slice(-2); }).join('').toUpperCase(); }

// Sin color_marca la pagina tiene que verse EXACTAMENTE como hoy. "Hoy" son los
// valores de HEAD: .aviso-sub #888888, spinner con arco #FFFFFF (el texto
// blanco del boton) y anillo #333333.
async function sinTema(txtOriginal) {
  var w = await montar(prepararPagina(txtOriginal));
  await correrPagina(w, { nombre: 'Sin tema', whatsapp: null, foto_portada: null,
                          logo_url: null, color_marca: null, color_fondo_logo: null });
  var doc = w.document, btnU = doc.getElementById('btn-unirme');
  verdad('Q0 sin color_marca: existe #btn-unirme', !!btnU);
  var sp = doc.createElement('span'); sp.className = 'spinner';
  if (btnU) btnU.appendChild(sp);
  var av = doc.createElement('div'); av.className = 'aviso-sub'; doc.body.appendChild(av);
  var cs = w.getComputedStyle(sp);
  check('Q0 sin color_marca: aviso-sub sigue en #888888', rgbAHex(w.getComputedStyle(av).color), '#888888');
  check('Q0 sin color_marca: arco del spinner sigue en #FFFFFF', rgbAHex(cs.borderTopColor), '#FFFFFF');
  check('Q0 sin color_marca: anillo del spinner sigue en #333333', rgbAHex(cs.borderLeftColor), '#333333');
  check('Q0 sin color_marca: el style de la raiz sigue vacio', estiloRaiz(w), '');
  informe.push('', '-- Q0. SIN color_marca (debe ser igual a hoy) --',
    'aviso-sub ' + rgbAHex(w.getComputedStyle(av).color) + '   arco ' + rgbAHex(cs.borderTopColor) + '   anillo ' + rgbAHex(cs.borderLeftColor));
}
async function grupoQ(txtOriginal) {
  var A = [], B = [], C3 = [], D = [], E = [], F = [];
  for (var i = 0; i < COLORES_Q.length; i++) {
    var nom = COLORES_Q[i][0], hex = COLORES_Q[i][1];
    var w = await montar(prepararPagina(txtOriginal));
    await correrPagina(w, { nombre: 'Q', whatsapp: null, foto_portada: null,
                            logo_url: null, color_marca: hex, color_fondo_logo: null });
    var t = function (v) { return leer(w, v); };
    var K = function (a, b) { return w.contrasteHex(a, b); };
    var tar = t('--tarjeta'), fon = t('--fondo'), pre = t('--prefijo-fondo');

    // texto normal (4,5:1) — los cinco pares que usa la página
    var cuerpo = K(t('--texto'), tar),       hero = K(t('--texto-suave'), tar);
    var h1     = K(t('--texto-suave'), fon), pref = K(t('--texto-medio'), pre);
    var lab    = K(t('--texto-debil'), tar);
    var peor   = Math.min(cuerpo, hero, h1, pref, lab);
    A.push(col(nom + ' ' + hex, 22) + [cuerpo, hero, h1, pref, lab].map(function (n) { return col(f2(n), 8); }).join('') + f2(peor));
    verdad('Q ' + nom + ': texto normal cumple 4.5:1 en los 5 pares', peor >= 4.5,
           'peor par = ' + f2(peor) + ':1 (cuerpo ' + f2(cuerpo) + ', hero ' + f2(hero) +
           ', h1 ' + f2(h1) + ', prefijo ' + f2(pref) + ', label ' + f2(lab) + ')');
    // holgura: aclararHasta apunta a 4,6:1 (no a 4,5), asi que el piso del texto
    // tiene 0,1 de margen. Si el objetivo vuelve a 4,5 la medicion cae a 4,50-4,54.
    verdad('Q ' + nom + ': texto con holgura, peor par >= 4.6:1', peor >= 4.6, 'peor par = ' + f2(peor) + ':1');
    // texto grande (3:1) — misma medición, umbral más bajo
    verdad('Q ' + nom + ': texto grande cumple 3:1', peor >= 3.0, 'peor par = ' + f2(peor) + ':1');
    B.push(col(nom, 16) + col(f2(peor), 8) + (peor >= 3.0 ? 'cumple 3:1' : 'FALLA 3:1') +
           '   ' + (peor >= 4.5 ? 'y 4,5:1' : 'no llega a 4,5:1'));

    // bordes (3:1)
    var bor = K(t('--borde'), fon), borI = K(t('--input-borde'), tar);
    C3.push(col(nom, 16) + col(f2(bor), 14) + f2(borI));
    // el borde de la TARJETA tiene que seguir sutil, como hoy (#222 sobre #08090D = 1,25:1).
    var hoyB = K('#222222', '#08090D');
    verdad('Q ' + nom + ': borde de tarjeta sutil, como hoy (' + f2(hoyB) + ':1 entre -0,05 y +0,15)',
           bor >= hoyB - 0.05 && bor <= hoyB + 0.15, 'tarjeta/fondo ' + f2(bor) + ':1');
    // ...y se tine: con un color de marca con tono el borde no puede ser gris puro
    // (blanco y casi negro son neutros, ahi gris puro es lo correcto).
    if (nom !== 'blanco' && nom !== 'casi negro') {
      var rb = w.rgbDe(t('--borde'));
      verdad('Q ' + nom + ': borde de tarjeta tenido (no gris puro)', Math.max.apply(null, rb) - Math.min.apply(null, rb) > 0, '--borde = ' + t('--borde'));
    }
    verdad('Q ' + nom + ': borde de input cumple 3:1', borI >= 3.0, f2(borI) + ':1');

    verdad('Q ' + nom + ': borde de input con holgura >= 3.1:1', borI >= 3.1, 'input/tarjeta ' + f2(borI));

    // acento (texto 4,5:1 / borde 3:1) y botón
    var ac = t('--acento'), acT = K(ac, tar), acF = K(ac, fon);
    var btn = K(t('--texto-sobre-acento'), ac), btnH = K(t('--texto-sobre-acento'), t('--acento-hover'));
    D.push(col(nom, 16) + col(ac, 10) + col(f2(acT), 16) + col(f2(acF), 14) + col(f2(btn), 12) + f2(btnH));
    verdad('Q ' + nom + ': acento sobre tarjeta cumple 4.5:1', acT >= 4.5, ac + ' sobre ' + tar + ' = ' + f2(acT) + ':1');
    verdad('Q ' + nom + ': acento sobre fondo cumple 3:1 (borde de foco)', acF >= 3.0, f2(acF) + ':1');
    verdad('Q ' + nom + ': boton (texto sobre acento) cumple 4.5:1', btn >= 4.5, t('--texto-sobre-acento') + ' sobre ' + ac + ' = ' + f2(btn) + ':1');
    verdad('Q ' + nom + ': boton en hover cumple 4.5:1', btnH >= 4.5, f2(btnH) + ':1');

    // Q6: spinner y aviso-sub medidos en el DOM real (getComputedStyle), no
    // sobre literales. El spinner se mete en #btn-unirme, que es donde
    // unirme() lo pone: <button class="btn btn-primary" id="btn-unirme">.
    var doc = w.document, btnU = doc.getElementById('btn-unirme');
    verdad('Q ' + nom + ': existe #btn-unirme para medir el spinner', !!btnU);
    var sp = doc.createElement('span'); sp.className = 'spinner';
    if (btnU) btnU.appendChild(sp);
    var av = doc.createElement('div'); av.className = 'aviso-sub'; doc.body.appendChild(av);
    var arco = rgbAHex(w.getComputedStyle(sp).borderTopColor);
    var anillo = rgbAHex(w.getComputedStyle(sp).borderLeftColor);
    var avc = rgbAHex(w.getComputedStyle(av).color);
    var sobreAc = t('--texto-sobre-acento').toUpperCase();
    var cArco = K(arco, ac), cArcoAnillo = K(arco, anillo);
    verdad('Q ' + nom + ': spinner, el arco es el texto del boton (' + sobreAc + ')', arco === sobreAc, 'arco = ' + arco);
    verdad('Q ' + nom + ': spinner, arco contra el acento >= 3:1 (objeto grafico)', cArco >= 3.0,
           arco + ' sobre ' + ac + ' = ' + f2(cArco) + ':1');
    verdad('Q ' + nom + ': spinner, el anillo viene de --spinner-anillo (' + t('--spinner-anillo') + ')', anillo === t('--spinner-anillo').toUpperCase(), 'anillo = ' + anillo);
    verdad('Q ' + nom + ': spinner, arco contra anillo >= 3:1', cArcoAnillo >= 3.0,
           arco + ' sobre ' + anillo + ' = ' + f2(cArcoAnillo) + ':1');
    var cAviso = K(avc, tar);
    verdad('Q ' + nom + ': aviso-sub usa --texto-suave', avc === t('--texto-suave').toUpperCase(), 'aviso-sub = ' + avc + ', --texto-suave = ' + t('--texto-suave'));
    verdad('Q ' + nom + ': aviso-sub >= 4.6:1 sobre la tarjeta', cAviso >= 4.6, avc + ' sobre ' + tar + ' = ' + f2(cAviso) + ':1');
    F.push(col(nom, 16) + col(ac, 10) + col(arco, 10) + col(anillo, 10) + col(f2(cArco), 14) + col(f2(cArcoAnillo), 14) + col(avc, 10) + f2(cAviso));
    // sin aclarar: lo que daría la base si aclararHasta() no hiciera nada
    var sinS = K('#888888', tar), sinT = K('#E8E6E0', tar);
    E.push(col(nom, 16) + col(tar, 10) + col(f2(sinS), 18) + col(f2(K(t('--texto-suave'), tar)), 20) +
           col(f2(sinT), 21) + f2(K(t('--texto'), tar)));
    verdad('Q ' + nom + ': texto suave APLICADO cumple 4.5:1 sobre la tarjeta', hero >= 4.5, f2(hero) + ':1');
    verdad('Q ' + nom + ': texto normal APLICADO cumple 4.5:1 sobre la tarjeta', cuerpo >= 4.5, f2(cuerpo) + ':1');
  }
  informe.push('', '── Q1. TEXTO NORMAL (umbral 4,5:1) — contraste real, 5 pares de la página ──',
    col('color de marca', 22) + col('cuerpo', 8) + col('hero', 8) + col('h1', 8) + col('prefijo', 8) + col('label', 8) + 'peor');
  informe = informe.concat(A);
  informe.push('', '── Q2. TEXTO GRANDE (umbral 3:1) — el peor de los 5 pares ──');
  informe = informe.concat(B);
  informe.push('', '── Q3. BORDES: tarjeta SUTIL (como hoy) / input y prefijo >= 3,1:1 ──',
    'hoy: #222222 sobre #08090D = ' + f2(K('#222222', '#08090D')) + ':1 (borde de tarjeta sin tema)',
    col('color de marca', 16) + col('tarjeta/fondo', 14) + 'input/tarjeta');
  informe = informe.concat(C3);
  informe.push('', '── Q4. ACENTO y BOTÓN (texto 4,5:1 · borde 3:1 · botón 4,5:1) ──',
    col('color de marca', 16) + col('acento', 10) + col('acento/tarjeta', 16) + col('acento/fondo', 14) + col('boton', 12) + 'boton hover');
  informe = informe.concat(D);
  informe.push('', '── Q5. ¿HACE ALGO aclararHasta() EN EL TEXTO GRIS? (sin aclarar vs aplicado, sobre la tarjeta) ──',
    col('color de marca', 16) + col('tarjeta', 10) + col('#888 sin aclarar', 18) + col('texto-suave aplic.', 20) +
    col('#E8E6E0 sin aclarar', 21) + 'texto aplicado');
  informe = informe.concat(E);
  informe.push('', '-- Q6. SPINNER y AVISO-SUB en el DOM real (arco = texto del boton; anillo derivado, arco/anillo >= 3:1) --',
    col('color de marca', 16) + col('acento', 10) + col('arco', 10) + col('anillo', 10) + col('arco/acento', 14) + col('arco/anillo', 14) + col('aviso-sub', 10) + 'aviso/tarjeta');
  informe = informe.concat(F);
  await sinTema(txtOriginal);
}

// ─── grupo R: la pagina no se desborda a 400, 360 y 320 px ─────────────────
// Se mide en un iframe de ESE ancho y alto de sobra (1400 px) para que no haya
// barra vertical que reste ancho. scrollWidth > innerWidth = scroll horizontal.
// 400 y 360 son comprobaciones; 320 se informa pero no falla.
async function grupoR(txtOriginal) {
  var NOMBRE_LARGO = 'Peluqueria y Barberia Essentials Studio Providencia Premium Club';
  var casos = [['sin tema', null, 'Sin tema'], ['violeta', '#3104F2', 'ZZ prueba'],
               ['blanco', '#FFFFFF', 'Essentials'], ['amarillo puro', '#FFFF00', 'Amarillo'],
               ['nombre largo + logo', '#3104F2', NOMBRE_LARGO]];
  var filas = [];
  for (var a = 0; a < 3; a++) {
    var ancho = [400, 360, 320][a];
    for (var i = 0; i < casos.length; i++) {
      var w = await montar(prepararPagina(txtOriginal), ancho, 1400);
      await correrPagina(w, { nombre: casos[i][2], whatsapp: null, foto_portada: null,
        logo_url: casos[i][0] === 'nombre largo + logo' ? 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#888"/></svg>') : null,
        color_marca: casos[i][1], color_fondo_logo: null });
      var d = w.document.documentElement;
      var sw = d.scrollWidth, iw = w.innerWidth, cw = d.clientWidth, bw = w.document.body.scrollWidth;
      filas.push(col(ancho + ' px', 8) + col(casos[i][0], 22) + col(iw, 10) + col(cw, 10) + col(sw, 13) + col(bw, 14) + (sw <= iw && sw <= cw ? 'sin desborde' : 'DESBORDA'));
      if (ancho >= 360) {
        verdad('R ' + ancho + ' px, ' + casos[i][0] + ': scrollWidth <= innerWidth', sw <= iw, 'scrollWidth ' + sw + ' > innerWidth ' + iw);
        verdad('R ' + ancho + ' px, ' + casos[i][0] + ': scrollWidth <= clientWidth', sw <= cw, 'scrollWidth ' + sw + ' > clientWidth ' + cw);
      }
    }
  }
  informe.push('', '-- R. DESBORDE HORIZONTAL (scrollWidth contra innerWidth; 320 px solo informativo) --',
    col('ancho', 8) + col('caso', 22) + col('innerW', 10) + col('clientW', 10) + col('scrollW doc', 13) + col('scrollW body', 14) + 'veredicto');
  informe = informe.concat(filas);
}
// ─── grupo S: barrido de 60 colores de marca para el anillo del spinner ────
// 12 tonos x 4 combinaciones de saturacion y luminosidad (48) + 12 extremos.
// Cada color monta una pagina, mete un spinner en #btn-unirme y mide en el DOM
// real. Se exige arco/anillo >= 3:1 (WCAG, objeto grafico) y >= 3,1:1 (con la
// misma holgura de 0,1 que el resto del archivo): con 3,1 el bucle de ajuste de
// aplicarTemaPublico() deja de ser invisible para el arnes.
function hsl2hex(h, s, l) {
  s /= 100; l /= 100;
  var a = s * Math.min(l, 1 - l);
  function f(n) { var k = (n + h / 30) % 12;
    var c = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
    return ('0' + Math.round(255 * c).toString(16)).slice(-2); }
  return ('#' + f(0) + f(8) + f(4)).toUpperCase();
}
async function grupoS(txtOriginal) {
  var cols = [], h, j, combos = [[100, 50], [100, 20], [100, 80], [55, 40]];
  for (h = 0; h < 360; h += 30) for (j = 0; j < combos.length; j++) cols.push(hsl2hex(h, combos[j][0], combos[j][1]));
  cols = cols.concat(['#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00',
                      '#00FFFF', '#FF00FF', '#010101', '#FEFEFE', '#808080', '#7F7F7F']);
  var res = [], peorAA = 99, peorAC = 99, cuentaBajo31 = 0, sinAnillo = 0, malArco = 0;
  for (var i = 0; i < cols.length; i++) {
    var w = await montar(prepararPagina(txtOriginal));
    await correrPagina(w, { nombre: 'S', whatsapp: null, foto_portada: null, logo_url: null,
                            color_marca: cols[i], color_fondo_logo: null });
    var doc = w.document, btnU = doc.getElementById('btn-unirme');
    var sp = doc.createElement('span'); sp.className = 'spinner';
    if (btnU) btnU.appendChild(sp);
    var cs = w.getComputedStyle(sp);
    var arco = rgbAHex(cs.borderTopColor), anillo = rgbAHex(cs.borderLeftColor);

         w8.document.getElementById('h-nombre').textContent.indexOf('Tema que explota') !== -1,
         'h-nombre = ' + w8.document.getElementById('h-nombre').textContent);

         w8.document.body.innerHTML.indexOf('WhatsApp') !== -1,

  verdad('P0 el arnes quito init() de la pagina', verdadGlobalInit);
}

// ─── grupo E: el lado escritor de app.html ─────────────────────────────
function prepararApp(txt) {
  return txt.replace(/^init\(\);\s*$/m, '');
}

// Deja S, sb y notify controlados y devuelve el registro de lo que pasó.
function stubsApp(w, opciones) {
  opciones = opciones || {};
  w.eval([
    'window.__reg = { orden: [], updates: [], uploads: [], notifs: [] };',
    'notify = function (m, t) { window.__reg.notifs.push((t || "ok") + ": " + m); };',
    'S.barberia = { id: "TEST-ID", logo_url: null, color_marca: null, modo_tema: "auto", color_fondo_logo: ' +
      JSON.stringify(opciones.fondoPrevio === undefined ? null : opciones.fondoPrevio) + ' };',
    'S.perfil = { rol: "dueno" };',
    'sb.storage = { from: function(){ return {',
    '  upload: async function (p) {',
    '    window.__reg.orden.push("upload:inicio");',
    '    window.__reg.uploads.push(p);',
    '    await new Promise(function(r){ r(); });',
    '    window.__reg.orden.push("upload:fin");',
    '    return { error: null };',
    '  },',
    '  getPublicUrl: function (p) { return { data: { publicUrl: "https://x/storage/v1/object/public/fotos/" + p } }; },',
    '  remove: async function (a) { window.__reg.orden.push("remove"); return { data: [], error: null }; }',
    '}; } };',
    'sb.from = function(){ return { update: function (o) {',
    '    window.__reg.updates.push(JSON.parse(JSON.stringify(o)));',
    '    return { eq: function () { return {',
    '      select: function () { return { maybeSingle: async function () {',
    '        var r = {};',
    '        if ("logo_url" in o) r.logo_url = o.logo_url;',
    '        if ("color_fondo_logo" in o) r.color_fondo_logo = o.color_fondo_logo;',
    '        return { data: r, error: null };',
    '      } }; },',
    '      then: undefined',
    '    }; } };',
    '  },',
    '  select: function(){ return { eq: function(){ return { single: async function(){',
    '    var u = window.__reg.updates[window.__reg.updates.length - 1] || {};',
    '    return { data: { color_marca: u.color_marca, modo_tema: u.modo_tema,',
    '                     color_fondo_logo: ("color_fondo_logo" in u) ? u.color_fondo_logo : S.barberia.color_fondo_logo },',
    '             error: null };',
    '  } }; } }; }',
    '}; };'
  ].join('\n'));
}

async function grupoE(txtApp) {
  // E1 — el análisis corre EN PARALELO con la subida, no antes.
  // Se detecta por el ORDEN: si fuera secuencial, "analisis:fin" llegaría
  // antes de "upload:inicio".
  var wA = await montar(prepararApp(txtApp));
  stubsApp(wA);
  wA.eval([
    'extraerPaleta = async function () {',
    '  window.__reg.orden.push("analisis:inicio");',
    '  for (var i = 0; i < 6; i++) await new Promise(function(r){ r(); });',
    '  window.__reg.orden.push("analisis:fin");',
    '  return { fondo: "#101820", fondoUniforme: true, fondoTransparente: false };',
    '};',
    'temaRefrescar = async function(){ return undefined; };'
  ].join('\n'));
  await wA.eval('subirLogoBlob(new Blob([new Uint8Array([1,2,3])],{type:"image/webp"}))');
  var orden = wA.eval('window.__reg.orden.join(",")');
  var iUp = orden.split(',').indexOf('upload:inicio');
  var iFin = orden.split(',').indexOf('analisis:fin');
  verdad('E1 el analisis corre en PARALELO con la subida', iUp !== -1 && iFin !== -1 && iUp < iFin,
         'orden = ' + orden);

  // E2 — un solo update, con las DOS columnas.
  var ups = JSON.parse(wA.eval('JSON.stringify(window.__reg.updates)'));
  check('E2 subirLogoBlob hace UN solo update', ups.length, 1);
  verdad('E2 ese update trae logo_url', ups[0] && 'logo_url' in ups[0], JSON.stringify(ups[0]));
  verdad('E2 ese update trae color_fondo_logo', ups[0] && 'color_fondo_logo' in ups[0], JSON.stringify(ups[0]));
  check('E2 con fondo uniforme y opaco escribe el fondo', ups[0] && ups[0].color_fondo_logo, '#101820');
  verdad('E2 NO escribe modo_tema', ups[0] && !('modo_tema' in ups[0]), JSON.stringify(ups[0]));
  verdad('E2 NO escribe color_marca', ups[0] && !('color_marca' in ups[0]), JSON.stringify(ups[0]));

  // E3 — análisis fallido en la SUBIDA: escribe NULL (el logo cambió, el
  // valor viejo ya no describe nada).
  var wB = await montar(prepararApp(txtApp));
  stubsApp(wB, { fondoPrevio: '#AABBCC' });
  wB.eval([
    'extraerPaleta = async function () { return null; };',
    'temaRefrescar = async function(){ return undefined; };'
  ].join('\n'));
  await wB.eval('subirLogoBlob(new Blob([new Uint8Array([1])],{type:"image/webp"}))');
  var upsB = JSON.parse(wB.eval('JSON.stringify(window.__reg.updates)'));
  verdad('E3 subida con analisis fallido incluye la columna', upsB[0] && 'color_fondo_logo' in upsB[0], JSON.stringify(upsB[0]));
  check('E3 y la escribe en NULL, no deja el valor viejo', upsB[0] && upsB[0].color_fondo_logo, 'null');

  // E4 — fondo NO uniforme en la subida: NULL.
  var wC = await montar(prepararApp(txtApp));
  stubsApp(wC);
  wC.eval([
    'extraerPaleta = async function () { return { fondo: "#101820", fondoUniforme: false, fondoTransparente: false }; };',
    'temaRefrescar = async function(){ return undefined; };'
  ].join('\n'));
  await wC.eval('subirLogoBlob(new Blob([new Uint8Array([1])],{type:"image/webp"}))');
  check('E4 fondo no uniforme -> NULL',
        JSON.parse(wC.eval('JSON.stringify(window.__reg.updates)'))[0].color_fondo_logo, 'null');

  // E5 — logo transparente en la subida: NULL.
  var wD = await montar(prepararApp(txtApp));
  stubsApp(wD);
  wD.eval([
    'extraerPaleta = async function () { return { fondo: "#101820", fondoUniforme: true, fondoTransparente: true }; };',
    'temaRefrescar = async function(){ return undefined; };'
  ].join('\n'));
  await wD.eval('subirLogoBlob(new Blob([new Uint8Array([1])],{type:"image/webp"}))');
  check('E5 logo transparente -> NULL',
        JSON.parse(wD.eval('JSON.stringify(window.__reg.updates)'))[0].color_fondo_logo, 'null');

  // ── temaGuardar: los TRES estados ───────────────────────────────────
  // E6 — análisis VIGENTE con fondo bueno: escribe el fondo.
  var wE = await montar(prepararApp(txtApp));
  stubsApp(wE, { fondoPrevio: '#AABBCC' });
  wE.eval([
    'TEMA.color = "#3104F2"; TEMA.modo = "oscuro";',
    'TEMA.turno = 3; TEMA.turnoResuelto = 3;',
    'TEMA.an = { fondo: "#101820", fondoUniforme: true, fondoTransparente: false, modoSugerido: "oscuro" };'
  ].join('\n'));
  await wE.eval('temaGuardar()');
  var upsE = JSON.parse(wE.eval('JSON.stringify(window.__reg.updates)'));
  verdad('E6 analisis vigente: incluye color_fondo_logo', upsE[0] && 'color_fondo_logo' in upsE[0], JSON.stringify(upsE[0]));
  check('E6 y escribe el fondo detectado', upsE[0] && upsE[0].color_fondo_logo, '#101820');

  // E7 — análisis PENDIENTE: NO toca la columna.
  var wF = await montar(prepararApp(txtApp));
  stubsApp(wF, { fondoPrevio: '#AABBCC' });
  wF.eval([
    'TEMA.color = "#3104F2"; TEMA.modo = "oscuro";',
    'TEMA.turno = 4; TEMA.turnoResuelto = 3;',   // el turno 4 todavia no resolvio
    'TEMA.an = { fondo: "#101820", fondoUniforme: true, fondoTransparente: false, modoSugerido: "oscuro" };'
  ].join('\n'));
  await wF.eval('temaGuardar()');
  var upsF = JSON.parse(wF.eval('JSON.stringify(window.__reg.updates)'));
  verdad('E7 analisis PENDIENTE: NO incluye color_fondo_logo', upsF[0] && !('color_fondo_logo' in upsF[0]), JSON.stringify(upsF[0]));
  verdad('E7 pero si guarda color_marca y modo_tema', upsF[0] && 'color_marca' in upsF[0] && 'modo_tema' in upsF[0], JSON.stringify(upsF[0]));

  // E8 — análisis FALLIDO (turno resuelto, an null): NO toca la columna.
  var wG = await montar(prepararApp(txtApp));
  stubsApp(wG, { fondoPrevio: '#AABBCC' });
  wG.eval([
    'TEMA.color = "#3104F2"; TEMA.modo = "oscuro";',
    'TEMA.turno = 2; TEMA.turnoResuelto = 2; TEMA.an = null;'
  ].join('\n'));
  await wG.eval('temaGuardar()');
  var upsG = JSON.parse(wG.eval('JSON.stringify(window.__reg.updates)'));
  verdad('E8 analisis FALLIDO: NO incluye color_fondo_logo', upsG[0] && !('color_fondo_logo' in upsG[0]), JSON.stringify(upsG[0]));

  // E9 — análisis vigente con fondo NO uniforme: acá SÍ escribe NULL,
  // porque el análisis es la autoridad y dice que no hay fondo que usar.
  var wH = await montar(prepararApp(txtApp));
  stubsApp(wH, { fondoPrevio: '#AABBCC' });
  wH.eval([
    'TEMA.color = "#3104F2"; TEMA.modo = "oscuro";',
    'TEMA.turno = 1; TEMA.turnoResuelto = 1;',
    'TEMA.an = { fondo: "#101820", fondoUniforme: false, fondoTransparente: false, modoSugerido: "oscuro" };'
  ].join('\n'));
  await wH.eval('temaGuardar()');
  var upsH = JSON.parse(wH.eval('JSON.stringify(window.__reg.updates)'));
  verdad('E9 fondo no uniforme con analisis vigente: incluye la columna', upsH[0] && 'color_fondo_logo' in upsH[0], JSON.stringify(upsH[0]));
  check('E9 y la escribe en NULL', upsH[0] && upsH[0].color_fondo_logo, 'null');
}

// ─── grupo M: lo extra que usa club.html en modo claro ────────────────
// Mismos 60+ colores del grupo L. Insignias, chip, éxito y niveles son TEXTO:
// deben leerse. Además, club.html no puede tener un color a mano que no sea una
// variable (salvo la lista cerrada de abajo): un hex suelto no cambia con el modo.
async function grupoM(txtOriginal, txtClub, txtReservar) {
  var casos = COLORES_L.slice();
  for (var i = 0; i < 20; i++) { var h = i * 18; casos.push(['h' + h + ' vivo', hsl2hex(h, 1, 0.5), null]); casos.push(['h' + h + ' claro', hsl2hex(h, 0.9, 0.78), null]); casos.push(['h' + h + ' oscuro', hsl2hex(h, 0.8, 0.22), null]); }
  var w = await montar(prepararPagina(txtOriginal)), K = w.contrasteHex, fallos = [], minB = 99, minN = 99, minC = 99;
  for (var j = 0; j < casos.length; j++) {
    var c = casos[j], v = w.derivarSuperficies({ modo: 'claro', colorMarca: c[1], colorFondoLogo: c[2] });
    var fon = v['--fondo'], tar = v['--tarjeta'];
    var ins = Math.min(K(v['--b-silver-texto'], v['--b-silver-fondo']), K(v['--b-gold-texto'], v['--b-gold-fondo']), K(v['--b-blue-texto'], v['--b-blue-fondo']), K(v['--b-green-texto'], v['--b-green-fondo']));
    var niv = Math.min(K(v['--nivel-0'], fon), K(v['--nivel-1'], fon), K(v['--nivel-2'], fon), K(v['--nivel-3'], fon), K(v['--nivel-0'], tar), K(v['--nivel-3'], tar));
    var chip = Math.min(K(v['--chip-texto'], v['--chip-fondo']), K(v['--texto-sobre-acento'], v['--acento']));
    var exito = Math.min(K(v['--exito'], fon), K('#FFFFFF', v['--exito']));
    var apag = Math.min(K(v['--texto-apagado'], fon), K(v['--texto-tenue'], fon), K(v['--texto-bio'], fon), K(v['--acento'], v['--aviso-fondo']));
    minB = Math.min(minB, ins); minN = Math.min(minN, niv); minC = Math.min(minC, chip);
    if (ins < 4.5 || niv < 4.5 || chip < 4.5 || exito < 4.5 || apag < 4.5) fallos.push(c[0] + ' ' + c[1] + ': insignias ' + f2(ins) + ' niveles ' + f2(niv) + ' chip ' + f2(chip) + ' éxito ' + f2(exito) + ' apagado ' + f2(apag));
  }
  verdad('M ' + casos.length + ' colores en claro: insignias, niveles, chip, éxito y textos apagados >= 4.5:1 (mín. insignia ' + f2(minB) + ', nivel ' + f2(minN) + ', chip ' + f2(minC) + ')', fallos.length === 0, fallos.slice(0, 3).join(' | '));
  var dark = w.derivarSuperficies({ modo: 'oscuro', colorMarca: '#3104F2', colorFondoLogo: null });
  verdad('M en oscuro NO se escribe ninguna de las variables extra de club (quedan los colores de siempre)', !('--b-gold-fondo' in dark) && !('--nivel-1' in dark) && !('--chip-fondo' in dark));
  var paginas = [['club.html', txtClub], ['reservar.html', txtReservar]];
  for (var q = 0; q < paginas.length; q++) {
    var nomP = paginas[q][0], txtClub = paginas[q][1];
  var css = txtClub.slice(txtClub.indexOf('<style>'), txtClub.indexOf('</style>'));
  var sinRoot = css.replace(/:root\{[\s\S]*?\n\}/, '');
  var sueltos = (sinRoot.match(/#[0-9a-fA-F]{3,6}\b/g) || []).filter(function (x) { return ['#fff', '#0a0a0a', '#d4a853'].indexOf(x.toLowerCase()) < 0; });
  verdad('M ' + nomP + ': el CSS no tiene colores sueltos fuera de :root (salvo #fff del check, #0a0a0a y #d4a853 del horario elegido)', sueltos.length === 0, sueltos.slice(0, 5).join(' '));
  verdad('M ' + nomP + ' pide color_marca, color_fondo_logo y modo_tema y llama a aplicarTemaPublico', (nomP === 'reservar.html' || /color_marca,color_fondo_logo,modo_tema/.test(txtClub)) && /aplicarTemaPublico\(barb\)/.test(txtClub));
  }
}
