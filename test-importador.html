<script>
// ═══════════════════════════════════════════════════════════════════════
// Prueba el IMPORTADOR REAL de app.html: baja app.html, le quita `init();`,
// la monta en un iframe y parchea sb, S y notify. Cada caso carga un archivo
// como lo haría el usuario (impLeerArchivo → mapeo → vista previa →
// impEjecutarImportacion) y mira lo que habría escrito en la base. NADA de
// esto toca la base real: sb.from('clientes') es un simulador en memoria.
//
// CÓMO CORRERLO (igual que test-paginas-publicas-tema.html):
//   chrome --headless --allow-file-access-from-files \
//          --virtual-time-budget=120000 --dump-dom "file:///.../test-importador.html"
// El veredicto se lee en la CLASE del <pre id="resultado"> (ok o fail), NUNCA
// buscando un texto de éxito en la salida.
//
// ARCHIVOS DE PRUEBA DE MARIO: viven FUERA del repo, en el Escritorio. El
// grupo Z los usa si los encuentra y, si no, lo dice en el informe (no falla,
// pero tampoco da por probado lo que no probó).
// ═══════════════════════════════════════════════════════════════════════

var RUTA_ARCHIVOS_MARIO = 'file:///C:/Users/MARIO/Desktop/Reservia%20-%20archivos%20de%20prueba/';

var total = 0, fallas = [], informe = [];
function check(nombre, obtenido, esperado) {
  total++;
  var ok = String(obtenido) === String(esperado);
  if (!ok) fallas.push(nombre + '\n      obtenido: ' + obtenido + '\n      esperado: ' + esperado);
  return ok;
}
function verdad(nombre, cond, detalle) {
  total++;
  if (!cond) fallas.push(nombre + (detalle ? '\n      ' + detalle : ''));
  return !!cond;
}
function bajar(url) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onload = function () { res(x.responseText); };
    x.onerror = function () { rej(new Error('no se pudo bajar ' + url)); };
    x.send();
  });
}
function montar(html) {
  return new Promise(function (res) {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:900px;height:600px;position:absolute;left:-9999px';
    f.srcdoc = html;
    f.addEventListener('load', function () { res(f.contentWindow); });
    document.body.appendChild(f);
  });
}
function prepararApp(txt) { return txt.replace(/^init\(\);\s*$/m, ''); }

// ── bytes de archivos ────────────────────────────────────────────────────
function utf8(s) { return new TextEncoder().encode(s); }
// Windows-1252 para el rango Latin-1 que usamos (é, ñ, ó, í, á, ú): un byte por carácter.
function cp1252(s) {
  var a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255;
  return a;
}

// ── simulador de la base ────────────────────────────────────────────────
// Registra todo lo que el importador escribiría. `clientes` es la tabla
// inicial; las altas y los updates la modifican, así que un loadClientes()
// posterior ve lo importado. fallaPagina: índice de la página de lectura que
// debe devolver error (null = ninguna).
function prepararSim(w, clientes, fallaPagina) {
  w.eval([
    'window.__reg = { inserts: [], updates: [], notifs: [], paginas: [] };',
    'notify = function (m, t) { window.__reg.notifs.push((t || "ok") + ": " + m); };',
    'renderClientes = function () {}; renderDashboard = function () {};',
    'S.barberia = { id: "TEST-ID" }; S.barberos = [{ nombre: "Carlos" }, { nombre: "Marta" }];',
    'window.__tabla = ' + JSON.stringify(clientes) + ';',
    'window.__falla = ' + (fallaPagina == null ? 'null' : fallaPagina) + ';',
    'sb.from = function (t) {',
    '  if (t !== "clientes") throw new Error("tabla inesperada: " + t);',
    '  return {',
    '    select: function () { var q = { eq: function () { return q; }, order: function () { return q; },',
    '      range: function (a, b) { var n = window.__reg.paginas.length; window.__reg.paginas.push([a, b]);',
    '        if (window.__falla === n) return Promise.resolve({ data: null, error: { message: "falla simulada" } });',
    '        return Promise.resolve({ data: window.__tabla.slice(a, b + 1), error: null }); } }; return q; },',
    '    insert: function (rows) { window.__reg.inserts.push(JSON.parse(JSON.stringify(rows)));',
    '      rows.forEach(function (r, i) { window.__tabla.unshift(Object.assign({ id: "n" + window.__tabla.length + "-" + i, created_at: "2026-10-31" }, r)); });',
    '      return Promise.resolve({ error: null }); },',
    '    update: function (p) { return { eq: function (c, id) {',
    '      window.__reg.updates.push({ id: id, payload: JSON.parse(JSON.stringify(p)) });',
    '      var f = window.__tabla.find(function (x) { return x.id === id; }); if (f) Object.assign(f, p);',
    '      return Promise.resolve({ error: null }); } }; }',
    '  };',
    '};'
  ].join('\n'));
}
function reg(w) { return JSON.parse(w.eval('JSON.stringify(window.__reg)')); }
function cont(w) {
  var g = function (id) { return w.document.getElementById(id).textContent; };
  return { nuevos: g('imp-cnt-nuevos'), existen: g('imp-cnt-dup'), archivo: g('imp-cnt-arch'), tel: g('imp-cnt-tel'), err: g('imp-cnt-err') };
}

// Flujo real de un archivo. Devuelve lo que el usuario vería y lo que se escribió.
async function importar(w, clientes, nombreArchivo, bytes, o) {
  o = o || {};
  prepararSim(w, clientes, o.fallaPagina);
  await w.loadClientes();
  w.eval('window.__reg.paginas = [];');
  var file = new w.File([bytes], nombreArchivo, { type: o.tipo || '' });
  await w.impLeerArchivo({ files: [file] });
  if (o.mapeo) Object.keys(o.mapeo).forEach(function (c) { w.impCambiarMapeo(c, o.mapeo[c]); });
  w.impIrPaso(3);
  if (o.masiva) w.impAplicarAccionMasiva(o.masiva);
  var prev = JSON.parse(w.eval('JSON.stringify((IMP.processed || []).map(function (r) { return { fila: r.fila, estado: r.estado, motivo: r.motivo, tel: r.data.whatsapp, nombre: r.data.nombre, por: r.dupPor, dupFila: r.dupFila, acc: r.accion, avisos: r.avisos, correoInvalido: r.correoInvalido, completa: r.completa ? r.completa.etiquetas : null }; }))'));
  var c = cont(w);
  if (o.ejecutar) await w.impEjecutarImportacion();
  return { prev: prev, cont: c, reg: reg(w), codif: w.eval('IMP.codificacion'), info: w.document.getElementById('imp-info-lectura').textContent, nota: w.eval('IMP.notaTelefono'), mapping: JSON.parse(w.eval('JSON.stringify(IMP.mapping)')) };
}
function porFila(r, fila) { return r.prev.filter(function (x) { return x.fila === fila; })[0] || {}; }

function ficha(id, extra) {
  return Object.assign({ id: id, nombre: 'X', apellido: '', whatsapp: '', email: '', cumpleanos: null, canal: 'Reserva online', notas: '', barbero_preferido: null, created_at: '2026-01-01' }, extra || {});
}

var ESPERADO_Z = {
  '1': { nuevos: 300, tel: 0, arch: 0, err: 0, etiqueta: 'archivo 1 (encabezados en inglés)' },
  '2': { nuevos: 300, tel: 0, arch: 0, err: 0, columna: 'Celular', etiqueta: 'archivo 2 (dos columnas de teléfono)' },
  '3': { nuevos: 300, tel: 0, arch: 0, err: 0, etiqueta: 'archivo 3' },
  '4': { filas: 15, nuevos: 6, arch: 2, tel: 6, err: 1, etiqueta: 'archivo 4 (casos difíciles)' },
  '5': { nuevos: 1500, arch: 15, tel: 0, err: 0, etiqueta: 'archivo 5 (1500 filas)' }
};
function listarCarpeta(url) {                    // el listado de carpeta de Chrome en file:// trae addRow("nombre", ...)
  return bajar(url).then(function (html) {
    var nombres = [], re = /addRow\("([^"]+)"/g, m;
    while ((m = re.exec(html))) nombres.push(m[1]);
    return nombres;
  }, function () { return []; });
}
function bajarBin(url) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest(); x.open('GET', url, true); x.responseType = 'arraybuffer';
    x.onload = function () { if (x.status === 0 || x.status === 200) res(new Uint8Array(x.response)); else rej(new Error('estado ' + x.status)); };
    x.onerror = function () { rej(new Error('no se pudo bajar ' + url)); };
    x.send();
  });
}

      r.cont = cont(w);
    }
    var fila = esp.etiqueta + ': ';
    check('Z ' + esp.etiqueta + ': nuevos', r.cont.nuevos, esp.nuevos);
    check('Z ' + esp.etiqueta + ': repetidos en el archivo', r.cont.archivo, esp.arch);
    check('Z ' + esp.etiqueta + ': sin teléfono válido', r.cont.tel, esp.tel);
    check('Z ' + esp.etiqueta + ': sin nombre', r.cont.err, esp.err);
    check('Z ' + esp.etiqueta + ': ya existen (la base simulada está vacía)', r.cont.existen, '0');
    if (esp.columna) check('Z ' + esp.etiqueta + ': se elige la columna ' + esp.columna + ', no Teléfono', w.eval('IMP.mapping.whatsapp'), esp.columna);
    if (esp.filas) check('Z ' + esp.etiqueta + ': filas con datos', w.eval('IMP.processed.length'), esp.filas);
    informe.push(fila + 'codificación = ' + (r.codif || '(xlsx)') + ' · nuevos ' + r.cont.nuevos + ' · repetidos ' + r.cont.archivo + ' · sin teléfono ' + r.cont.tel + ' · sin nombre ' + r.cont.err);
  }
}
