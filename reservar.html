<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Los links cortos viven en /reservar/<negocio>/<profesional>: sin esto, los
     archivos relativos (supabase-config.js, tema.js…) se buscarían dentro de esa ruta. -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar hora</title>
<!-- Ícono real al "Agregar a inicio": manifest y apple-touch-icon se
     completan en runtime (configurarManifestDinamico(), en init()) con el
     logo_url del negocio actual — estos tags arrancan vacíos/genéricos. -->
<link rel="manifest" id="dynamic-manifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" id="apple-title" content="Reservar">
<link rel="apple-touch-icon" id="apple-touch-icon-link" href="/mi-agenda-icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* TEMA PÚBLICO: valores por defecto = los colores de siempre; ver club.html y tema.js */
:root{
  --acento:#7c6af7;--acento-2:#5b8def;--acento-hover:#6b59e6;--acento-2-hover:#4a7cde;--texto-sobre-acento:#fff;--spinner-anillo:#333;
  --fondo:#08090d;--portada-fondo:#0d0e18;--tarjeta:#0f1018;--borde:#222;--input-fondo:#161616;--input-borde:#252525;--fondo-logo:#12131f;
  --texto:#e8e6e0;--texto-fuerte:#fff;--texto-suave:#888;--texto-medio:#777;--texto-debil:#555;--texto-apagado:#666;--texto-tenue:#444;--texto-inerte:#333;
  --borde-suave:#1a1a1a;--borde-2:#2a2a2a;--borde-fuerte:#555;--superficie-2:#1a1a1a;--seleccion-fondo:#1a1a18;--info-fondo:#151520;
  --chip-fondo:#13142a;--chip-texto:#c9c3ff;--exito:#4caf87;
  --alerta-fondo:#1f0000;--alerta-borde:#e05050;--alerta-texto:#e05050;
  --wa-fondo:#002210;--wa-borde:#25d366;--wa-texto:#25d366;--wa-hover:#003318;
  --b-silver-fondo:#2a2a2a;--b-silver-texto:#ccc;--b-gold-fondo:#3a2f10;--b-gold-texto:#d4a853;
  --b-blue-fondo:#13142a;--b-blue-texto:#6ab0e0;--b-green-fondo:#0f2a1a;--b-green-texto:#5cd685;
  --texto-bio:#999;--aviso-fondo:#1f1600;--aviso-borde:#d4a853;
  --nivel-0:#aaa;--nivel-1:#d4a853;--nivel-2:#6ab0e0;--nivel-3:#5cd685;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh}
.portada-wrap{width:100%;max-height:220px;overflow:hidden;background:var(--portada-fondo)}
.portada-wrap img{width:100%;height:220px;object-fit:cover;display:block}
.header{padding:20px 24px;border-bottom:0.5px solid var(--borde);display:flex;align-items:center;gap:12px}
.header-logo{font-size:22px;flex-shrink:0}
.header-logo-img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex-shrink:0;background:var(--fondo-logo)}
.header-info h1{font-size:16px;font-weight:600;color:var(--texto-fuerte)}
.header-info p{font-size:12px;color:var(--texto-debil);margin-top:2px}
.header-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:11px;color:var(--texto-medio)}
.header-meta a{color:var(--acento);text-decoration:none}
.header-meta a:hover{text-decoration:underline}
.header-descripcion{font-size:12px;color:var(--texto-suave);line-height:1.5;margin-top:8px}
@media(max-width:480px){.portada-wrap img{height:130px}}
.container{max-width:640px;margin:0 auto;padding:24px 16px}
.steps{display:flex;gap:0;margin-bottom:28px;border-bottom:0.5px solid var(--borde)}
.step-tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--texto-tenue);border-bottom:2px solid transparent;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden}
.step-tab::before{content:attr(data-num);display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--superficie-2);color:var(--texto-apagado);font-size:10px;font-weight:600;flex-shrink:0}
.step-tab .step-label{overflow:hidden;text-overflow:ellipsis}
.step-tab.active{color:var(--acento);border-bottom-color:var(--acento)}
.step-tab.active::before{background:var(--acento);color:var(--texto-sobre-acento)}
.step-tab.done{color:var(--exito)}
.step-tab.done::before{background:var(--exito);color:#fff;content:'✓'}
.step-content{display:none}.step-content.active{display:block}
.card{background:var(--tarjeta);border:0.5px solid var(--borde);border-radius:12px;padding:20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--texto);margin-bottom:14px}
.servicio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.servicio-elegido{font-size:12px;color:var(--texto-suave);margin:-4px 0 14px;padding:9px 11px;border-radius:8px;background:var(--info-fondo);border:0.5px solid var(--borde-2)}
.servicio-elegido b{color:var(--texto);font-weight:600}
.servicio-card{border:0.5px solid var(--borde-2);border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s}
.servicio-card:hover{border-color:var(--borde-fuerte);background:var(--superficie-2)}
.servicio-card.selected{border-color:var(--acento);background:var(--seleccion-fondo)}
.servicio-nombre{font-size:13px;font-weight:600;color:var(--texto);margin-bottom:4px}
.servicio-precio{font-size:18px;font-weight:700;color:var(--acento)}
.servicio-dur{font-size:11px;color:var(--texto-debil);margin-top:4px}
.servicio-desc{font-size:11px;color:var(--texto-medio);margin-top:6px;line-height:1.4}
.profesional-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profesional-card{border:0.5px solid var(--borde-2);border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s;text-align:center}
.profesional-card:hover{border-color:var(--borde-fuerte);background:var(--superficie-2)}
.profesional-card.selected{border-color:var(--acento);background:var(--seleccion-fondo)}
.profesional-avatar{width:64px;height:64px;border-radius:50%;background:var(--seleccion-fondo);border:1px solid var(--borde-2);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 8px;overflow:hidden}
.profesional-nombre{font-size:12px;font-weight:600;color:var(--texto)}
.perfil-profesional{display:flex;gap:14px;align-items:center;margin-top:16px;padding-top:16px;border-top:0.5px solid var(--borde)}
.perfil-prof-foto{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0}
.perfil-prof-nombre{font-size:13px;font-weight:600;color:var(--texto);margin-bottom:4px}
.perfil-prof-bio{font-size:12px;color:var(--texto-bio);line-height:1.5}
.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-header{text-align:center;font-size:10px;color:var(--texto-tenue);padding:4px 0;font-weight:500;text-transform:uppercase}
.cal-day{text-align:center;padding:8px 4px;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.15s;border:0.5px solid transparent}
.cal-day.empty{cursor:default}
.cal-day.past{color:var(--texto-inerte);cursor:not-allowed}
.cal-day.available:hover{border-color:var(--borde-fuerte);background:var(--superficie-2)}
.cal-day.selected{background:linear-gradient(135deg,var(--acento),var(--acento-2));color:var(--texto-sobre-acento);font-weight:600}
.cal-day.today{border-color:var(--borde-fuerte)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{background:none;border:0.5px solid var(--borde-2);border-radius:6px;color:var(--texto-suave);padding:5px 10px;cursor:pointer;font-size:14px}
.cal-nav-btn:hover{color:var(--texto);border-color:var(--borde-fuerte)}
.cal-mes{font-size:13px;font-weight:600;color:var(--texto)}
.horarios{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.horario-btn{padding:9px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:0.5px solid var(--borde-2);background:transparent;color:var(--texto-suave);font-size:12px;cursor:pointer;transition:all 0.15s}
.horario-btn:hover:not(:disabled){border-color:var(--borde-fuerte);color:var(--texto);background:var(--superficie-2)}
.horario-btn.selected{background:#d4a853;color:#0a0a0a;border-color:var(--acento);font-weight:600}
.horario-btn:disabled{opacity:0.3;cursor:not-allowed}
.form-group{margin-bottom:12px}
label{font-size:11px;color:var(--texto-debil);display:block;margin-bottom:4px}
/* Eco del celular leído, debajo del campo. Mismo tamaño que label para que
   no compita con el input. El .ok/.mal lo pone ecoCelWsp(). */
.ayuda-wsp{font-size:11px;color:var(--texto-debil);margin-top:5px;line-height:1.5}
.ayuda-wsp b{color:var(--acento);font-weight:600}
.ayuda-wsp.mal{color:var(--alerta-texto)}
input,textarea{background:var(--input-fondo);border:0.5px solid var(--input-borde);border-radius:8px;color:var(--texto);padding:10px 12px;font-size:13px;width:100%;transition:border-color 0.15s;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--acento)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.btn-primary{background:linear-gradient(135deg,var(--acento),var(--acento-2));color:var(--texto-sobre-acento)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,var(--acento-hover),var(--acento-2-hover))}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--texto-medio);border:0.5px solid var(--borde-2);margin-top:8px}
.btn-ghost:hover{color:var(--texto)}
.btn-wa{display:block;text-decoration:none;text-align:center;background:var(--wa-fondo);color:var(--wa-texto);border:0.5px solid var(--wa-borde);margin-top:12px}
.btn-wa:hover{background:var(--wa-hover)}
/* El CSS del modal de ubicación y horario lo inyecta ubicacion-modal.js */
.resumen{background:var(--chip-fondo);border:0.5px solid var(--acento);border-radius:10px;padding:16px;margin-bottom:16px}
.resumen-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--borde-2);font-size:13px}
.resumen-row:last-child{border-bottom:none}
.resumen-label{color:var(--texto-apagado)}
.resumen-val{color:var(--texto);font-weight:500}
.success-screen{text-align:center;padding:40px 20px}
.success-icon{font-size:56px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:600;color:var(--texto-fuerte);margin-bottom:8px}
.success-sub{font-size:13px;color:var(--texto-debil);line-height:1.6}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px}
.alert-err{background:var(--alerta-fondo);border:0.5px solid var(--alerta-borde);color:var(--alerta-texto)}
.alert-warn{background:var(--aviso-fondo);border:0.5px solid var(--aviso-borde);color:var(--acento)}
.no-horarios{text-align:center;padding:20px;color:var(--texto-tenue);font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--spinner-anillo);border-top-color:var(--acento);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.servicio-grid{grid-template-columns:1fr}.profesional-grid{grid-template-columns:1fr 1fr}.horarios{grid-template-columns:repeat(3,1fr)}.fr{grid-template-columns:1fr}}
@media(max-width:400px){
  .step-label{display:none}
  .step-tab{padding:10px 2px}
  .container{padding:20px 12px}
  .horarios{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:340px){.horarios{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="portada-wrap" id="portada-wrap" style="display:none">
  <img id="portada-img" alt="">
</div>
<div class="header">
  <div class="header-logo" id="header-logo-glifo" style="background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">◈</div>
  <img id="header-logo-img" class="header-logo-img" style="display:none" alt="">
  <div class="header-info">
    <h1 id="h-nombre">Cargando...</h1>
    <p id="h-dir"></p>
    <div class="header-meta" id="header-meta"></div>
    <p class="header-descripcion" id="h-descripcion" style="display:none"></p>
  </div>
</div>

<div class="container">
  <div id="prof-preselec" style="display:none;margin-bottom:14px;padding:10px 14px;background:var(--chip-fondo);border:0.5px solid var(--acento);border-radius:8px;font-size:12px;color:var(--texto-bio);text-align:center"></div>
  <div class="steps">
    <div class="step-tab active" id="st-1" data-num="1"><span class="step-label">Servicio</span></div>
    <div class="step-tab" id="st-2" data-num="2"><span class="step-label">Profesional</span></div>
    <div class="step-tab" id="st-3" data-num="3"><span class="step-label">Fecha y hora</span></div>
    <div class="step-tab" id="st-4" data-num="4"><span class="step-label">Tus datos</span></div>
    <div class="step-tab" id="st-5" data-num="5"><span class="step-label">Confirmar</span></div>
  </div>

  <!-- PASO 1: Servicio -->
  <div class="step-content active" id="sc-1">
    <div class="card">
      <div id="suc-picker" style="display:none;margin-bottom:16px"></div>
      <div class="card-title">¿Qué servicio necesitas?</div>
      <div class="servicio-grid" id="lista-servicios"></div>
    </div>
    <!-- Acá había un "Continuar →". Ya no: tocar un servicio avanza solo, así
         que el botón nacía deshabilitado y la única función que lo habilitaba
         es la misma que ahora navega. Nadie podía llegar a tocarlo. -->
  </div>

  <!-- PASO 2: Profesional -->
  <div class="step-content" id="sc-2">
    <div class="card">
      <div class="card-title">¿Con quién quieres atenderte?</div>
      <!-- El servicio elegido, acá. Es el reemplazo del feedback que se perdió
           al sacar el "Continuar": antes la confirmación de haber tocado lo
           correcto era la tarjeta iluminada, que seguías viendo mientras
           apretabas el botón. Con el salto automático esa señal dura un
           instante y esta pantalla no decía nada del servicio. -->
      <div class="servicio-elegido" id="servicio-elegido"></div>
      <div class="profesional-grid" id="lista-profesionals"></div>
      <div class="perfil-profesional" id="perfil-profesional" style="display:none"></div>
    </div>
    <button class="btn btn-primary" id="btn-s2" onclick="irPaso(3)" disabled>Continuar →</button>
    <button class="btn btn-ghost" onclick="irPaso(1)">← Volver</button>
  </div>

  <!-- PASO 3: Fecha y hora -->
  <div class="step-content" id="sc-3">
    <div class="card">
      <div class="card-title">¿Cuándo quieres venir?</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="cambiarMes(-1)">‹</button>
        <span class="cal-mes" id="cal-mes-label"></span>
        <button class="cal-nav-btn" onclick="cambiarMes(1)">›</button>
      </div>
      <div class="calendario" id="calendario">
        <div class="cal-header">Lu</div><div class="cal-header">Ma</div>
        <div class="cal-header">Mi</div><div class="cal-header">Ju</div>
        <div class="cal-header">Vi</div><div class="cal-header">Sá</div>
        <div class="cal-header">Do</div>
      </div>
    </div>
    <div class="card" id="card-horarios" style="display:none">
      <div class="card-title" id="horarios-titulo">Horarios disponibles</div>
      <div class="horarios" id="lista-horarios"></div>
    </div>
    <button class="btn btn-primary" id="btn-s3" onclick="irPaso(4)" disabled>Continuar →</button>
    <button class="btn btn-ghost" onclick="irPaso(SALTAR_PROFESIONAL?1:2)">← Volver</button>
  </div>

  <!-- PASO 4: Datos cliente -->
  <div class="step-content" id="sc-4">
    <div class="card">
      <div class="card-title">Tus datos de contacto</div>
      <div class="fr">
        <div class="form-group"><label>Nombre *</label><input type="text" id="cl-nombre" placeholder="Juan"></div>
        <div class="form-group"><label>Apellido</label><input type="text" id="cl-apellido" placeholder="Pérez"></div>
      </div>
      <div class="form-group"><label>WhatsApp *</label><input type="tel" id="cl-wsp" placeholder="+56 9 XXXX XXXX" inputmode="numeric" oninput="ecoCelWsp()"><div class="ayuda-wsp" id="cl-wsp-ayuda">Un celular chileno: 9 dígitos que empiezan en 9.</div></div>
      <div class="form-group"><label>Correo electrónico *</label><input type="email" id="cl-email" placeholder="tu@correo.com"></div>
      <div class="form-group"><label>Fecha de nacimiento (opcional)</label><input type="date" id="cl-cumple"></div>
      <div class="form-group"><label>Notas (opcional)</label><textarea id="cl-notas" rows="2" placeholder="Ej: corte específico, alergias..."></textarea></div>
    </div>
    <button class="btn btn-primary" onclick="irPaso(5)">Continuar →</button>
    <button class="btn btn-ghost" onclick="irPaso(3)">← Volver</button>
  </div>

  <!-- PASO 5: Confirmar -->
  <div class="step-content" id="sc-5">
    <div id="alert-confirm" style="display:none" class="alert alert-err"></div>
    <div class="resumen" id="resumen-reserva"></div>
    <button class="btn btn-primary" id="btn-confirmar" onclick="confirmarReserva()">✓ Confirmar reserva</button>
    <button class="btn btn-ghost" onclick="irPaso(4)">← Volver</button>
  </div>

  <!-- ÉXITO -->
  <div class="step-content" id="sc-exito">
    <div class="success-screen">
      <div class="success-icon">✅</div>
      <div class="success-title">¡Reserva confirmada!</div>
      <div class="success-sub" id="success-msg"></div>
      <button class="btn btn-primary" id="btn-club-vip" style="max-width:280px;margin:0 auto 12px;display:none" onclick="irAClubVip()">🎉 ¡Ya sos parte de nuestro Club VIP! Ver mi Club →</button>
      <button class="btn btn-wa" id="btn-wa-confirmar" style="max-width:260px;margin-left:auto;margin-right:auto" onclick="confirmarPorWhatsApp()">📱 Confirmar por WhatsApp a la barbería</button>
      <button class="btn btn-ghost" style="margin-top:12px;max-width:260px;margin-left:auto;margin-right:auto" onclick="nuevaReserva()">Hacer otra reserva</button>
    </div>
  </div>
</div>

<!-- El modal de ubicación y horario lo construye ubicacion-modal.js, que lo
     agrega al body. Acá no va markup. -->
<script src="ubicacion-modal.js"></script>
<script src="tema.js"></script>
<script>
// Tema público (ver unirse.html y club.html): opcional, sin tema.js la página queda como siempre.
function aplicarTemaPublico(barb){
  // Guardas typeof: si tema.js no cargó, estos nombres no existen y
  // referenciarlos lanzaría ReferenceError. Con typeof no lanza.
  if(typeof hexValido!=='function' || typeof derivarSuperficies!=='function'){
    console.warn('tema.js no está disponible; la página queda con su aspecto por defecto');
    return false;
  }
  if(!barb) return false;
  // El modo lo elige el dueño en el panel. Solo «claro» cambia la página: 'auto'
  // y 'oscuro' son la página oscura de siempre (12 de los 13 negocios están en
  // 'auto'; si 'auto' también cambiara, casi todas las páginas se moverían).
  const modo = barb.modo_tema === 'claro' ? 'claro' : 'oscuro';
  // La aritmética vive en tema.js (derivarSuperficies, función pura). Devuelve
  // null cuando no hay nada que escribir —oscuro sin color de marca—: ni una
  // variable se toca y la página es la de antes, píxel por píxel.
  const vars = derivarSuperficies({ modo, colorMarca: barb.color_marca, colorFondoLogo: barb.color_fondo_logo });
  if(!vars) return false;
  // Se usa setProperty y nunca se arma texto CSS ni se inyecta <style>: un
  // valor que no pase hexValido no debe poder convertirse en una regla. Con
  // setProperty el peor caso es una variable ignorada.
  const raiz = document.documentElement;
  Object.keys(vars).forEach(k => raiz.style.setProperty(k, vars[k]));
  return true;
}

// Las credenciales las define supabase-config.js, cargado en el <head>. Si no
// llegó, este bloque moriría en la línea de abajo y la página quedaría viva
// pero inservible: entera en pantalla, congelada en "Cargando...", con los
// botones fallando sin decir nada. El cliente creería que el negocio no
// atiende. Se corta acá y se avisa.
if (typeof SUPABASE_URL === 'undefined') {
  console.error('supabase-config.js no cargó: SUPABASE_URL y SUPABASE_KEY no están definidas. Revisa que el archivo se esté sirviendo (200) junto a esta página.');

const RUTA_CORTA = (location.pathname.match(/^\/reservar\/([^\/]+)(?:\/([^\/]+))?\/?$/)||[]).slice(1).map(x=>x?decodeURIComponent(x).toLowerCase():null);

let B = { barberia:null, servicios:[], profesionals:[], reservasOcupadas:[], horario:{}, bloqueos:[] };
let SEL = { servicio:null, profesional:null, fecha:null, hora:null, sucursal:null };
let calMes = new Date();
let ULTIMO_NOMBRE = '';
let SALTAR_PROFESIONAL = false;
// QUIÉN era el profesional del link `?profesional=`. Se guarda porque hace
// falta preguntarle a ÉL si hace el servicio elegido — no alcanza con mirar si
// quedó alguien seleccionado. Ver selServicio().
let PROF_LINK = null;
let CLIENTE_CLUB_ID = null; // id del cliente ya resuelto (buscar_o_crear_cliente_club) — para armar el link de Club VIP en la pantalla de éxito

// Jornada por defecto para el día que el negocio todavía no configuró.
//
// Antes esto era una lista literal de 18 horas cada 30 minutos, con el hueco
// del almuerzo escrito a mano. Con el intervalo configurable esa lista pasaba a
// mentir: un negocio en bloques de 60 igual veía las y media en los días que no
// tuviera configurados. Ahora se genera con el MISMO paso que el resto de la
// grilla, así que no hay dos verdades.
//
// Los valores dan exactamente la lista vieja cuando el paso es 30 — eso lo
// comprueba test-reserva-publica.html contra la grilla real, no contra una copia.
const BASE_APERTURA='09:00', BASE_CIERRE='19:00', BASE_COL_INI='13:00', BASE_COL_FIN='14:00';
function horariosBase(){
  return generarSlots(timeToMin(BASE_APERTURA), timeToMin(BASE_CIERRE),
                      timeToMin(BASE_COL_INI), timeToMin(BASE_COL_FIN));
}

function timeToMin(t){ if(!t)return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

// Anticipación mínima para tomar una hora de hoy: no se ofrece nada que empiece
// dentro de los próximos 30 minutos, para que al negocio no le caiga una reserva
// encima de la hora.
const ANTICIPACION_MIN = 30;

// "Ahora" según el reloj de Chile, no el del dispositivo. Un cliente de viaje —o
// con el huso mal configurado— veía la grilla de SU zona: se le escondían horas
// libres, o peor, se le seguían ofreciendo horas ya pasadas. Intl resuelve el
// cambio de horario chileno solo; hardcodear -04/-03 se rompe dos veces al año.
// Devuelve la fecha 'YYYY-MM-DD' y los minutos desde medianoche, las dos cosas
// en la misma zona, para que el calendario y la grilla nunca se contradigan
// cerca de medianoche.
// Esto solo tapa la grilla: el reloj del dispositivo puede estar corrido igual,
// por eso crear_reserva_publica también rechaza fecha/hora pasada del lado del
// servidor (ver migration_hora_pasada.sql). El fallback local es para no romper
// la página entera si Intl fallara.
function ahoraEnChile(){
  try{
    const p = {};
    new Intl.DateTimeFormat('en-CA',{
      timeZone:'America/Santiago', hourCycle:'h23',
      year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'
    }).formatToParts(new Date()).forEach(x=>{ p[x.type]=x.value; });
    return { fecha:`${p.year}-${p.month}-${p.day}`, minutos:(Number(p.hour)%24)*60+Number(p.minute) };
  }catch(e){
    const d = new Date();
    return { fecha:fmtDateLocal(d), minutos:d.getHours()*60+d.getMinutes() };
  }
}

// Cada cuántos minutos PUEDE EMPEZAR una cita. Lo define el negocio en
// Config → Horario (barberias.intervalo_min) y se asigna en init(), antes de
// que se pinte cualquier grilla.
//
// Se declara con el 30 puesto a propósito, y no vacío: 30 es lo que corrió
// hardcodeado hasta ahora, así que si la columna llegara vacía la página sigue
// funcionando igual que siempre en vez de quedarse sin horarios.
let PASO_MIN = 30;

// El valor guardado, con red. La base ya lo limita a 30/45/60 con un CHECK
// (migration_intervalo_horarios.sql); esta guarda es para el caso en que la
// columna no llegue —negocio viejo, error de red, columna sin permiso— y sobre
// todo para que un 0 o un negativo no cuelguen el navegador: la grilla se arma
// con `for(m=ini; m<fin; m+=PASO_MIN)` y un paso <= 0 es un bucle infinito.
//
// El rango es amplio a propósito y NO repite la lista del CHECK: si algún día
// se agrega "cada 20 minutos", se toca la base y el <select> del panel, no esto.
function intervaloDe(negocio){
  const n = Math.round(Number(negocio?.intervalo_min));
  return (Number.isFinite(n) && n >= 5 && n <= 120) ? n : 30;
}

// El único lugar donde se recorre la jornada. Lo usan los dos caminos —el
// horario configurado y el de respaldo— justamente para que no puedan separarse:
// mientras el respaldo era una lista literal, cambiar el paso arreglaba uno y
// dejaba el otro en 30.
// La colación es opcional: si las dos horas vienen nulas, el negocio atiende
// corrido y no se excluye nada.
function generarSlots(ini, fin, colIni, colFin){
  if(ini==null||fin==null) return [];
  const enColacion = m => colIni!=null && colFin!=null && m>=colIni && m<colFin;
  const out=[];
  for(let m=ini; m<fin; m+=PASO_MIN) if(!enColacion(m)) out.push(minToTime(m));
  return out;
}

// Slots para un día de la semana según horario_negocio. Si el negocio no
// configuró ese día (tabla vacía o falta esa fila puntual), se usa la jornada
// por defecto — para no dejar sin horarios a negocios que todavía no
// configuraron su horario.
//
// OJO: esto devuelve dónde PUEDE EMPEZAR una cita, no dónde cabe. Que una cita
// de 60 min quepa a esa hora lo decide cabeEnLaJornada().
function slotsParaDia(diaSemana){
  const cfg = B.horario[diaSemana];
  if(!cfg) return horariosBase();
  if(cfg.cerrado) return [];
  return generarSlots(timeToMin(cfg.hora_apertura), timeToMin(cfg.hora_cierre),
                      timeToMin(cfg.hora_colacion_inicio), timeToMin(cfg.hora_colacion_fin));
}

// ¿Se pisan los intervalos [aIni,aIni+aDur) y [bIni,bIni+bDur)?
// Este es el criterio que faltaba en todo el cálculo: antes se comparaba solo
// el INICIO, así que un corte de 60 min a las 11:30 dejaba libres las 12:00 y
// las 12:30 con el profesional todavía ocupado.
function seSolapan(aIni,aDur,bIni,bDur){
  return aIni < bIni+bDur && bIni < aIni+aDur;
}

// Hora de cierre del día en minutos, o null si el negocio no configuró ese día
// (ahí manda la jornada por defecto y no hay cierre que consultar).
function cierreDelDia(diaSemana){
  const cfg = B.horario[diaSemana];
  if(!cfg || cfg.cerrado) return null;
  return timeToMin(cfg.hora_cierre);
}

// ¿Una cita de `dur` minutos que empieza en `hMin` cabe dentro de la jornada?
// Dos criterios, y hacen falta los dos porque cada uno tapa el hueco del otro:
//
//  - Todas las unidades de la grilla que la cita ocupa tienen que existir en el
//    día. Eso cubre la colación (un servicio de 60 min a las 13:30 con almuerzo
//    a las 14:00 hoy se ofrece, porque solo se mira el inicio) y cubre la
//    jornada por defecto, que no tiene hora_cierre que consultar sino un
//    hueco de colación propio.
//
//  - Y el final no puede pasarse del cierre configurado. Hace falta aparte
//    porque con un cierre no alineado a la grilla —19:20 con pasos de 30— la
//    unidad de las 19:00 existe, y un servicio de 30 min ahí se saldría 10
//    minutos sin que el primer criterio lo note.
function cabeEnLaJornada(hMin, dur, cierre, unidades){
  if(cierre!=null && hMin+dur > cierre) return false;
  for(let m=hMin; m<hMin+dur; m+=PASO_MIN) if(!unidades.has(m)) return false;
  return true;
}

// ¿Este bloqueo choca con una cita de `dur` minutos que empieza en `hMin`?
// Antes se preguntaba si el bloqueo cubría el INICIO del slot, así que un
// bloqueo de 14:00 a 15:00 no impedía un servicio de 60 min a las 13:30.
function bloqueoChocaCon(b, hMin, dur, fecha, diaSemana){
  if(b.tipo==='dia_completo') return b.fecha===fecha;
  let ini=null, fin=null;
  if(b.tipo==='puntual'){
    if(b.fecha!==fecha) return false;
    ini=timeToMin(b.hora_inicio); fin=timeToMin(b.hora_fin);
  }else if(b.tipo==='recurrente'){
    if(b.dia_semana!==diaSemana) return false;
    ini=timeToMin(b.hora_inicio); fin=timeToMin(b.hora_fin);
  }else{
    return false;
  }
  return ini!=null && fin!=null && seSolapan(hMin,dur,ini,fin-ini);
}

// Arma/compara fechas solo con componentes locales (año/mes/día) — nunca vía
// toISOString() ni new Date("YYYY-MM-DD"), que se interpretan como UTC y
// pueden correrse un día según la zona horaria del visitante.
function fmtDateLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function abrirWA(wsp,msg){ const n=(wsp||'').replace(/\D/g,''); window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank'); }

// ─── Celular chileno ────────────────────────────────────────────────────────
//
// EN ESPEJO de celular_cl_norm() en migration_celular_cl.sql. Las dos reglas
// tienen que decidir lo mismo sobre las mismas entradas: si se separan, el
// front aceptaría algo que el servidor rechaza y la persona vería un error
// después de llenar todo el formulario. test-reserva-publica.html corre la
// tabla de casos acá, y el bloque (3c) de la migración corre LA MISMA tabla
// contra el SQL.
//
// ⚠ A DIFERENCIA de normWspCl() en unirse.html, acá NO se repara un número de
// 8 dígitos agregándole el 9. Allá el campo muestra el prefijo "+56 9"
// impreso y la ayuda dice "solo los 8 dígitos que siguen", así que el 9 está
// a la vista. Este campo es libre: agregarle un 9 a ocho dígitos inventaría
// en silencio un número que la persona nunca escribió.
function normCelCl(raw){
  var d = String(raw == null ? '' : raw).replace(/\D/g,'');
  if(d.length > 9) d = d.slice(-9);
  if(d.length !== 9 || d.charAt(0) !== '9') return '';
  // Los 8 que siguen al 9 no pueden ser todos el mismo dígito: 999999999 y
  // 900000000 son relleno de alguien que no quiere dar su número.
  var resto = d.slice(1);
  for(var i=0;i<resto.length;i++){ if(resto.charAt(i) !== resto.charAt(0)) return d; }
  return '';
}

function fmtCelCl(norm){
  if(norm.length !== 9) return '';
  return '+56 ' + norm.charAt(0) + ' ' + norm.substr(1,4) + ' ' + norm.substr(5,4);
}

// Eco en vivo: la persona confirma que el número leído es el suyo ANTES de
// enviar, en vez de descubrir el error cuando ya llenó el resto.
//
// Dice "Leímos", no "Guardaremos": se guarda el texto crudo tal como lo
// escribió, no este formato. Prometer lo otro sería mentirle.
function ecoCelWsp(){
  var el = document.getElementById('cl-wsp');
  var ayuda = document.getElementById('cl-wsp-ayuda');
  if(!el || !ayuda) return;
  var val = el.value.trim();
  var norm = normCelCl(val);
  ayuda.classList.remove('mal');
  if(!val){ ayuda.innerHTML = 'Un celular chileno: 9 dígitos que empiezan en 9.'; return; }
  if(norm){ ayuda.innerHTML = 'Leímos <b>' + fmtCelCl(norm) + '</b>'; return; }
  ayuda.textContent = 'Ese número no parece un celular chileno.';
  ayuda.classList.add('mal');
}

// Mismo criterio de reemplazo de {clave} que buildMsg() en app.html —
// duplicado acá porque este archivo no comparte JS con app.html (ver
// nota de arquitectura: cada HTML es standalone).
function fillTemplate(str,vars){
  let m=str;
  Object.entries(vars).forEach(([k,v])=>{ m=m.replace(new RegExp('{'+k+'}','g'),v||''); });
  return m;
}

// Portada: solo se muestra si hay foto_portada, sin fallback roto (se
// "Agregar a inicio" con el ícono real del negocio: mismo alcance limitado
// que ya tiene mi-agenda.html (solo cambia el ícono/nombre al anclar, no
// hay service worker ni uso offline). El manifest se arma en runtime como
// Blob URL porque cada negocio necesita su propio ícono — no se puede
// servir un manifest.json estático por negocio sin backend. Fallback sin
// logo: el ícono genérico de Reservia que ya usa mi-agenda.html (mismo
// archivo, cero assets nuevos).
function configurarManifestDinamico(barb){
  const icon192 = barb.logo_url || '/mi-agenda-icon-192.png';
  const icon512 = barb.logo_url || '/mi-agenda-icon-512.png';
  const manifest = {
    name: barb.nombre,
    short_name: barb.nombre,
    start_url: location.pathname + location.search,
    display: 'standalone',
    background_color: '#08090d',
    theme_color: '#08090d',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png' },
      { src: icon512, sizes: '512x512', type: 'image/png' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
  document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
  document.getElementById('apple-touch-icon-link').href = icon192;
  document.getElementById('apple-title').content = barb.nombre;
}

function renderHeaderNegocio(barb){
  document.getElementById('h-nombre').textContent = barb.nombre;
  document.getElementById('h-dir').textContent = barb.direccion || '';

  if(barb.foto_portada){
    document.getElementById('portada-img').src = barb.foto_portada;
    document.getElementById('portada-wrap').style.display = '';
  }

  if(barb.logo_url){
    document.getElementById('header-logo-img').src = barb.logo_url;
    document.getElementById('header-logo-img').style.display = '';
    document.getElementById('header-logo-glifo').style.display = 'none';
  }

  const meta = [];
  if(barb.telefono) meta.push(`📞 ${barb.telefono}`);
  if(barb.whatsapp) meta.push(`📱 ${barb.whatsapp}`);
  if(barb.instagram) meta.push(`<a href="https://instagram.com/${barb.instagram.replace(/^@/,'')}" target="_blank" rel="noopener">📷 ${barb.instagram}</a>`);
  if(/^https?:\/\//i.test(barb.link_reviews||'')) meta.push(`<a href="${barb.link_reviews}" target="_blank" rel="noopener">⭐ Reseñas</a>`);
  document.getElementById('header-meta').innerHTML = meta.join('');

  if(barb.descripcion){
    document.getElementById('h-descripcion').textContent = barb.descripcion;
    document.getElementById('h-descripcion').style.display = '';
  }
}

async function init(){
  if(!BARBERIA_ID && RUTA_NEGOCIO){
    const {data:nb}=await sb.from('barberias').select('id').eq('slug',RUTA_NEGOCIO).maybeSingle();
    if(nb) BARBERIA_ID=nb.id;
  }
  if(!BARBERIA_ID){ document.body.innerHTML='<div style="text-align:center;padding:60px;color:var(--texto-debil)">URL inválida. Falta el ID de la negocio.</div>'; return; }
  const {data:barb} = await sb.from('barberias').select('*').eq('id',BARBERIA_ID).single();
  if(!barb){ document.body.innerHTML='<div style="text-align:center;padding:60px;color:var(--texto-debil)">Negocio no encontrada.</div>'; return; }
  B.barberia = barb;
  aplicarTemaPublico(barb);
  // Antes de cualquier render de grilla. renderHorarios() recién corre cuando
  // el cliente elige un día, así que acá va sobradísimo de tiempo — pero el
  // orden importa: si se asignara después, la primera grilla saldría en 30.
  PASO_MIN = intervaloDe(barb);
  renderHeaderNegocio(barb);
  configurarManifestDinamico(barb);
  document.title = 'Reservar — ' + barb.nombre;
  const [{data:sv},{data:ba},{data:hn},{data:blq},{data:bs}] = await Promise.all([
    // Orden manual del dueño (Config → Servicios). Precio de desempate y nulls
    // al final: gemela de la de club.html y mi-agenda.html.
    sb.from('servicios').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true).order('orden',{nullsFirst:false}).order('precio'),
    sb.from('barberos').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true).order('nombre'),
    sb.from('horario_negocio').select('*').eq('barberia_id',BARBERIA_ID),
    sb.from('bloqueos_profesional').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true),
    sb.from('barbero_servicios').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true)
  ]);
  B.servicios = sv||[]; B.profesionals = ba||[];
  try{
    const {data:sc}=await sb.from('sucursales').select('*').eq('barberia_id',BARBERIA_ID).eq('activa',true).order('orden').order('created_at');
    B.sucursales = sc||[];
  }catch(e){ B.sucursales = []; }
  B.horario = {}; (hn||[]).forEach(h=>{ B.horario[h.dia_semana]=h; });
  B.bloqueos = blq||[];
  B.barberoServicios = bs||[];
  // Con guarda: si ubicacion-modal.js no cargara, el ReferenceError cortaría
  // el init() acá y la página se quedaría sin calendario. El modal es
  // accesorio, reservar no.
  if(typeof montarAccesoUbicacion==='function'){
    montarAccesoUbicacion({negocio:B.barberia, horario:B.horario, contenedor:document.getElementById('header-meta')});
  }
  initSucursales();
  renderServicios(); renderProfesionals(); renderCalendario();
  const profParam = profParamId();
  const profPreseleccionado = profParam && B.profesionals.find(b=>b.id===profParam);
  if(profPreseleccionado){
    // El paso 2 (sc-2) queda oculto en este flujo — SALTAR_PROFESIONAL salta
    // directo de paso 1 a paso 3, así que la foto+bio no se ve si solo se
    // renderiza ahí (renderPerfilProfesional, vía selProfesional). Por eso
    // el banner (siempre visible, arriba de los pasos) las incluye directo.
    selProfesional(profParam);
    SALTAR_PROFESIONAL = true;
    PROF_LINK = profParam;
    document.getElementById('st-2').style.display = 'none';
    const banner = document.getElementById('prof-preselec');
    banner.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;justify-content:center">
        ${profPreseleccionado.foto_url?`<img src="${profPreseleccionado.foto_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0">`:''}
        <span>Reservando con: <strong style="color:var(--texto)">${profPreseleccionado.nombre}</strong>${profPreseleccionado.especialidad?` — ${profPreseleccionado.especialidad}`:''}</span>
      </div>
      ${profPreseleccionado.bio?`<div style="margin-top:8px;font-size:11px;color:var(--texto-suave)">${profPreseleccionado.bio}</div>`:''}`;
    banner.style.display = '';
  }
}

// ── Sucursales ──────────────────────────────────────────────────────────
// Con más de una sucursal activa el cliente elige dónde se atiende (o entra por
// un link que ya la trae: ?sucursal= o ?profesional=). Con una sola no se ve nada.
function initSucursales(){
  B.multiSuc = (B.sucursales||[]).length > 1;
  if(!B.multiSuc){ SEL.sucursal = (B.sucursales&&B.sucursales[0])?B.sucursales[0].id:null; return; }
  const pSuc = (params.get('sucursal')||'').toLowerCase(), pProf = profParamId();
  const prof = pProf && B.profesionals.find(b=>b.id===pProf);
  const porParam = pSuc && B.sucursales.find(x=>x.id===pSuc || x.slug===pSuc);
  const id = (prof&&prof.sucursal_id) || (porParam?porParam.id:null);
  SEL.sucursal = id; B.sucLocked = !!id;
  renderSucPicker();
}
function sucElegida(){ return (B.sucursales||[]).find(x=>x.id===SEL.sucursal)||null; }
function renderSucPicker(){
  const el = document.getElementById('suc-picker'); if(!el||!B.multiSuc) return;
  el.style.display = '';
  const x = sucElegida();
  if(B.sucLocked && x){
    el.innerHTML = `<div style="font-size:13px;color:var(--texto-suave)">📍 <b style="color:var(--texto)">${escapeHtml(x.nombre)}</b>${x.direccion?' · '+escapeHtml(x.direccion):''}</div>`;
    return;
  }
  el.innerHTML = `<div class="card-title">¿En qué sucursal?</div>
    <div style="display:grid;gap:8px">${B.sucursales.map(s=>`
      <div class="servicio-card${s.id===SEL.sucursal?' selected':''}" style="text-align:left" onclick="selSucursal('${s.id}')">
        <div class="servicio-nombre">${escapeHtml(s.nombre)}</div>
        ${s.direccion?`<div class="servicio-dur">${escapeHtml(s.direccion)}</div>`:''}
      </div>`).join('')}</div>`;
}
function selSucursal(id){
  SEL.sucursal = id;
  if(SEL.profesional && SEL.profesional.sucursal_id !== id){ SEL.profesional = null; const b=document.getElementById('btn-s2'); if(b) b.disabled = true; }
  if(SEL.servicio && !serviciosVisibles().some(s=>s.id===SEL.servicio.id)) SEL.servicio = null;
  renderSucPicker(); renderServicios(); renderProfesionals();
}
function profesionalesDeSucursal(){
  return B.profesionals.filter(b=>!SEL.sucursal || b.sucursal_id===SEL.sucursal);
}
function serviciosVisibles(){
  if(!B.multiSuc || !SEL.sucursal) return B.servicios;
  return B.servicios.filter(s=>profesionalesDeSucursal().some(b=>profesionalCalifica(b,s)));
}
function renderServicios(){
  if(B.multiSuc && !SEL.sucursal){
    document.getElementById('lista-servicios').innerHTML = '<p style="color:var(--texto-debil);font-size:13px">Elige primero la sucursal.</p>';
    return;
  }
  document.getElementById('lista-servicios').innerHTML = serviciosVisibles().map(s=>`
    <div class="servicio-card" onclick="selServicio('${s.id}')" id="sv-${s.id}">
      <div class="servicio-nombre">${s.nombre}</div>
      <div class="servicio-precio">$${s.precio.toLocaleString('es-CL')}</div>
      <div class="servicio-dur">${s.duracion_min} min</div>
      ${s.descripcion?`<div class="servicio-desc">${s.descripcion}</div>`:''}
    </div>`).join('') || '<p style="color:var(--texto-debil);font-size:13px">No hay servicios disponibles.</p>';
}

// Un profesional califica para un servicio si tiene la fila activa en
// barbero_servicios. Misma definición para filtrar la grilla y para decidir si
// una selección previa sobrevive al cambio de servicio: si fueran criterios
// distintos, la grilla y el estado se irían separando.
function profesionalCalifica(prof, servicio){
  return !!(prof && servicio && B.barberoServicios.some(bs=>
    bs.barbero_id===prof.id && bs.servicio_id===servicio.id));
}

// Gemela de la de club.html. OJO: el resto de este archivo interpola nombres de
// servicio en innerHTML sin escapar (renderServicios, renderResumen). Son datos
// del propio dueño, no de terceros, así que no es una inyección entre negocios
// — pero acá se escapa igual, porque el hábito de interpolar crudo es el que
// después se copia a un campo que sí viene de afuera.
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

// Pinta el servicio elegido arriba del paso 2. Ver el comentario del div en el
// HTML: sustituye a la tarjeta iluminada, que con el salto automático dejó de
// estar a la vista cuando el cliente decide si siguió bien.
function renderServicioElegido(){
  const el = document.getElementById('servicio-elegido');
  const s = SEL.servicio;
  if(!el) return;
  if(!s){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `Servicio: <b>${escapeHtml(s.nombre)}</b> · $${s.precio.toLocaleString('es-CL')} · ${s.duracion_min} min`;
}

function selServicio(id){
  SEL.servicio = B.servicios.find(s=>s.id===id);
  document.querySelectorAll('.servicio-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('sv-'+id).classList.add('selected');
  renderServicioElegido();
  // El profesional elegido puede dejar de calificar para el nuevo servicio, así
  // que se limpia la selección y se re-renderiza la grilla filtrada.
  //
  // SOLO si dejó de calificar. Antes se limpiaba SIEMPRE, y eso rompía las
  // reservas que entran por un link con ?profesional=: ahí el paso 2 está
  // oculto y "Continuar" salta al 3, así que el cliente se quedaba sin ninguna
  // pantalla donde volver a elegirlo y la reserva moría en irPaso(5) con
  // "Falta elegir servicio, profesional, fecha u hora". Con un solo profesional
  // el bug quedaba tapado, porque renderProfesionals() autoselecciona.
  if(!profesionalCalifica(SEL.profesional, SEL.servicio)){
    SEL.profesional = null;
    document.getElementById('btn-s2').disabled = true;
    document.getElementById('perfil-profesional').style.display = 'none';
  }
  renderProfesionals();
  // Si el profesional del link no hace este servicio no se puede seguir
  // saltando el paso 2: se restaura el flujo normal para que el cliente elija,
  // y se baja el banner, que quedaría anunciando a alguien que ya no es.
  // Se le pregunta al profesional DEL LINK si hace este servicio, no si quedó
  // alguien elegido.
  //
  // La condición anterior era `SALTAR_PROFESIONAL && !SEL.profesional`, y tenía
  // un agujero: renderProfesionals() autoselecciona cuando UN solo profesional
  // califica. Entonces, si el cliente entraba con el link de Ana y elegía un
  // servicio que Ana no hace pero Beto sí —y Beto era el único—, quedaba
  // profesional elegido, la bandera NO se apagaba, se salteaba el paso 2, y el
  // banner seguía anunciando a Ana mientras la reserva iba con Beto. El cliente
  // recién lo veía en el resumen del paso 5.
  //
  // Preguntando por PROF_LINK eso no puede pasar: si el del link no califica,
  // se muestra el paso 2 aunque haya otro autoseleccionado. Y se muestra CON
  // esa autoselección visible, que es la diferencia — el cliente ve con quién
  // va a quedar en vez de enterarse tres pantallas después.
  if(SALTAR_PROFESIONAL && !profesionalCalifica(B.profesionals.find(b=>b.id===PROF_LINK), SEL.servicio)){
    SALTAR_PROFESIONAL = false;
    document.getElementById('st-2').style.display = '';
    document.getElementById('prof-preselec').style.display = 'none';
  }
  // El salto va ACÁ, al final, y no antes: el bloque de arriba puede apagar
  // SALTAR_PROFESIONAL cuando el profesional del link no hace este servicio.
  // Leyendo la bandera antes, ese cliente aterrizaría en el paso 3 sin
  // profesional elegido y la reserva moriría recién en el resumen.
  irPaso(SALTAR_PROFESIONAL ? 3 : 2);
}

// Filtra por barbero_servicios: solo profesionales con ese servicio activo
// califican para el paso 2.
//
// YA NO EXISTE "Cualquier profesional". Una reserva sin persona asignada no
// le avisa a nadie —el resolver de correos la descarta de entrada— y alguien
// tiene que acordarse de asignarla antes de la cita. Se elimina el estado
// ambiguo en vez de construir avisos para gestionarlo.
//
// Con UN solo profesional que califique se autoselecciona: una lista de uno
// es un clic sin información. Con NINGUNO la grilla quedaría vacía y el botón
// "Continuar" no se habilitaría nunca, así que se explica en vez de dejar al
// cliente trabado sin saber por qué. Ese caso no es solo "negocio sin
// configurar": pasa cada vez que un servicio nuevo no tiene ningún
// profesional asociado en barbero_servicios, y también si todos los que
// califican están inactivos — init() ya no los trae.
function renderProfesionals(){
  const items = SEL.servicio
    ? profesionalesDeSucursal().filter(b=>profesionalCalifica(b,SEL.servicio))
    : profesionalesDeSucursal();
  const cont = document.getElementById('lista-profesionals');
  if(!items.length){
    cont.innerHTML = '<div class="no-horarios" style="grid-column:1/-1">Este servicio no tiene profesionales disponibles por ahora. Prueba con otro servicio.</div>';
    return;
  }
  cont.innerHTML = items.map(b=>`
    <div class="profesional-card" onclick="selProfesional('${b.id}')" id="ba-${b.id}">
      <div class="profesional-avatar">${b.foto_url?`<img src="${encodeURI(b.foto_url)}" alt="" onerror="this.replaceWith(document.createTextNode('✂'))" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block">`:(b.emoji||'✂')}</div>
      <div class="profesional-nombre">${b.nombre}</div>
    </div>`).join('');
  // Re-pintar la grilla borra la clase 'selected' del DOM, así que la selección
  // vigente se vuelve a aplicar. Importa sobre todo con ?profesional=, donde el
  // paso 2 está oculto y la elección solo vive en SEL.
  if(SEL.profesional && items.some(b=>b.id===SEL.profesional.id)) selProfesional(SEL.profesional.id);
  else if(items.length===1) selProfesional(items[0].id);
}

function selProfesional(id){
  const prof = B.profesionals.find(b=>b.id===id);
  // Sin profesional válido no se habilita "Continuar": es la única forma de
  // llegar al paso 3, así que el flujo no puede avanzar sin persona elegida.
  if(!prof) return;
  SEL.profesional = prof;
  document.querySelectorAll('.profesional-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('ba-'+id).classList.add('selected');
  document.getElementById('btn-s2').disabled = false;
  renderPerfilProfesional(SEL.profesional);
}

// Foto grande + bio del profesional elegido, antes de continuar — se omite
// entero si el profesional no tiene bio, foto ni especialidad.
function renderPerfilProfesional(prof){
  const cont = document.getElementById('perfil-profesional');
  if(!prof || (!prof.foto_url && !prof.bio && !prof.especialidad)){ cont.style.display = 'none'; return; }
  cont.innerHTML = `
    ${prof.foto_url?`<img src="${prof.foto_url}" class="perfil-prof-foto">`:''}
    <div>
      <div class="perfil-prof-nombre">${prof.nombre}${prof.especialidad?` — ${prof.especialidad}`:''}</div>
      ${prof.bio?`<div class="perfil-prof-bio">${prof.bio}</div>`:''}
    </div>`;
  cont.style.display = 'flex';
}

function renderCalendario(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const hoyStr = ahoraEnChile().fecha;
  document.getElementById('cal-mes-label').textContent = meses[calMes.getMonth()]+' '+calMes.getFullYear();
  const primerDia = new Date(calMes.getFullYear(),calMes.getMonth(),1);
  const ultimoDia = new Date(calMes.getFullYear(),calMes.getMonth()+1,0);
  let lunes = primerDia.getDay()-1; if(lunes===-1)lunes=6;
  const cal = document.getElementById('calendario');
  const headers = cal.querySelectorAll('.cal-header');
  cal.innerHTML='';
  headers.forEach(h=>cal.appendChild(h.cloneNode(true)));
  for(let i=0;i<lunes;i++) cal.innerHTML+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=ultimoDia.getDate();d++){
    const fecha = new Date(calMes.getFullYear(),calMes.getMonth(),d);
    const fechaStr = fmtDateLocal(fecha);
    const past = fechaStr < hoyStr;
    const sel = SEL.fecha===fechaStr;
    const hoyClass = fechaStr===hoyStr?'today':'';
    cal.innerHTML+=`<div class="cal-day ${past?'past':'available'} ${sel?'selected':''} ${hoyClass}" ${!past?`onclick="selFecha('${fechaStr}')"`:''}">${d}</div>`;
  }
}

function cambiarMes(dir){
  calMes.setMonth(calMes.getMonth()+dir);
  renderCalendario();
}

async function selFecha(fecha){
  SEL.fecha = fecha; SEL.hora = null;
  document.getElementById('btn-s3').disabled = true;
  renderCalendario();
  const barb = document.getElementById('card-horarios');
  barb.style.display = '';
  const d = new Date(fecha+'T12:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('horarios-titulo').textContent = `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
  // Cargar reservas existentes para ese día y profesional. Se usa la vista
  // pública reservas_disponibilidad (no la tabla real) para no exponer datos
  // del cliente a visitantes anónimos — expone hora, profesional y la duración
  // ya resuelta, nunca nombre/whatsapp/correo/notas.
  //
  // Ya NO se filtra por procesado=false, a propósito: procesarReserva() en
  // app.html marca procesado=true junto con estado='Atendida', y el dueño suele
  // cobrar cuando el cliente se sienta, no cuando se va. Con el cálculo por
  // duración, filtrarlo liberaba los slots siguientes con el profesional
  // todavía ocupado. Las canceladas las descarta la propia vista, así que todo
  // lo que llega acá ocupa la silla de verdad.
  let query = sb.from('reservas_disponibilidad').select('hora,barbero_nombre,duracion_min').eq('barberia_id',BARBERIA_ID).eq('fecha',fecha);
  const {data:ocupadas} = await query;
  B.reservasOcupadas = ocupadas||[];
  renderHorarios();
}

function renderHorarios(){
  const d = new Date(SEL.fecha+'T12:00:00');
  const diaSemana = d.getDay();
  // Si el día elegido es hoy, se descartan las horas que ya pasaron y las que
  // caen dentro de la anticipación mínima. Se filtran en vez de deshabilitarse:
  // a las 22:00 la grilla mostraba 18 botones muertos.
  const ahora = ahoraEnChile();
  const esHoy = SEL.fecha === ahora.fecha;
  const desdeMin = ahora.minutos + ANTICIPACION_MIN;
  // El servicio se elige en el paso 1, así que acá ya está. El fallback de 30
  // es la red por si algún camino nuevo llega antes de tiempo, y coincide con
  // el que usa la vista para las reservas sin servicio.
  const dur = SEL.servicio?.duracion_min || 30;
  const delDia = slotsParaDia(diaSemana);
  const unidades = new Set(delDia.map(timeToMin));
  const cierre = cierreDelDia(diaSemana);
  const slots = delDia.filter(h => !esHoy || timeToMin(h) >= desdeMin);
  document.getElementById('lista-horarios').innerHTML = slots.map(h=>{
    const hMin = timeToMin(h);
    // La cita ocupa [hMin, hMin+dur). Tiene que caber en la jornada y no pisar
    // ninguna reserva ni bloqueo del profesional.
    const cabe = cabeEnLaJornada(hMin, dur, cierre, unidades);
    const ocupadoPorReserva = B.reservasOcupadas.some(r=>{
      if(SEL.profesional && r.barbero_nombre!==SEL.profesional.nombre) return false;
      const rMin = timeToMin(r.hora);
      return rMin!=null && seSolapan(hMin, dur, rMin, r.duracion_min||30);
    });
    // Al paso 3 no se llega sin profesional elegido, así que en la práctica
    // siempre se toma la primera rama. La segunda queda como red por si algún
    // camino nuevo llega acá antes de tiempo: ante la duda oculta de más, que
    // es el error barato. Antes era el caso normal, cuando existía "Cualquier
    // profesional".
    const bloqueado = SEL.profesional
      ? B.bloqueos.some(b=>b.profesional_id===SEL.profesional.id && bloqueoChocaCon(b,hMin,dur,SEL.fecha,diaSemana))
      : B.bloqueos.some(b=>bloqueoChocaCon(b,hMin,dur,SEL.fecha,diaSemana));
    const ocupado = !cabe || ocupadoPorReserva || bloqueado;
    const sel = h===SEL.hora;
    return`<button class="horario-btn ${sel?'selected':''}" ${ocupado?'disabled':''} onclick="selHora('${h}')">${h}</button>`;
  }).join('') || `<div class="no-horarios">${esHoy?'Ya no quedan horarios disponibles para hoy. Elige otro día.':'No hay horarios disponibles.'}</div>`;
}

function selHora(h){
  SEL.hora = h;
  document.querySelectorAll('.horario-btn').forEach(b=>b.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('btn-s3').disabled = false;
}

function irPaso(n){
  // Validar paso 4
  if(n===5){
    // Red de seguridad: el resumen arma la fecha con new Date(SEL.fecha+'T12:00:00'),
    // que con SEL.fecha en null da Invalid Date y pinta "undefined NaN de undefined".
    // Los botones deshabilitados ya deberían impedir llegar acá sin elegir, pero
    // esto lo cierra por si algún camino nuevo se saltea esa validación.
    if(!SEL.servicio||!SEL.profesional||!SEL.fecha||!SEL.hora){alert('Falta elegir servicio, profesional, fecha u hora. Vuelve a los primeros pasos.');return;}
    const nombre=document.getElementById('cl-nombre').value.trim();
    const wsp=document.getElementById('cl-wsp').value.trim();
    const email=document.getElementById('cl-email').value.trim();
    if(!nombre||!wsp||!email){alert('Nombre, WhatsApp y correo son obligatorios.');return;}
    // Acá y no en el submit: este gate corre en el paso 4, donde el campo del
    // WhatsApp está a la vista. El error de la RPC se pinta en #alert-confirm,
    // que vive en el paso 5 — la persona lo leería en una pantalla donde el
    // campo ni se muestra y tendría que adivinar que debe volver atrás.
    if(!normCelCl(wsp)){alert('Revisa tu WhatsApp: tiene que ser un celular chileno de 9 dígitos que empiece en 9.');return;}
    if(!email.includes('@')){alert('Ingresa un correo válido.');return;}
    renderResumen();
  }
  document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.step-tab').forEach((t,i)=>{
    t.classList.remove('active');
    if(i<n-1)t.classList.add('done');
    else t.classList.remove('done');
  });
  const sc = document.getElementById('sc-'+n);
  if(sc){sc.classList.add('active'); document.getElementById('st-'+n).classList.add('active');}
  window.scrollTo(0,0);
}

function renderResumen(){
  const nombre=document.getElementById('cl-nombre').value.trim()+' '+document.getElementById('cl-apellido').value.trim();
  const d=new Date(SEL.fecha+'T12:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('resumen-reserva').innerHTML=`
    <div class="resumen-row"><span class="resumen-label">Servicio</span><span class="resumen-val">${SEL.servicio?.nombre}</span></div>
    <div class="resumen-row"><span class="resumen-label">Profesional</span><span class="resumen-val">${SEL.profesional?.nombre||''}</span></div>
    <div class="resumen-row"><span class="resumen-label">Fecha</span><span class="resumen-val">${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}</span></div>
    <div class="resumen-row"><span class="resumen-label">Hora</span><span class="resumen-val">${SEL.hora} hrs</span></div>
    <div class="resumen-row"><span class="resumen-label">Valor</span><span class="resumen-val" style="color:var(--acento)">$${SEL.servicio?.precio.toLocaleString('es-CL')}</span></div>
    <div class="resumen-row"><span class="resumen-label">Cliente</span><span class="resumen-val">${nombre.trim()}</span></div>
    <div class="resumen-row" id="resumen-abono" style="display:none"></div>`;

async function mostrarNotaAbono(){
  try{
    const srv=SEL.servicio?.nombre;
    const {data:monto}=await sb.rpc('abono_monto_para',{p_barberia_id:BARBERIA_ID,p_servicio:srv});
    const el=document.getElementById('resumen-abono');
    if(!el||SEL.servicio?.nombre!==srv||!(monto>0))return;
    const {data:info}=await sb.rpc('abono_info_publico',{p_barberia_id:BARBERIA_ID});

    el.innerHTML='<span class="resumen-label">Abono</span><span class="resumen-val" style="color:var(--acento)">$'+Number(monto).toLocaleString('es-CL')+'</span>'

    el.style.display='';el.style.flexWrap='wrap';
  }catch(e){}
}

async function confirmarReserva(){
  const btn=document.getElementById('btn-confirmar');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Confirmando...';
  const nombre=document.getElementById('cl-nombre').value.trim();
  const apellido=document.getElementById('cl-apellido').value.trim();
  const wsp=document.getElementById('cl-wsp').value.trim();
  const email=document.getElementById('cl-email').value.trim();
  const cumpleanos=document.getElementById('cl-cumple').value||null;
  const notas=document.getElementById('cl-notas').value.trim();
  try{
    // Se crea vía RPC (security definer), no con insert().select() directo:
    // Postgres aplica la política de SELECT (privada) también al RETURNING
    // de un insert, y un cliente anónimo nunca la cumple. El RPC hace el
    // insert del lado del servidor y devuelve solo el id — mismo patrón
    // que get_club_vip_publico.
    const {data:resAb,error}=await sb.rpc('crear_reserva_publica_abono',{
      p_barberia_id:BARBERIA_ID,
      p_nombre_cliente:nombre+' '+apellido,
      p_whatsapp_cliente:wsp,
      p_fecha:SEL.fecha,
      p_hora:SEL.hora,
      p_email_cliente:email,
      p_cumpleanos_cliente:cumpleanos,
      p_servicio:SEL.servicio?.nombre,
      p_barbero_nombre:SEL.profesional.nombre,
      p_notas:notas
    });
    if(error)throw error;
    const reservaId=resAb&&resAb.id;
    const data={id:reservaId};
    ULTIMO_NOMBRE=(nombre+' '+apellido).trim();
    // Con abono, la hora queda retenida hasta que el cliente transfiera: se
    // lo lleva a su pantalla de pago y el correo de confirmación sale recién
    // cuando el negocio confirma el abono (lo hace el panel).
    if(resAb&&resAb.requiere_abono){
      location.href='abono.html?r='+encodeURIComponent(reservaId)+'&t='+encodeURIComponent(resAb.token);
      return;
    }
    // Email de confirmación automático (Vercel + Resend). No bloquea la UI ni
    // muestra error al cliente si falla — el servidor decide con qué datos reales.
    fetch('/api/enviar-confirmacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reservaId:data.id})}).catch(()=>{});
    // Resuelve (busca o crea) la ficha de cliente para poder armar el link
    // de Club VIP — paso adicional después de que la reserva ya se creó,
    // no reemplaza nada del flujo existente. No bloquea el éxito de la
    // reserva si falla: el cliente igual ve su confirmación, solo no ve
    // el botón de Club VIP.
    try{
      const {data:clienteId,error:errCliente}=await sb.rpc('buscar_o_crear_cliente_club',{p_barberia_id:BARBERIA_ID,p_reserva_id:reservaId});
      if(!errCliente&&clienteId){
        CLIENTE_CLUB_ID=clienteId;
        document.getElementById('btn-club-vip').style.display='';
      }
    }catch(e){
      console.log('No se pudo resolver el cliente para el Club VIP:',e.message);
    }
    // Mostrar éxito
    document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
    document.getElementById('sc-exito').classList.add('active');
    document.getElementById('success-msg').innerHTML=`Tu reserva quedó registrada.<br><br>📅 ${SEL.fecha} a las ${SEL.hora} hrs<br>✂️ ${SEL.servicio?.nombre} con ${SEL.profesional.nombre}<br><br>¡Te esperamos en ${B.barberia.nombre}${B.multiSuc&&sucElegida()?' — '+escapeHtml(sucElegida().nombre)+(sucElegida().direccion?' ('+escapeHtml(sucElegida().direccion)+')':''):''}!`;
    document.getElementById('btn-wa-confirmar').style.display=B.barberia.whatsapp?'':'none';
  }catch(e){
    const al=document.getElementById('alert-confirm');
    al.textContent='Error al confirmar: '+e.message; al.style.display='';
  }finally{
    // Repone el botón SIEMPRE, salga bien o mal. Antes solo se reponía en el
    // catch: tras una reserva exitosa quedaba en "Confirmando..." y
    // deshabilitado para siempre, y como nuevaReserva() tampoco lo tocaba, al
    // volver con "Hacer otra reserva" el usuario llegaba al paso Confirmar con
    // un botón muerto — sin poder reservar de nuevo ni recibir ninguna señal.
    btn.disabled=false; btn.innerHTML='✓ Confirmar reserva';
  }
}

async function confirmarPorWhatsApp(){
  if(!B.barberia?.whatsapp)return;
  const fallback=`Hola! Quiero confirmar mi reserva en ${B.barberia.nombre}:\n📅 ${SEL.fecha} a las ${SEL.hora} hrs\n✂️ ${SEL.servicio?.nombre||''}${SEL.profesional?' con '+SEL.profesional.nombre:''}\nNombre: ${ULTIMO_NOMBRE}`;
  let msg=fallback;
  try{
    const {data:plantilla}=await sb.rpc('obtener_plantilla_publica',{p_barberia_id:BARBERIA_ID,p_evento:'Cliente confirma reserva'});
    if(plantilla) msg=fillTemplate(plantilla,{nombre:ULTIMO_NOMBRE,fecha:SEL.fecha,hora:SEL.hora,servicio:SEL.servicio?.nombre||'',profesional:SEL.profesional?.nombre||'',barberia:B.barberia.nombre,direccion:B.barberia.direccion||''});
  }catch(e){
    console.log('No se pudo cargar la plantilla, usando mensaje por defecto:',e.message);
  }
  abrirWA(B.barberia.whatsapp,msg);
}

function irAClubVip(){
  if(!CLIENTE_CLUB_ID)return;
  location.href='club.html?id='+BARBERIA_ID+'&cliente='+CLIENTE_CLUB_ID;
}

function nuevaReserva(){
  SEL={servicio:null,profesional:null,fecha:null,hora:null};
  CLIENTE_CLUB_ID=null;
  document.getElementById('btn-club-vip').style.display='none';
  document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc-1').classList.add('active');
  document.querySelectorAll('.step-tab').forEach(t=>{t.classList.remove('active','done');});
  document.getElementById('st-1').classList.add('active');
  document.querySelectorAll('.servicio-card,.profesional-card').forEach(c=>c.classList.remove('selected'));
  ['cl-nombre','cl-apellido','cl-wsp','cl-email','cl-notas'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  // Los "Continuar" vuelven a quedar deshabilitados hasta que se elija de nuevo
  // profesional / hora. Sin esto quedaban habilitados de la reserva anterior y
  // se podían saltar los pasos con SEL ya en null, llegando al resumen con
  // "undefined NaN de undefined" en la fecha (new Date("nullT12:00:00") es
  // Invalid Date). Mismo reset que rNuevaReserva() en club.html.
  // El paso 1 ya no tiene botón: se avanza tocando el servicio.
  ['btn-s2','btn-s3'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=true;});
  // SEL.servicio quedó en null arriba, así que esto esconde la línea del
  // servicio elegido en vez de dejar la de la reserva anterior.
  renderServicioElegido();
  document.getElementById('card-horarios').style.display='none';
  window.scrollTo(0,0);
}

init();
</script>
