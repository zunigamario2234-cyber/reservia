<html lang="es">
<head>
<meta charset="UTF-8">

<title>Reservar hora</title>
<!-- Ícono real al "Agregar a inicio": manifest y apple-touch-icon se
     completan en runtime (configurarManifestDinamico(), en init()) con el
     logo_url del negocio actual — estos tags arrancan vacíos/genéricos. -->

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" id="apple-title" content="Reservar">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#08090d;color:#e8e6e0;min-height:100vh}
.portada-wrap{width:100%;max-height:220px;overflow:hidden;background:#0d0e18}
.portada-wrap img{width:100%;height:220px;object-fit:cover;display:block}
.header{padding:20px 24px;border-bottom:0.5px solid #222;display:flex;align-items:center;gap:12px}
.header-logo{font-size:22px;flex-shrink:0}
.header-logo-img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex-shrink:0;background:#12131f}
.header-info h1{font-size:16px;font-weight:600;color:#fff}
.header-info p{font-size:12px;color:#555;margin-top:2px}
.header-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:11px;color:#777}
.header-meta a{color:#7c6af7;text-decoration:none}
.header-meta a:hover{text-decoration:underline}
.header-descripcion{font-size:12px;color:#888;line-height:1.5;margin-top:8px}
@media(max-width:480px){.portada-wrap img{height:130px}}
.container{max-width:640px;margin:0 auto;padding:24px 16px}
.steps{display:flex;gap:0;margin-bottom:28px;border-bottom:0.5px solid #222}
.step-tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:#444;border-bottom:2px solid transparent;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden}
.step-tab::before{content:attr(data-num);display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1a1a1a;color:#666;font-size:10px;font-weight:600;flex-shrink:0}
.step-tab .step-label{overflow:hidden;text-overflow:ellipsis}
.step-tab.active{color:#7c6af7;border-bottom-color:#7c6af7}
.step-tab.active::before{background:#7c6af7;color:#fff}
.step-tab.done{color:#4caf87}
.step-tab.done::before{background:#4caf87;color:#fff;content:'✓'}
.step-content{display:none}.step-content.active{display:block}
.card{background:#0f1018;border:0.5px solid #222;border-radius:12px;padding:20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:#e8e6e0;margin-bottom:14px}
.servicio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.servicio-card{border:0.5px solid #2a2a2a;border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s}
.servicio-card:hover{border-color:#555;background:#1a1a1a}
.servicio-card.selected{border-color:#7c6af7;background:#1a1a18}
.servicio-nombre{font-size:13px;font-weight:600;color:#e8e6e0;margin-bottom:4px}
.servicio-precio{font-size:18px;font-weight:700;color:#7c6af7}
.servicio-dur{font-size:11px;color:#555;margin-top:4px}
.servicio-desc{font-size:11px;color:#777;margin-top:6px;line-height:1.4}
.profesional-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profesional-card{border:0.5px solid #2a2a2a;border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s;text-align:center}
.profesional-card:hover{border-color:#555;background:#1a1a1a}
.profesional-card.selected{border-color:#7c6af7;background:#1a1a18}
.profesional-avatar{width:44px;height:44px;border-radius:50%;background:#1a1a18;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto 8px}
.profesional-nombre{font-size:12px;font-weight:600;color:#e8e6e0}
.perfil-profesional{display:flex;gap:14px;align-items:center;margin-top:16px;padding-top:16px;border-top:0.5px solid #222}
.perfil-prof-foto{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0}
.perfil-prof-nombre{font-size:13px;font-weight:600;color:#e8e6e0;margin-bottom:4px}
.perfil-prof-bio{font-size:12px;color:#999;line-height:1.5}
.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-header{text-align:center;font-size:10px;color:#444;padding:4px 0;font-weight:500;text-transform:uppercase}
.cal-day{text-align:center;padding:8px 4px;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.15s;border:0.5px solid transparent}
.cal-day.empty{cursor:default}
.cal-day.past{color:#333;cursor:not-allowed}
.cal-day.available:hover{border-color:#555;background:#1a1a1a}
.cal-day.selected{background:linear-gradient(135deg,#7c6af7,#5b8def);color:#fff;font-weight:600}
.cal-day.today{border-color:#555}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{background:none;border:0.5px solid #2a2a2a;border-radius:6px;color:#888;padding:5px 10px;cursor:pointer;font-size:14px}
.cal-nav-btn:hover{color:#e8e6e0;border-color:#555}
.cal-mes{font-size:13px;font-weight:600;color:#e8e6e0}
.horarios{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.horario-btn{padding:9px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:0.5px solid #2a2a2a;background:transparent;color:#888;font-size:12px;cursor:pointer;transition:all 0.15s}
.horario-btn:hover:not(:disabled){border-color:#555;color:#e8e6e0;background:#1a1a1a}
.horario-btn.selected{background:#d4a853;color:#0a0a0a;border-color:#7c6af7;font-weight:600}
.horario-btn:disabled{opacity:0.3;cursor:not-allowed}
.form-group{margin-bottom:12px}
label{font-size:11px;color:#555;display:block;margin-bottom:4px}
input,textarea{background:#161616;border:0.5px solid #252525;border-radius:8px;color:#e8e6e0;padding:10px 12px;font-size:13px;width:100%;transition:border-color 0.15s;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#7c6af7}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.btn-primary{background:linear-gradient(135deg,#7c6af7,#5b8def);color:#fff}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#6b59e6,#4a7cde)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:#777;border:0.5px solid #2a2a2a;margin-top:8px}
.btn-ghost:hover{color:#e8e6e0}
.btn-wa{display:block;text-decoration:none;text-align:center;background:#002210;color:#25d366;border:0.5px solid #25d366;margin-top:12px}
.btn-wa:hover{background:#003318}
/* El CSS del modal de ubicación y horario lo inyecta ubicacion-modal.js */
.resumen{background:#13142a;border:0.5px solid #7c6af7;border-radius:10px;padding:16px;margin-bottom:16px}
.resumen-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid #2a2a2a;font-size:13px}
.resumen-row:last-child{border-bottom:none}
.resumen-label{color:#666}
.resumen-val{color:#e8e6e0;font-weight:500}
.success-screen{text-align:center;padding:40px 20px}
.success-icon{font-size:56px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:8px}
.success-sub{font-size:13px;color:#555;line-height:1.6}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px}
.alert-err{background:#1f0000;border:0.5px solid #e05050;color:#e05050}
.alert-warn{background:#1f1600;border:0.5px solid #d4a853;color:#7c6af7}
.no-horarios{text-align:center;padding:20px;color:#444;font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #333;border-top-color:#7c6af7;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.servicio-grid{grid-template-columns:1fr}.profesional-grid{grid-template-columns:1fr 1fr}.horarios{grid-template-columns:repeat(3,1fr)}.fr{grid-template-columns:1fr}}

  .step-label{display:none}
  .step-tab{padding:10px 2px}
  .container{padding:20px 12px}

@media(max-width:340px){.horarios{grid-template-columns:repeat(2,1fr)}}

<div class="container">

<!-- El modal de ubicación y horario lo construye ubicacion-modal.js, que lo
     agrega al body. Acá no va markup. -->
<script src="ubicacion-modal.js"></script>
<script>
// Las credenciales las define supabase-config.js, cargado en el <head>. Si no
// llegó, este bloque moriría en la línea de abajo y la página quedaría viva
// pero inservible: entera en pantalla, congelada en "Cargando...", con los
// botones fallando sin decir nada. El cliente creería que el negocio no
// atiende. Se corta acá y se avisa.
if (typeof SUPABASE_URL === 'undefined') {
  console.error('supabase-config.js no cargó: SUPABASE_URL y SUPABASE_KEY no están definidas. Revisa que el archivo se esté sirviendo (200) junto a esta página.');
  document.body.innerHTML = '<div style="font-family:system-ui,-apple-system,sans-serif;color:#e8e6e0;background:#08090d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;line-height:1.6">No pudimos cargar la página. Intenta de nuevo en unos minutos.</div>';
  throw new Error('supabase-config.js no cargó');
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Obtener slug de la URL: barbercrm.app/reservar.html?barberia=essential-studio
const params = new URLSearchParams(window.location.search);
const BARBERIA_ID = params.get('barberia') || params.get('id');

let B = { barberia:null, servicios:[], profesionals:[], reservasOcupadas:[], horario:{}, bloqueos:[] };
let SEL = { servicio:null, profesional:null, fecha:null, hora:null };
let calMes = new Date();
let ULTIMO_NOMBRE = '';
let SALTAR_PROFESIONAL = false;
let CLIENTE_CLUB_ID = null; // id del cliente ya resuelto (buscar_o_crear_cliente_club) — para armar el link de Club VIP en la pantalla de éxito

const HORARIOS_BASE = ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30'];

function timeToMin(t){ if(!t)return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

// Anticipación mínima para tomar una hora de hoy: no se ofrece nada que empiece
// dentro de los próximos 30 minutos, para que al negocio no le caiga una reserva
// encima de la hora.
const ANTICIPACION_MIN = 30;

// "Ahora" según el reloj de Chile, no el del dispositivo. Un cliente de viaje —o
// con el huso mal configurado— veía la grilla de SU zona: se le escondían horas
// libres, o peor, se le seguían ofreciendo horas ya pasadas. Intl resuelve el
// cambio de horario chileno solo; hardcodear -04/-03 se rompe dos veces al año.
// Devuelve la fecha 'YYYY-MM-DD' y los minutos desde medianoche, las dos cosas
// en la misma zona, para que el calendario y la grilla nunca se contradigan
// cerca de medianoche.
// Esto solo tapa la grilla: el reloj del dispositivo puede estar corrido igual,
// por eso crear_reserva_publica también rechaza fecha/hora pasada del lado del
// servidor (ver migration_hora_pasada.sql). El fallback local es para no romper
// la página entera si Intl fallara.
function ahoraEnChile(){
  try{
    const p = {};
    new Intl.DateTimeFormat('en-CA',{
      timeZone:'America/Santiago', hourCycle:'h23',
      year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'
    }).formatToParts(new Date()).forEach(x=>{ p[x.type]=x.value; });
    return { fecha:`${p.year}-${p.month}-${p.day}`, minutos:(Number(p.hour)%24)*60+Number(p.minute) };
  }catch(e){
    const d = new Date();
    return { fecha:fmtDateLocal(d), minutos:d.getHours()*60+d.getMinutes() };
  }
}

// Cada cuántos minutos arranca un slot. Es el único lugar donde vive el paso de
// la grilla: cuando el intervalo se haga configurable por negocio, se cambia acá.
const PASO_MIN = 30;

// Slots para un día de la semana según horario_negocio. Si el negocio no
// configuró ese día (tabla vacía o falta esa fila puntual), se usa
// HORARIOS_BASE como antes — para no dejar sin horarios a negocios que todavía
// no configuraron su horario.
// La colación es opcional: si las dos columnas vienen nulas, el negocio atiende
// corrido y no se excluye nada.
//
// OJO: esto devuelve dónde PUEDE EMPEZAR una cita, no dónde cabe. Que una cita
// de 60 min quepa a esa hora lo decide cabeEnLaJornada().
function slotsParaDia(diaSemana){
  const cfg = B.horario[diaSemana];
  if(!cfg) return HORARIOS_BASE.slice();
  if(cfg.cerrado) return [];
  const ini=timeToMin(cfg.hora_apertura), fin=timeToMin(cfg.hora_cierre);
  if(ini==null||fin==null) return [];
  const colIni=timeToMin(cfg.hora_colacion_inicio), colFin=timeToMin(cfg.hora_colacion_fin);
  const enColacion = m => colIni!=null && colFin!=null && m>=colIni && m<colFin;
  const out=[];
  for(let m=ini; m<fin; m+=PASO_MIN) if(!enColacion(m)) out.push(minToTime(m));
  return out;
}

// ¿Se pisan los intervalos [aIni,aIni+aDur) y [bIni,bIni+bDur)?
// Este es el criterio que faltaba en todo el cálculo: antes se comparaba solo
// el INICIO, así que un corte de 60 min a las 11:30 dejaba libres las 12:00 y
// las 12:30 con el profesional todavía ocupado.
function seSolapan(aIni,aDur,bIni,bDur){
  return aIni < bIni+bDur && bIni < aIni+aDur;
}

// Hora de cierre del día en minutos, o null si el negocio no configuró ese día
// (ahí manda HORARIOS_BASE y no hay cierre que consultar).
function cierreDelDia(diaSemana){
  const cfg = B.horario[diaSemana];
  if(!cfg || cfg.cerrado) return null;
  return timeToMin(cfg.hora_cierre);
}

// ¿Una cita de `dur` minutos que empieza en `hMin` cabe dentro de la jornada?
// Dos criterios, y hacen falta los dos porque cada uno tapa el hueco del otro:
//
//  - Todas las unidades de la grilla que la cita ocupa tienen que existir en el
//    día. Eso cubre la colación (un servicio de 60 min a las 13:30 con almuerzo
//    a las 14:00 hoy se ofrece, porque solo se mira el inicio) y cubre el
//    fallback HORARIOS_BASE, que no tiene hora_cierre que consultar sino un
//    hueco implícito de 12:30 a 14:00.
//
//  - Y el final no puede pasarse del cierre configurado. Hace falta aparte
//    porque con un cierre no alineado a la grilla —19:20 con pasos de 30— la
//    unidad de las 19:00 existe, y un servicio de 30 min ahí se saldría 10
//    minutos sin que el primer criterio lo note.
function cabeEnLaJornada(hMin, dur, cierre, unidades){
  if(cierre!=null && hMin+dur > cierre) return false;
  for(let m=hMin; m<hMin+dur; m+=PASO_MIN) if(!unidades.has(m)) return false;
  return true;
}

// ¿Este bloqueo choca con una cita de `dur` minutos que empieza en `hMin`?
// Antes se preguntaba si el bloqueo cubría el INICIO del slot, así que un
// bloqueo de 14:00 a 15:00 no impedía un servicio de 60 min a las 13:30.
function bloqueoChocaCon(b, hMin, dur, fecha, diaSemana){
  if(b.tipo==='dia_completo') return b.fecha===fecha;
  let ini=null, fin=null;
  if(b.tipo==='puntual'){
    if(b.fecha!==fecha) return false;
    ini=timeToMin(b.hora_inicio); fin=timeToMin(b.hora_fin);
  }else if(b.tipo==='recurrente'){
    if(b.dia_semana!==diaSemana) return false;
    ini=timeToMin(b.hora_inicio); fin=timeToMin(b.hora_fin);
  }else{
    return false;
  }
  return ini!=null && fin!=null && seSolapan(hMin,dur,ini,fin-ini);
}

// Arma/compara fechas solo con componentes locales (año/mes/día) — nunca vía
// toISOString() ni new Date("YYYY-MM-DD"), que se interpretan como UTC y
// pueden correrse un día según la zona horaria del visitante.
function fmtDateLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function abrirWA(wsp,msg){ const n=(wsp||'').replace(/\D/g,''); window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank'); }

// Mismo criterio de reemplazo de {clave} que buildMsg() en app.html —
// duplicado acá porque este archivo no comparte JS con app.html (ver
// nota de arquitectura: cada HTML es standalone).
function fillTemplate(str,vars){
  let m=str;
  Object.entries(vars).forEach(([k,v])=>{ m=m.replace(new RegExp('{'+k+'}','g'),v||''); });
  return m;
}

// Portada: solo se muestra si hay foto_portada, sin fallback roto (se
// "Agregar a inicio" con el ícono real del negocio: mismo alcance limitado
// que ya tiene mi-agenda.html (solo cambia el ícono/nombre al anclar, no
// hay service worker ni uso offline). El manifest se arma en runtime como
// Blob URL porque cada negocio necesita su propio ícono — no se puede
// servir un manifest.json estático por negocio sin backend. Fallback sin
// logo: el ícono genérico de Reservia que ya usa mi-agenda.html (mismo
// archivo, cero assets nuevos).
function configurarManifestDinamico(barb){
  const icon192 = barb.logo_url || '/mi-agenda-icon-192.png';
  const icon512 = barb.logo_url || '/mi-agenda-icon-512.png';
  const manifest = {
    name: barb.nombre,
    short_name: barb.nombre,
    start_url: location.pathname + location.search,
    display: 'standalone',
    background_color: '#08090d',
    theme_color: '#08090d',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png' },
      { src: icon512, sizes: '512x512', type: 'image/png' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
  document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
  document.getElementById('apple-touch-icon-link').href = icon192;
  document.getElementById('apple-title').content = barb.nombre;
}

function renderHeaderNegocio(barb){
  document.getElementById('h-nombre').textContent = barb.nombre;
  document.getElementById('h-dir').textContent = barb.direccion || '';

  if(barb.foto_portada){

    document.getElementById('header-logo-img').style.display = '';
    document.getElementById('header-logo-glifo').style.display = 'none';
  }

  const meta = [];
  if(barb.telefono) meta.push(`📞 ${barb.telefono}`);
  if(barb.whatsapp) meta.push(`📱 ${barb.whatsapp}`);
  if(barb.instagram) meta.push(`<a href="https://instagram.com/${barb.instagram.replace(/^@/,'')}" target="_blank" rel="noopener">📷 ${barb.instagram}</a>`);
  if(/^https?:\/\//i.test(barb.link_reviews||'')) meta.push(`<a href="${barb.link_reviews}" target="_blank" rel="noopener">⭐ Reseñas</a>`);
  document.getElementById('header-meta').innerHTML = meta.join('');

async function init(){
  if(!BARBERIA_ID){ document.body.innerHTML='<div style="text-align:center;padding:60px;color:#555">URL inválida. Falta el ID de la negocio.</div>'; return; }
  const {data:barb} = await sb.from('barberias').select('*').eq('id',BARBERIA_ID).single();
  if(!barb){ document.body.innerHTML='<div style="text-align:center;padding:60px;color:#555">Negocio no encontrada.</div>'; return; }
  B.barberia = barb;
  renderHeaderNegocio(barb);
  configurarManifestDinamico(barb);
  document.title = 'Reservar — ' + barb.nombre;
  const [{data:sv},{data:ba},{data:hn},{data:blq},{data:bs}] = await Promise.all([
    // Orden manual del dueño (Config → Servicios). Precio de desempate y nulls
    // al final: gemela de la de club.html y mi-agenda.html.
    sb.from('servicios').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true).order('orden',{nullsFirst:false}).order('precio'),
    sb.from('barberos').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true).order('nombre'),
    sb.from('horario_negocio').select('*').eq('barberia_id',BARBERIA_ID),
    sb.from('bloqueos_profesional').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true),
    sb.from('barbero_servicios').select('*').eq('barberia_id',BARBERIA_ID).eq('activo',true)
  ]);
  B.servicios = sv||[]; B.profesionals = ba||[];
  B.horario = {}; (hn||[]).forEach(h=>{ B.horario[h.dia_semana]=h; });
  B.bloqueos = blq||[];
  B.barberoServicios = bs||[];
  // Con guarda: si ubicacion-modal.js no cargara, el ReferenceError cortaría
  // el init() acá y la página se quedaría sin calendario. El modal es
  // accesorio, reservar no.
  if(typeof montarAccesoUbicacion==='function'){
    montarAccesoUbicacion({negocio:B.barberia, horario:B.horario, contenedor:document.getElementById('header-meta')});
  }
  renderServicios(); renderProfesionals(); renderCalendario();
  const profParam = params.get('profesional');
  const profPreseleccionado = profParam && B.profesionals.find(b=>b.id===profParam);
  if(profPreseleccionado){
    // El paso 2 (sc-2) queda oculto en este flujo — SALTAR_PROFESIONAL salta
    // directo de paso 1 a paso 3, así que la foto+bio no se ve si solo se
    // renderiza ahí (renderPerfilProfesional, vía selProfesional). Por eso
    // el banner (siempre visible, arriba de los pasos) las incluye directo.
    selProfesional(profParam);
    SALTAR_PROFESIONAL = true;
    document.getElementById('st-2').style.display = 'none';
    const banner = document.getElementById('prof-preselec');
    banner.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;justify-content:center">
        ${profPreseleccionado.foto_url?`<img src="${profPreseleccionado.foto_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0">`:''}
        <span>Reservando con: <strong style="color:#e8e6e0">${profPreseleccionado.nombre}</strong>${profPreseleccionado.especialidad?` — ${profPreseleccionado.especialidad}`:''}</span>
      </div>
      ${profPreseleccionado.bio?`<div style="margin-top:8px;font-size:11px;color:#888">${profPreseleccionado.bio}</div>`:''}`;
    banner.style.display = '';
  }
}

function renderServicios(){
  document.getElementById('lista-servicios').innerHTML = B.servicios.map(s=>`
    <div class="servicio-card" onclick="selServicio('${s.id}')" id="sv-${s.id}">
      <div class="servicio-nombre">${s.nombre}</div>
      <div class="servicio-precio">$${s.precio.toLocaleString('es-CL')}</div>
      <div class="servicio-dur">${s.duracion_min} min</div>
      ${s.descripcion?`<div class="servicio-desc">${s.descripcion}</div>`:''}
    </div>`).join('') || '<p style="color:#555;font-size:13px">No hay servicios disponibles.</p>';
}

// Un profesional califica para un servicio si tiene la fila activa en
// barbero_servicios. Misma definición para filtrar la grilla y para decidir si
// una selección previa sobrevive al cambio de servicio: si fueran criterios
// distintos, la grilla y el estado se irían separando.
function profesionalCalifica(prof, servicio){
  return !!(prof && servicio && B.barberoServicios.some(bs=>
    bs.barbero_id===prof.id && bs.servicio_id===servicio.id));
}

function selServicio(id){
  SEL.servicio = B.servicios.find(s=>s.id===id);
  document.querySelectorAll('.servicio-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('sv-'+id).classList.add('selected');
  document.getElementById('btn-s1').disabled = false;
  // El profesional elegido puede dejar de calificar para el nuevo servicio, así
  // que se limpia la selección y se re-renderiza la grilla filtrada.
  //
  // SOLO si dejó de calificar. Antes se limpiaba SIEMPRE, y eso rompía las
  // reservas que entran por un link con ?profesional=: ahí el paso 2 está
  // oculto y "Continuar" salta al 3, así que el cliente se quedaba sin ninguna
  // pantalla donde volver a elegirlo y la reserva moría en irPaso(5) con
  // "Falta elegir servicio, profesional, fecha u hora". Con un solo profesional
  // el bug quedaba tapado, porque renderProfesionals() autoselecciona.
  if(!profesionalCalifica(SEL.profesional, SEL.servicio)){
    SEL.profesional = null;
    document.getElementById('btn-s2').disabled = true;
    document.getElementById('perfil-profesional').style.display = 'none';
  }
  renderProfesionals();
  // Si el profesional del link no hace este servicio no se puede seguir
  // saltando el paso 2: se restaura el flujo normal para que el cliente elija,
  // y se baja el banner, que quedaría anunciando a alguien que ya no es.
  if(SALTAR_PROFESIONAL && !SEL.profesional){
    SALTAR_PROFESIONAL = false;
    document.getElementById('st-2').style.display = '';
    document.getElementById('prof-preselec').style.display = 'none';
  }
}

// Filtra por barbero_servicios: solo profesionales con ese servicio activo
// califican para el paso 2.
//
// YA NO EXISTE "Cualquier profesional". Una reserva sin persona asignada no
// le avisa a nadie —el resolver de correos la descarta de entrada— y alguien
// tiene que acordarse de asignarla antes de la cita. Se elimina el estado
// ambiguo en vez de construir avisos para gestionarlo.
//
// Con UN solo profesional que califique se autoselecciona: una lista de uno
// es un clic sin información. Con NINGUNO la grilla quedaría vacía y el botón
// "Continuar" no se habilitaría nunca, así que se explica en vez de dejar al
// cliente trabado sin saber por qué. Ese caso no es solo "negocio sin
// configurar": pasa cada vez que un servicio nuevo no tiene ningún
// profesional asociado en barbero_servicios, y también si todos los que
// califican están inactivos — init() ya no los trae.
function renderProfesionals(){
  const items = SEL.servicio
    ? B.profesionals.filter(b=>profesionalCalifica(b,SEL.servicio))
    : B.profesionals;
  const cont = document.getElementById('lista-profesionals');
  if(!items.length){
    cont.innerHTML = '<div class="no-horarios" style="grid-column:1/-1">Este servicio no tiene profesionales disponibles por ahora. Prueba con otro servicio.</div>';
    return;
  }
  cont.innerHTML = items.map(b=>`
    <div class="profesional-card" onclick="selProfesional('${b.id}')" id="ba-${b.id}">
      <div class="profesional-avatar">${b.foto_url?`<img src="${b.foto_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:'✂'}</div>
      <div class="profesional-nombre">${b.nombre}</div>
    </div>`).join('');
  // Re-pintar la grilla borra la clase 'selected' del DOM, así que la selección
  // vigente se vuelve a aplicar. Importa sobre todo con ?profesional=, donde el
  // paso 2 está oculto y la elección solo vive en SEL.
  if(SEL.profesional && items.some(b=>b.id===SEL.profesional.id)) selProfesional(SEL.profesional.id);
  else if(items.length===1) selProfesional(items[0].id);
}

function selProfesional(id){
  const prof = B.profesionals.find(b=>b.id===id);
  // Sin profesional válido no se habilita "Continuar": es la única forma de
  // llegar al paso 3, así que el flujo no puede avanzar sin persona elegida.
  if(!prof) return;
  SEL.profesional = prof;
  document.querySelectorAll('.profesional-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('ba-'+id).classList.add('selected');
  document.getElementById('btn-s2').disabled = false;
  renderPerfilProfesional(SEL.profesional);
}

// Foto grande + bio del profesional elegido, antes de continuar — se omite
// entero si el profesional no tiene bio, foto ni especialidad.
function renderPerfilProfesional(prof){
  const cont = document.getElementById('perfil-profesional');
  if(!prof || (!prof.foto_url && !prof.bio && !prof.especialidad)){ cont.style.display = 'none'; return; }
  cont.innerHTML = `
    ${prof.foto_url?`<img src="${prof.foto_url}" class="perfil-prof-foto">`:''}
    <div>
      <div class="perfil-prof-nombre">${prof.nombre}${prof.especialidad?` — ${prof.especialidad}`:''}</div>
      ${prof.bio?`<div class="perfil-prof-bio">${prof.bio}</div>`:''}
    </div>`;
  cont.style.display = 'flex';
}

function renderCalendario(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const hoyStr = ahoraEnChile().fecha;
  document.getElementById('cal-mes-label').textContent = meses[calMes.getMonth()]+' '+calMes.getFullYear();
  const primerDia = new Date(calMes.getFullYear(),calMes.getMonth(),1);
  const ultimoDia = new Date(calMes.getFullYear(),calMes.getMonth()+1,0);
  let lunes = primerDia.getDay()-1; if(lunes===-1)lunes=6;
  const cal = document.getElementById('calendario');
  const headers = cal.querySelectorAll('.cal-header');
  cal.innerHTML='';
  headers.forEach(h=>cal.appendChild(h.cloneNode(true)));
  for(let i=0;i<lunes;i++) cal.innerHTML+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=ultimoDia.getDate();d++){
    const fecha = new Date(calMes.getFullYear(),calMes.getMonth(),d);
    const fechaStr = fmtDateLocal(fecha);
    const past = fechaStr < hoyStr;
    const sel = SEL.fecha===fechaStr;
    const hoyClass = fechaStr===hoyStr?'today':'';
    cal.innerHTML+=`<div class="cal-day ${past?'past':'available'} ${sel?'selected':''} ${hoyClass}" ${!past?`onclick="selFecha('${fechaStr}')"`:''}">${d}</div>`;
  }
}

function cambiarMes(dir){
  calMes.setMonth(calMes.getMonth()+dir);
  renderCalendario();
}

async function selFecha(fecha){
  SEL.fecha = fecha; SEL.hora = null;
  document.getElementById('btn-s3').disabled = true;
  renderCalendario();
  const barb = document.getElementById('card-horarios');
  barb.style.display = '';
  const d = new Date(fecha+'T12:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('horarios-titulo').textContent = `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
  // Cargar reservas existentes para ese día y profesional. Se usa la vista
  // pública reservas_disponibilidad (no la tabla real) para no exponer datos
  // del cliente a visitantes anónimos — expone hora, profesional y la duración
  // ya resuelta, nunca nombre/whatsapp/correo/notas.
  //
  // Ya NO se filtra por procesado=false, a propósito: procesarReserva() en
  // app.html marca procesado=true junto con estado='Atendida', y el dueño suele
  // cobrar cuando el cliente se sienta, no cuando se va. Con el cálculo por
  // duración, filtrarlo liberaba los slots siguientes con el profesional
  // todavía ocupado. Las canceladas las descarta la propia vista, así que todo
  // lo que llega acá ocupa la silla de verdad.
  let query = sb.from('reservas_disponibilidad').select('hora,barbero_nombre,duracion_min').eq('barberia_id',BARBERIA_ID).eq('fecha',fecha);
  const {data:ocupadas} = await query;
  B.reservasOcupadas = ocupadas||[];
  renderHorarios();
}

function renderHorarios(){
  const d = new Date(SEL.fecha+'T12:00:00');
  const diaSemana = d.getDay();
  // Si el día elegido es hoy, se descartan las horas que ya pasaron y las que
  // caen dentro de la anticipación mínima. Se filtran en vez de deshabilitarse:
  // a las 22:00 la grilla mostraba 18 botones muertos.
  const ahora = ahoraEnChile();
  const esHoy = SEL.fecha === ahora.fecha;
  const desdeMin = ahora.minutos + ANTICIPACION_MIN;
  // El servicio se elige en el paso 1, así que acá ya está. El fallback de 30
  // es la red por si algún camino nuevo llega antes de tiempo, y coincide con
  // el que usa la vista para las reservas sin servicio.
  const dur = SEL.servicio?.duracion_min || 30;
  const delDia = slotsParaDia(diaSemana);
  const unidades = new Set(delDia.map(timeToMin));
  const cierre = cierreDelDia(diaSemana);
  const slots = delDia.filter(h => !esHoy || timeToMin(h) >= desdeMin);
  document.getElementById('lista-horarios').innerHTML = slots.map(h=>{
    const hMin = timeToMin(h);
    // La cita ocupa [hMin, hMin+dur). Tiene que caber en la jornada y no pisar
    // ninguna reserva ni bloqueo del profesional.
    const cabe = cabeEnLaJornada(hMin, dur, cierre, unidades);
    const ocupadoPorReserva = B.reservasOcupadas.some(r=>{
      if(SEL.profesional && r.barbero_nombre!==SEL.profesional.nombre) return false;
      const rMin = timeToMin(r.hora);
      return rMin!=null && seSolapan(hMin, dur, rMin, r.duracion_min||30);
    });
    // Al paso 3 no se llega sin profesional elegido, así que en la práctica
    // siempre se toma la primera rama. La segunda queda como red por si algún
    // camino nuevo llega acá antes de tiempo: ante la duda oculta de más, que
    // es el error barato. Antes era el caso normal, cuando existía "Cualquier
    // profesional".
    const bloqueado = SEL.profesional
      ? B.bloqueos.some(b=>b.profesional_id===SEL.profesional.id && bloqueoChocaCon(b,hMin,dur,SEL.fecha,diaSemana))
      : B.bloqueos.some(b=>bloqueoChocaCon(b,hMin,dur,SEL.fecha,diaSemana));
    const ocupado = !cabe || ocupadoPorReserva || bloqueado;
    const sel = h===SEL.hora;
    return`<button class="horario-btn ${sel?'selected':''}" ${ocupado?'disabled':''} onclick="selHora('${h}')">${h}</button>`;
  }).join('') || `<div class="no-horarios">${esHoy?'Ya no quedan horarios disponibles para hoy. Elige otro día.':'No hay horarios disponibles.'}</div>`;
}

function selHora(h){
  SEL.hora = h;
  document.querySelectorAll('.horario-btn').forEach(b=>b.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('btn-s3').disabled = false;
}

function irPaso(n){
  // Validar paso 4
  if(n===5){
    // Red de seguridad: el resumen arma la fecha con new Date(SEL.fecha+'T12:00:00'),
    // que con SEL.fecha en null da Invalid Date y pinta "undefined NaN de undefined".
    // Los botones deshabilitados ya deberían impedir llegar acá sin elegir, pero
    // esto lo cierra por si algún camino nuevo se saltea esa validación.
    if(!SEL.servicio||!SEL.profesional||!SEL.fecha||!SEL.hora){alert('Falta elegir servicio, profesional, fecha u hora. Vuelve a los primeros pasos.');return;}
    const nombre=document.getElementById('cl-nombre').value.trim();
    const wsp=document.getElementById('cl-wsp').value.trim();
    const email=document.getElementById('cl-email').value.trim();
    if(!nombre||!wsp||!email){alert('Nombre, WhatsApp y correo son obligatorios.');return;}
    if(!email.includes('@')){alert('Ingresa un correo válido.');return;}
    renderResumen();
  }
  document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.step-tab').forEach((t,i)=>{
    t.classList.remove('active');
    if(i<n-1)t.classList.add('done');
    else t.classList.remove('done');
  });
  const sc = document.getElementById('sc-'+n);
  if(sc){sc.classList.add('active'); document.getElementById('st-'+n).classList.add('active');}
  window.scrollTo(0,0);
}

function renderResumen(){
  const nombre=document.getElementById('cl-nombre').value.trim()+' '+document.getElementById('cl-apellido').value.trim();
  const d=new Date(SEL.fecha+'T12:00:00');
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('resumen-reserva').innerHTML=`
    <div class="resumen-row"><span class="resumen-label">Servicio</span><span class="resumen-val">${SEL.servicio?.nombre}</span></div>
    <div class="resumen-row"><span class="resumen-label">Profesional</span><span class="resumen-val">${SEL.profesional?.nombre||''}</span></div>
    <div class="resumen-row"><span class="resumen-label">Fecha</span><span class="resumen-val">${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}</span></div>
    <div class="resumen-row"><span class="resumen-label">Hora</span><span class="resumen-val">${SEL.hora} hrs</span></div>
    <div class="resumen-row"><span class="resumen-label">Valor</span><span class="resumen-val" style="color:#7c6af7">$${SEL.servicio?.precio.toLocaleString('es-CL')}</span></div>
    <div class="resumen-row"><span class="resumen-label">Cliente</span><span class="resumen-val">${nombre.trim()}</span></div>`;
}

async function confirmarReserva(){
  const btn=document.getElementById('btn-confirmar');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Confirmando...';
  const nombre=document.getElementById('cl-nombre').value.trim();
  const apellido=document.getElementById('cl-apellido').value.trim();
  const wsp=document.getElementById('cl-wsp').value.trim();
  const email=document.getElementById('cl-email').value.trim();
  const cumpleanos=document.getElementById('cl-cumple').value||null;
  const notas=document.getElementById('cl-notas').value.trim();
  try{
    // Se crea vía RPC (security definer), no con insert().select() directo:
    // Postgres aplica la política de SELECT (privada) también al RETURNING
    // de un insert, y un cliente anónimo nunca la cumple. El RPC hace el
    // insert del lado del servidor y devuelve solo el id — mismo patrón
    // que get_club_vip_publico.
    const {data:reservaId,error}=await sb.rpc('crear_reserva_publica',{
      p_barberia_id:BARBERIA_ID,
      p_nombre_cliente:nombre+' '+apellido,
      p_whatsapp_cliente:wsp,
      p_fecha:SEL.fecha,
      p_hora:SEL.hora,
      p_email_cliente:email,
      p_cumpleanos_cliente:cumpleanos,
      p_servicio:SEL.servicio?.nombre,
      p_barbero_nombre:SEL.profesional.nombre,
      p_notas:notas
    });
    if(error)throw error;
    const data={id:reservaId};
    ULTIMO_NOMBRE=(nombre+' '+apellido).trim();
    // Email de confirmación automático (Vercel + Resend). No bloquea la UI ni
    // muestra error al cliente si falla — el servidor decide con qué datos reales.
    fetch('/api/enviar-confirmacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reservaId:data.id})}).catch(()=>{});
    // Resuelve (busca o crea) la ficha de cliente para poder armar el link
    // de Club VIP — paso adicional después de que la reserva ya se creó,
    // no reemplaza nada del flujo existente. No bloquea el éxito de la
    // reserva si falla: el cliente igual ve su confirmación, solo no ve
    // el botón de Club VIP.
    try{
      const {data:clienteId,error:errCliente}=await sb.rpc('buscar_o_crear_cliente_club',{p_barberia_id:BARBERIA_ID,p_reserva_id:reservaId});
      if(!errCliente&&clienteId){
        CLIENTE_CLUB_ID=clienteId;
        document.getElementById('btn-club-vip').style.display='';
      }
    }catch(e){
      console.log('No se pudo resolver el cliente para el Club VIP:',e.message);
    }
    // Mostrar éxito
    document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
    document.getElementById('sc-exito').classList.add('active');
    document.getElementById('success-msg').innerHTML=`Tu reserva quedó registrada.<br><br>📅 ${SEL.fecha} a las ${SEL.hora} hrs<br>✂️ ${SEL.servicio?.nombre} con ${SEL.profesional.nombre}<br><br>¡Te esperamos en ${B.barberia.nombre}!`;
    document.getElementById('btn-wa-confirmar').style.display=B.barberia.whatsapp?'':'none';
  }catch(e){
    const al=document.getElementById('alert-confirm');
    al.textContent='Error al confirmar: '+e.message; al.style.display='';
  }finally{
    // Repone el botón SIEMPRE, salga bien o mal. Antes solo se reponía en el
    // catch: tras una reserva exitosa quedaba en "Confirmando..." y
    // deshabilitado para siempre, y como nuevaReserva() tampoco lo tocaba, al
    // volver con "Hacer otra reserva" el usuario llegaba al paso Confirmar con
    // un botón muerto — sin poder reservar de nuevo ni recibir ninguna señal.
    btn.disabled=false; btn.innerHTML='✓ Confirmar reserva';
  }
}

async function confirmarPorWhatsApp(){
  if(!B.barberia?.whatsapp)return;
  const fallback=`Hola! Quiero confirmar mi reserva en ${B.barberia.nombre}:\n📅 ${SEL.fecha} a las ${SEL.hora} hrs\n✂️ ${SEL.servicio?.nombre||''}${SEL.profesional?' con '+SEL.profesional.nombre:''}\nNombre: ${ULTIMO_NOMBRE}`;
  let msg=fallback;
  try{
    const {data:plantilla}=await sb.rpc('obtener_plantilla_publica',{p_barberia_id:BARBERIA_ID,p_evento:'Cliente confirma reserva'});
    if(plantilla) msg=fillTemplate(plantilla,{nombre:ULTIMO_NOMBRE,fecha:SEL.fecha,hora:SEL.hora,servicio:SEL.servicio?.nombre||'',profesional:SEL.profesional?.nombre||'',barberia:B.barberia.nombre,direccion:B.barberia.direccion||''});
  }catch(e){
    console.log('No se pudo cargar la plantilla, usando mensaje por defecto:',e.message);
  }
  abrirWA(B.barberia.whatsapp,msg);
}

function irAClubVip(){
  if(!CLIENTE_CLUB_ID)return;
  location.href='club.html?id='+BARBERIA_ID+'&cliente='+CLIENTE_CLUB_ID;
}

function nuevaReserva(){
  SEL={servicio:null,profesional:null,fecha:null,hora:null};
  CLIENTE_CLUB_ID=null;
  document.getElementById('btn-club-vip').style.display='none';
  document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc-1').classList.add('active');
  document.querySelectorAll('.step-tab').forEach(t=>{t.classList.remove('active','done');});
  document.getElementById('st-1').classList.add('active');
  document.querySelectorAll('.servicio-card,.profesional-card').forEach(c=>c.classList.remove('selected'));
  ['cl-nombre','cl-apellido','cl-wsp','cl-email','cl-notas'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  // Los "Continuar" vuelven a quedar deshabilitados hasta que se elija de nuevo
  // servicio / profesional / hora. Sin esto quedaban habilitados de la reserva
  // anterior y se podían saltar los pasos 1-3 con SEL ya en null, llegando al
  // resumen con "undefined NaN de undefined" en la fecha (new Date("nullT12:00:00")
  // es Invalid Date). Mismo reset que rNuevaReserva() en club.html.
  ['btn-s1','btn-s2','btn-s3'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=true;});
  document.getElementById('card-horarios').style.display='none';
  window.scrollTo(0,0);
}

init();
</script>
