<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Agenda</title>

<!-- PWA: manifest + service worker exclusivos de esta página (ver
     mi-agenda-manifest.json y mi-agenda-sw.js). No se referencian desde
     app.html/reservar.html/club.html/index.html/ingresar.html — esas páginas siguen
     sirviéndose frescas del servidor, sin manifest ni service worker. -->
<link rel="manifest" href="/mi-agenda-manifest.json">
<meta name="theme-color" content="#08090d">

<!-- "Agregar a inicio" en iOS/Safari no sigue el estándar de manifest.json
     de Chrome/Android — necesita estos meta tags propios. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<link rel="apple-touch-icon" href="/mi-agenda-icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="tema.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* TEMA: valores por defecto = los colores de siempre; aplicarTema() (tema.js) los
   reemplaza con el color de marca y el modo del negocio. Ver club.html. */
:root{
  --acento:#7c6af7;--acento-2:#5b8def;--acento-hover:#6b59e6;--acento-2-hover:#4a7cde;--texto-sobre-acento:#fff;--spinner-anillo:#333;
  --fondo:#08090d;--tarjeta:#0f1018;--borde:#222;--input-fondo:#161616;--input-borde:#252525;
  --texto:#e8e6e0;--texto-fuerte:#fff;--texto-suave:#888;--texto-medio:#777;--texto-debil:#555;--texto-apagado:#666;--texto-tenue:#444;--texto-inerte:#333;--texto-bio:#999;
  --borde-suave:#1a1a1a;--borde-2:#2a2a2a;--borde-fuerte:#555;--superficie-2:#1a1a1a;--chip-fondo:#13142a;
  --alerta-fondo:#1f0000;--alerta-borde:#e05050;--alerta-texto:#e05050;--alerta-hover:#2a0000;
  --wa-fondo:#002210;--wa-borde:#25d366;--wa-texto:#25d366;--wa-hover:#003318;
  --b-green-fondo:#0f2a1a;--b-green-texto:#5cd685;--b-blue-texto:#6ab0e0;
  --nota-fondo:#231b0e;--nota-borde:#4a3a1a;--nota-acento:#e0a850;--nota-texto:#d8c9a8;
  --veil:rgba(0,0,0,0.7);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh}
.header{padding:24px;text-align:center}
.header h1{font-size:15px;font-weight:600;color:var(--texto-suave);letter-spacing:0.3px}
.container{max-width:560px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--tarjeta);border:0.5px solid var(--borde);border-radius:14px;padding:20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--texto);margin-bottom:14px}
.empty{text-align:center;color:var(--texto-tenue);font-size:12px;padding:16px 0}
.msg-full{text-align:center;padding:80px 20px;color:var(--texto-debil);font-size:13px;line-height:1.6}
.tabs-top{display:flex;gap:8px;margin-bottom:18px}
.tab-btn{flex:1;padding:10px;border-radius:10px;border:0.5px solid var(--borde);background:var(--tarjeta);color:var(--texto-apagado);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit}
.tab-btn.active{border-color:var(--acento);color:var(--texto);background:var(--chip-fondo)}
label{font-size:11px;color:var(--texto-debil);display:block;margin-bottom:4px}
.form-group{margin-bottom:12px}
input,textarea,select{background:var(--input-fondo);border:0.5px solid var(--input-borde);border-radius:8px;color:var(--texto);padding:10px 12px;font-size:13px;width:100%;transition:border-color 0.15s;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acento)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--acento),var(--acento-2));color:var(--texto-sobre-acento)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,var(--acento-hover),var(--acento-2-hover))}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--texto-medio);border:0.5px solid var(--borde-2)}
.btn-ghost:hover{color:var(--texto)}
.btn-danger{background:var(--alerta-fondo);color:var(--alerta-texto);border:0.5px solid var(--alerta-borde)}
.btn-danger:hover{background:var(--alerta-hover)}
.btn-wa{display:inline-block;text-decoration:none;text-align:center;background:var(--wa-fondo);color:var(--wa-texto);border:0.5px solid var(--wa-borde);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-wa:hover{background:var(--wa-hover)}
.btn-sm{width:auto;padding:8px 12px;font-size:12px}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px}
.alert-err{background:var(--alerta-fondo);border:0.5px solid var(--alerta-borde);color:var(--alerta-texto)}
.alert-ok{background:var(--b-green-fondo);border:0.5px solid var(--b-green-texto);color:var(--b-green-texto);line-height:1.5}
.link-btn{background:none;border:none;color:var(--acento);font-size:12px;cursor:pointer;font-family:inherit;padding:10px 0 0;width:100%;text-align:center}
.link-btn:hover{text-decoration:underline}
.link-btn:disabled{opacity:0.5;cursor:not-allowed}
.ayuda{font-size:12px;color:var(--texto-medio);line-height:1.6;margin-bottom:14px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--spinner-anillo);border-top-color:var(--acento);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.cita-item{border:0.5px solid var(--borde-suave);border-radius:10px;padding:14px;margin-bottom:10px}
.cita-hora{font-size:16px;font-weight:700;color:var(--acento)}
.cita-cliente{font-size:14px;font-weight:600;color:var(--texto);margin-top:2px}
.cita-detalle{font-size:12px;color:var(--texto-medio);margin-top:4px}
/* La nota del CLIENTE (clientes.notas), distinta de la nota de la CITA
   (.cita-detalle con 📝). Tres señales a la vez para que no se confundan:
   posición —va pegada al nombre, porque habla de la persona, no del turno—,
   forma —caja con borde, no texto suelto— y la etiqueta "Del cliente:".
   Ámbar y no rojo: muchas son neutrales ("prefiere poco charla"), no alertas. */
.cita-nota-cliente{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--nota-fondo);border:0.5px solid var(--nota-borde);border-left:2px solid var(--nota-acento);font-size:12px;color:var(--nota-texto);line-height:1.5}
.cita-nota-cliente b{color:var(--nota-acento);font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:var(--b-green-fondo);color:var(--b-green-texto)}
.b-blue{background:var(--b-blue-fondo);color:var(--b-blue-texto)}
.b-red{background:var(--alerta-fondo);color:var(--alerta-texto)}
.b-gray{background:var(--superficie-2);color:var(--texto-suave)}
.cita-acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.serv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--borde-suave);font-size:12px}
.serv-row:last-child{border-bottom:none}
.com-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.com-chip{flex:1 1 calc(50% - 4px);padding:11px 8px;border-radius:10px;border:0.5px solid var(--borde);background:var(--tarjeta);color:var(--texto-suave);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit;text-align:center}
.com-chip.active{border-color:var(--acento);color:var(--texto);background:var(--chip-fondo)}
.com-hero{background:var(--chip-fondo);border:0.5px solid var(--acento);border-radius:14px;padding:20px;margin-bottom:14px;text-align:center}
.com-hero-label{font-size:11px;color:var(--texto-bio);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.com-hero-row{display:flex;gap:16px}
.com-hero-item{flex:1}
.com-hero-item .val{font-size:24px;font-weight:700;color:var(--texto);line-height:1.2}
.com-hero-item .val.comision{color:var(--acento)}
.com-hero-item .lbl{font-size:11px;color:var(--texto-bio);margin-top:6px}
.overlay{display:none;position:fixed;inset:0;background:var(--veil);align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:20px 0}
.overlay.open{display:flex}
.modal{background:var(--tarjeta);border:0.5px solid var(--borde);border-radius:14px;padding:22px;max-width:440px;width:calc(100% - 32px);margin-top:20px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:14px;font-weight:600;color:var(--texto)}
.xbtn{background:none;border:none;color:var(--texto-apagado);font-size:18px;cursor:pointer}
.suggest-box{position:relative}
.suggest-list{display:none;position:absolute;top:100%;left:0;right:0;background:var(--input-fondo);border:0.5px solid var(--borde-2);border-radius:8px;z-index:50;max-height:160px;overflow-y:auto;margin-top:2px}
.suggest-list.open{display:block}
.suggest-item{padding:8px 12px;font-size:12px;cursor:pointer}
.suggest-item:hover{background:var(--superficie-2)}

/* Selector de vista y calendario por horas */
.vista-toggle{display:flex;gap:6px;margin-bottom:12px}
.vista-btn{flex:1;padding:9px;border-radius:10px;border:0.5px solid var(--borde);background:var(--tarjeta);color:var(--texto-apagado);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.vista-btn.active{border-color:var(--acento);color:var(--texto);background:var(--chip-fondo)}
.cal-wrap{position:relative;display:flex;background:var(--tarjeta);border:0.5px solid var(--borde);border-radius:14px;overflow:hidden;margin-bottom:14px}
.cal-gutter{width:46px;flex-shrink:0;position:relative;border-right:0.5px solid var(--borde-suave)}
.cal-hora{position:absolute;left:0;right:6px;transform:translateY(-50%);font-size:10px;color:var(--texto-debil);text-align:right}
.cal-hora.primera{transform:none}
.cal-hora.ultima{transform:translateY(-100%)}
.cal-col{flex:1;position:relative;min-width:0}
.cal-linea{position:absolute;left:0;right:0;height:0;border-top:0.5px solid var(--borde-suave);pointer-events:none}
.cal-linea.hora{border-top-color:var(--borde)}
.cal-banda{position:absolute;left:0;right:0;pointer-events:none;z-index:1;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;font-size:10px;font-weight:600;color:var(--texto-debil);background-image:repeating-linear-gradient(135deg,transparent 0,transparent 6px,var(--borde) 6px,var(--borde) 7px);background-color:var(--superficie-2)}
.cal-banda span{margin-top:4px;padding:1px 6px;border-radius:4px;background:var(--tarjeta);border:0.5px solid var(--borde-2)}
.cal-banda.colacion{color:var(--nota-acento)}
.cal-banda.bloqueo{color:var(--alerta-texto)}
.cal-cita{position:absolute;left:4px;right:4px;z-index:3;border-radius:8px;padding:4px 8px;overflow:hidden;cursor:pointer;border:1px solid var(--c);color:var(--c);background:var(--superficie-2);background:color-mix(in srgb,var(--c) 14%,var(--tarjeta));font-size:11px;line-height:1.3;text-align:left;font-family:inherit;box-sizing:border-box}
.cal-cita b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cita span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cita.sel{box-shadow:0 0 0 2px var(--acento)}
.cal-cita.e-pendiente{--c:var(--nota-acento)}
.cal-cita.e-confirmada{--c:var(--b-blue-texto)}
.cal-cita.e-curso{--c:var(--acento)}
.cal-cita.e-atendida{--c:var(--b-green-texto)}
.cal-cita.e-cancelada{--c:var(--alerta-texto);opacity:.6;text-decoration:line-through}
.cal-cita.e-noasistio{--c:var(--texto-suave)}
.cal-ahora{position:absolute;left:0;right:0;height:1.5px;background:var(--alerta-texto);z-index:4;pointer-events:none}
.cal-ahora::before{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--alerta-texto)}
.cal-ayuda{font-size:11px;color:var(--texto-debil);text-align:center;margin:-4px 0 12px}
.ag-origen{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.ag-origen svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gift-fila{display:flex;gap:6px;flex-basis:100%;margin-top:4px}
.gift-fila input{flex:1;min-width:0;text-transform:uppercase}
</style>
</head>
<body>

<div class="header"><h1 id="h-nombre">Mi Agenda</h1></div>
<div class="container">

  <div id="login-view">
    <div class="card">
      <div class="card-title">Iniciar sesión</div>
      <div id="li-alert" class="alert alert-err" style="display:none"></div>
      <div id="li-ok" class="alert alert-ok" style="display:none"></div>
      <div class="form-group"><label>Correo</label><input type="email" id="li-email" placeholder="tu@correo.com"></div>
      <div class="form-group"><label>Contraseña</label><input type="password" id="li-pass" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="btn-login" onclick="login()">Entrar</button>
      <button class="link-btn" id="btn-olvide" onclick="pedirRecuperacion()">¿Olvidaste tu contraseña?</button>
    </div>
  </div>

  <!-- Pantalla para elegir contraseña. Se muestra solo cuando se llegó desde un
       enlace de correo (recovery / magic link / invitación), nunca por
       navegación normal. -->
  <div id="recuperar-view" style="display:none">
    <div class="card">
      <div class="card-title">Elige tu contraseña</div>
      <div id="rc-alert" class="alert alert-err" style="display:none"></div>
      <p class="ayuda">Este enlace sirve una sola vez. Define tu contraseña ahora
      y entras directo a tu agenda; la próxima vez ya puedes usarla para
      iniciar sesión.</p>
      <div class="form-group"><label>Contraseña nueva</label><input type="password" id="rc-pass" placeholder="Al menos 8 caracteres"></div>
      <div class="form-group"><label>Repítela</label><input type="password" id="rc-pass2" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="btn-guardar-pass" onclick="guardarPassword()">Guardar y entrar</button>
    </div>
  </div>

  <div id="app-view" style="display:none">
    <div class="tabs-top">
      <button class="tab-btn active" id="tab-btn-agenda" onclick="cambiarTab('agenda')">📅 Agenda</button>
      <button class="tab-btn" id="tab-btn-comisiones" onclick="cambiarTab('comisiones')">💰 Mis ventas</button>
    </div>

    <div id="tab-agenda">
      <div class="card">
        <div class="fr">
          <div class="form-group"><label>Fecha</label><input type="date" id="ag-fecha" onchange="cargarAgenda()"></div>
          <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-primary" onclick="abrirNuevaReserva()">+ Reservar</button></div>
        </div>
      </div>
      <div class="vista-toggle" role="tablist" aria-label="Forma de ver la agenda">
        <button type="button" id="vista-lista" class="vista-btn" role="tab" onclick="setVistaAgenda('lista')">☰ Lista</button>
        <button type="button" id="vista-cal" class="vista-btn" role="tab" onclick="setVistaAgenda('calendario')">▦ Calendario</button>
      </div>
      <div id="citas-lista"></div>
      <div id="citas-cal" style="display:none"></div>
    </div>

    <div id="tab-comisiones" style="display:none">
      <div class="com-chips" id="com-chips">
        <button class="com-chip" data-rango="hoy" onclick="comSetRango('hoy')">Hoy</button>
        <button class="com-chip" data-rango="semana" onclick="comSetRango('semana')">Esta semana</button>
        <button class="com-chip active" data-rango="mes" onclick="comSetRango('mes')">Este mes</button>
        <button class="com-chip" data-rango="personalizado" onclick="comSetRango('personalizado')">Personalizado</button>
      </div>
      <div class="fr" id="com-personalizado" style="display:none">
        <div class="form-group"><label>Desde</label><input type="date" id="com-desde" onchange="comCargar()"></div>
        <div class="form-group"><label>Hasta</label><input type="date" id="com-hasta" onchange="comCargar()"></div>
      </div>
      <div id="com-resumen"><div class="msg-full">Cargando...</div></div>
    </div>

    <button class="btn btn-ghost" style="margin-top:20px" onclick="logout()">Cerrar sesión</button>
  </div>

</div>

<!-- Modal: nueva reserva -->
<div class="overlay" id="m-reserva">
  <div class="modal">
    <div class="modal-hdr"><span class="modal-title">Nueva reserva</span><button class="xbtn" onclick="cerrarModal()">×</button></div>
    <div id="nr-alert" class="alert alert-err" style="display:none"></div>
    <div class="form-group suggest-box">
      <label>Cliente (buscar existente o escribir nombre nuevo)</label>
      <input type="text" id="nr-buscar" placeholder="Nombre o WhatsApp..." oninput="buscarClienteAgenda(this.value)" autocomplete="off">
      <div class="suggest-list" id="nr-sugerencias"></div>
    </div>
    <div class="fr">
      <div class="form-group"><label>Nombre *</label><input type="text" id="nr-nombre" placeholder="Juan Pérez"></div>
      <div class="form-group"><label>WhatsApp *</label><input type="text" id="nr-wsp" placeholder="+56 9 XXXX XXXX"></div>
    </div>
    <!-- Correo y cumpleaños son OPCIONALES a propósito: en el mostrador se
         agenda rápido y muchas veces no se tienen a mano. Pedirlos
         obligatorios frenaría la reserva por un dato que se puede completar
         después desde la ficha. -->
    <div class="fr">
      <div class="form-group"><label>Correo (opcional)</label><input type="email" id="nr-email" placeholder="cliente@correo.com"></div>
      <div class="form-group"><label>Fecha de nacimiento (opcional)</label><input type="date" id="nr-cumple"></div>
    </div>
    <div class="fr">
      <div class="form-group"><label>Fecha *</label><input type="date" id="nr-fecha"></div>
      <div class="form-group"><label>Hora *</label><input type="time" id="nr-hora"></div>
    </div>
    <div class="form-group"><label>Servicio</label><select id="nr-servicio"><option value="">Seleccionar...</option></select></div>
    <div class="form-group"><label>Notas</label><textarea id="nr-notas" rows="2"></textarea></div>
    <button class="btn btn-primary" id="btn-guardar-nr" onclick="guardarNuevaReserva()">Guardar reserva</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<script>
// Las credenciales las define supabase-config.js, cargado en el <head>. Si no
// llegó, este bloque moriría en la línea de abajo y la página quedaría viva
// pero inservible: entera en pantalla, con los botones fallando sin decir
// nada. Se corta acá y se avisa.
if (typeof SUPABASE_URL === 'undefined') {
  console.error('supabase-config.js no cargó: SUPABASE_URL y SUPABASE_KEY no están definidas. Revisa que el archivo se esté sirviendo (200) junto a esta página.');
  document.body.innerHTML = '<div style="font-family:system-ui,-apple-system,sans-serif;color:#e8e6e0;background:#08090d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;line-height:1.6">No pudimos cargar la página. Intenta de nuevo en unos minutos.</div>';
  throw new Error('supabase-config.js no cargó');
}

// El enlace de correo (recuperar contraseña, magic link, invitación) llega con
// los tokens en el HASH: #access_token=...&type=recovery. El cliente corre en
// flowType 'implicit' con detectSessionInUrl activado —los valores por defecto,
// verificados, no supuestos—, así que apenas se crea empieza a consumir ese
// hash, arma una sesión válida y BORRA el hash de la URL.
//
// Por eso esto va ANTES de createClient() y es síncrono: después ya no hay hash
// que leer. Si se mueve debajo, la pantalla de contraseña deja de aparecer y no
// falla de forma ruidosa — el profesional simplemente entra a la agenda sin
// haber elegido contraseña, que es exactamente el problema que esto viene a
// resolver.
const HASH_ENLACE = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
const TIPO_ENLACE = HASH_ENLACE.get('type');
// Los tres significan lo mismo para nosotros: llegaste por correo y todavía no
// tienes contraseña propia. Hoy el dueño invita creando la cuenta con una
// contraseña que viaja por WhatsApp (ver app.html), así que 'invite' no se usa;
// se contempla igual para que un cambio allá no deje esta pantalla muerta.
const ES_ENLACE_CORREO = TIPO_ENLACE === 'recovery' || TIPO_ENLACE === 'magiclink' || TIPO_ENLACE === 'invite';
// Supabase devuelve el enlace vencido o ya usado por el mismo hash, no por HTTP.
const ERROR_ENLACE = HASH_ENLACE.get('error_description') || HASH_ENLACE.get('error');

// Para pasar datos por onclick='...' (atributo delimitado por comillas
// simples): JSON.stringify no escapa comillas simples, así que un nombre
// o nota con apóstrofe (ej. "D'Elia") rompería el atributo a mitad de
// camino. &#39; se decodifica de vuelta a ' antes de que el JS se ejecute.
function jsonAttr(obj){ return JSON.stringify(obj).replace(/'/g,'&#39;'); }

// Escapa lo que se pinta con innerHTML.
//
// ⚠ ESTA PÁGINA RECIBE TEXTO DE DESCONOCIDOS. El formulario público de
// reservas tiene un campo de notas abierto —su placeholder dice "Ej: corte
// específico, alergias..."— y el nombre del cliente también lo escribe quien
// reserva. Los dos llegan acá y se pintaban crudos: cualquiera que reservara
// por el link público podía escribir `<img src=x onerror="...">` y ese código
// se ejecutaba en la sesión del profesional, que puede cobrar, cancelar citas
// y ver datos de clientes.
//
// La regla para este archivo: TODO lo que venga de la base y se interpole en
// innerHTML pasa por acá. No alcanza con escapar lo que hoy parece peligroso —
// un campo que hoy escribe el dueño mañana lo puede escribir el cliente.
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function fmt(n){ return '$'+Math.round(n||0).toLocaleString('es-CL'); }
function fmtHora(h){ return h?h.slice(0,5):''; }
function abrirWA(wsp,msg){ const n=(wsp||'').replace(/\D/g,''); window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg||''),'_blank'); }
function hoyStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// Dispara el correo con el enlace para elegir contraseña. Reemplaza al parche
// de entrar al dashboard de Supabase a generar un magic link a mano.
async function pedirRecuperacion(){
  const email=document.getElementById('li-email').value.trim();
  if(!email){ mostrarLoginError('Escribe tu correo arriba y vuelve a apretar acá.'); return; }
  const btn=document.getElementById('btn-olvide');
  btn.disabled=true; btn.textContent='Enviando...';
  // redirectTo tiene que estar en Authentication → URL Configuration → Redirect
  // URLs del proyecto. Si no está, el correo igual llega pero el enlace apunta a
  // la Site URL, que es donde venía el localhost:3000 del default.
  //
  // ⚠ EL HOST TIENE QUE COINCIDIR EXACTO, Y www CUENTA COMO OTRO HOST.
  // Ya pasó: con la lista blanca en 'https://mireservia.cl/**' y el profesional
  // entrando por 'https://www.mireservia.cl', origin quedó con www, Supabase
  // rechazó el redirectTo sin avisar y el enlace del correo cayó a la Site URL
  // —la raíz del sitio— en vez de a esta página. La lista tiene que incluir
  // AMBOS hosts. Se deja window.location.origin y no un dominio fijo para que
  // el enlace devuelva al profesional al mismo host desde el que pidió el
  // correo, y para no romper las pruebas fuera de producción.
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/mi-agenda.html'});
  btn.disabled=false; btn.textContent='¿Olvidaste tu contraseña?';
  if(error){ mostrarLoginError('No se pudo enviar el correo: '+error.message); return; }
  // La respuesta es la misma exista o no la cuenta. Decir "ese correo no está
  // registrado" le confirmaría a cualquiera qué correos tienen cuenta acá.
  const ok=document.getElementById('li-ok');
  ok.textContent='Si ese correo tiene una cuenta, le acaba de llegar un enlace para elegir una contraseña nueva. Revisa también el correo no deseado.';
  ok.style.display='';
  document.getElementById('li-alert').style.display='none';
}

async function guardarPassword(){
  const p1=document.getElementById('rc-pass').value;
  const p2=document.getElementById('rc-pass2').value;
  const al=document.getElementById('rc-alert');
  al.style.display='none';
  // El mínimo de 6 lo impone Supabase; acá se pide 8 y se avisa antes de ir al
  // servidor, para no gastar el enlace en un error evitable.
  if(p1.length<8){ al.textContent='La contraseña necesita al menos 8 caracteres.'; al.style.display=''; return; }
  if(p1!==p2){ al.textContent='Las dos contraseñas no coinciden.'; al.style.display=''; return; }
  const btn=document.getElementById('btn-guardar-pass');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Guardando...';
  const {error}=await sb.auth.updateUser({password:p1});
  if(error){
    al.textContent='No se pudo guardar la contraseña: '+error.message;
    al.style.display='';
    btn.disabled=false; btn.textContent='Guardar y entrar';
    return;
  }
  // El enlace ya dejó la sesión abierta, así que no hace falta pedir el correo
  // otra vez. Se vuelve a mostrar el login por debajo porque afterLogin() es
  // quien decide: si la cuenta no es de un profesional o fue desactivada, hace
  // signOut y escribe el motivo ahí.
  document.getElementById('recuperar-view').style.display='none';
  document.getElementById('login-view').style.display='';
  await afterLogin();
  btn.disabled=false; btn.textContent='Guardar y entrar';
}

async function login(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  if(!email||!pass){ mostrarLoginError('Ingresá correo y contraseña.'); return; }
  const btn=document.getElementById('btn-login');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Entrando...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ mostrarLoginError('Correo o contraseña incorrectos.'); btn.disabled=false; btn.textContent='Entrar'; return; }
  await afterLogin();
  btn.disabled=false; btn.textContent='Entrar';
}

async function logout(){
  await sb.auth.signOut();
  window.location.reload();
}

async function afterLogin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ return; }

  const {data:perfil,error:eP}=await sb.from('perfiles').select('*').eq('id',session.user.id).single();
  if(eP||!perfil||perfil.rol!=='profesional'){
    mostrarLoginError('Esta cuenta no es de un profesional. Si sos el dueño del negocio, usá ingresar.html.');
    await sb.auth.signOut();
    return;
  }
  PERFIL=perfil;

  // barberos_select_public es pública (using(true)) — no hace falta RPC para
  // este lookup, solo filtrar por el auth_user_id de la sesión.
  const {data:barbero,error:eB}=await sb.from('barberos').select('*').eq('auth_user_id',session.user.id).eq('activo',true).maybeSingle();
  if(eB||!barbero){
    mostrarLoginError('Tu cuenta fue desactivada o ya no está vinculada a ningún profesional. Consultá con el dueño del negocio.');
    await sb.auth.signOut();
    return;
  }
  BARBERO=barbero;

  // Orden manual del dueño (Config → Servicios). Precio de desempate y nulls
  // al final: gemela de la de reservar.html y club.html.
  const {data:sv}=await sb.from('servicios').select('*').eq('barberia_id',perfil.barberia_id).eq('activo',true).order('orden',{nullsFirst:false}).order('precio');
  SERVICIOS=sv||[];

  // barberias_select_public es pública (using(true)) — mismo patrón que
  // reservar.html usa para leer B.barberia. Nombre y dirección, una vez
  // al loguear (no en cada mensaje de WhatsApp) — dirección hace falta
  // para {direccion} si la plantilla "Confirmación reserva" la usa.
  const {data:negocio}=await sb.from('barberias').select('nombre,direccion,color_marca,color_fondo_logo,modo_tema').eq('id',perfil.barberia_id).single();
  aplicarTemaAgenda(negocio);
  NEGOCIO_NOMBRE=negocio?.nombre||'';
  NEGOCIO_DIRECCION=negocio?.direccion||'';
  NEGOCIO_ID=perfil.barberia_id;

  document.getElementById('h-nombre').textContent='Mi Agenda — '+barbero.nombre;
  document.title='Mi Agenda — '+barbero.nombre;
  document.getElementById('login-view').style.display='none';
  document.getElementById('app-view').style.display='';
  document.getElementById('ag-fecha').value=hoyStr();
  setVistaAgenda(leerVistaAgenda(),true);
  cargarContextoAgenda();
  cargarAgenda();
}

// Tema del negocio (color de marca + modo claro/oscuro); ver club.html.
function aplicarTemaAgenda(barb){
  // Guardas typeof: si tema.js no cargó, estos nombres no existen y
  // referenciarlos lanzaría ReferenceError. Con typeof no lanza.
  if(typeof hexValido!=='function' || typeof derivarSuperficies!=='function'){
    console.warn('tema.js no está disponible; la página queda con su aspecto por defecto');
    return false;
  }
  if(!barb) return false;
  // El modo lo elige el dueño en el panel. Solo «claro» cambia la página: 'auto'
  // y 'oscuro' son la página oscura de siempre (12 de los 13 negocios están en
  // 'auto'; si 'auto' también cambiara, casi todas las páginas se moverían).
  const modo = barb.modo_tema === 'claro' ? 'claro' : 'oscuro';
  // La aritmética vive en tema.js (derivarSuperficies, función pura). Devuelve
  // null cuando no hay nada que escribir —oscuro sin color de marca—: ni una
  // variable se toca y la página es la de antes, píxel por píxel.
  const vars = derivarSuperficies({ modo, colorMarca: barb.color_marca, colorFondoLogo: barb.color_fondo_logo });
  if(!vars) return false;
  // Se usa setProperty y nunca se arma texto CSS ni se inyecta <style>: un
  // valor que no pase hexValido no debe poder convertirse en una regla. Con
  // setProperty el peor caso es una variable ignorada.
  const raiz = document.documentElement;
  Object.keys(vars).forEach(k => raiz.style.setProperty(k, vars[k]));
  return true;
}

// Mismo criterio de reemplazo de {clave} que buildMsg() en app.html —
// duplicado acá porque este archivo no comparte JS con app.html (ver
// nota de arquitectura: cada HTML es standalone).
function fillTemplate(str,vars){
  let m=str;
  Object.entries(vars).forEach(([k,v])=>{ m=m.replace(new RegExp('{'+k+'}','g'),v||''); });
  return m;
}

// Plantillas "Confirmación reserva" / "Cita cancelada" via RPC (mismo
// evento negocio→cliente que ya usa app.html para la primera), con
// fallback al texto de siempre si la plantilla no existe o falla la RPC
// — nunca se deja al profesional sin mensaje para mandar.
async function mensajeWhatsAppCita(c){
  const negocio=NEGOCIO_NOMBRE||'';
  const nombre=c.nombre_cliente||'';
  const fecha=c.fecha||'';
  const hora=fmtHora(c.hora);
  const servicio=c.servicio||'tu servicio';
  const cancelada=c.estado==='Cancelada';
  const evento=cancelada?'Cita cancelada':'Confirmación reserva';
  const fallback=cancelada
    ? `Hola ${nombre}, te escribo por tu cita en ${negocio} del ${fecha} a las ${hora} hrs (${servicio}), que quedó cancelada. ¡Cualquier cosa, contáctanos!`
    : `¡Hola ${nombre}! Tu cita en ${negocio} quedó confirmada para el ${fecha} a las ${hora} hrs, servicio: ${servicio}. ¡Te esperamos!`;
  try{
    const {data:plantilla}=await sb.rpc('obtener_plantilla_publica',{p_barberia_id:PERFIL.barberia_id,p_evento:evento});
    if(plantilla) return fillTemplate(plantilla,{nombre,fecha,hora,servicio,profesional:BARBERO?.nombre||'',barberia:negocio,direccion:NEGOCIO_DIRECCION||''});
  }catch(e){
    console.log('No se pudo cargar la plantilla, usando mensaje por defecto:',e.message);
  }
  return fallback;
}


// ─── Vista de la agenda: Lista o Calendario por horas ─────────────────────
// Cada profesional elige la suya; queda guardada en este dispositivo.
let VISTA_AGENDA='lista';
let HORARIO_NEGOCIO=[];
let BLOQUEOS=[];
let CITA_SEL=null;
const CAL_PX_MIN=1.5, CAL_INI_H=8, CAL_FIN_H=20;
function leerVistaAgenda(){ try{ return localStorage.getItem('miagenda_vista')==='calendario'?'calendario':'lista'; }catch(e){ return 'lista'; } }
function setVistaAgenda(v,sinRender){
  VISTA_AGENDA=v==='calendario'?'calendario':'lista';
  try{ localStorage.setItem('miagenda_vista',VISTA_AGENDA); }catch(e){}
  document.getElementById('vista-lista').classList.toggle('active',VISTA_AGENDA==='lista');
  document.getElementById('vista-cal').classList.toggle('active',VISTA_AGENDA==='calendario');
  document.getElementById('citas-lista').style.display=VISTA_AGENDA==='lista'?'':'none';
  document.getElementById('citas-cal').style.display=VISTA_AGENDA==='calendario'?'':'none';
  if(!sinRender) renderAgendaActual(CITAS_ACTUALES);
}
// Horario del negocio y bloqueos: si no se pueden leer, el calendario se ve
// igual, solo sin franjas bloqueadas.
async function cargarContextoAgenda(){
  try{
    const [h,b]=await Promise.all([
      sb.from('horario_negocio').select('*').eq('barberia_id',NEGOCIO_ID),
      sb.from('bloqueos_profesional').select('*').eq('barberia_id',NEGOCIO_ID).eq('profesional_id',BARBERO.id)
    ]);
    // Cada sucursal tiene su horario: el profesional ve el de la suya.
    HORARIO_NEGOCIO=(h.data||[]).filter(r=>!BARBERO.sucursal_id||r.sucursal_id===BARBERO.sucursal_id); BLOQUEOS=(b.data||[]);
  }catch(e){ HORARIO_NEGOCIO=[]; BLOQUEOS=[]; }
  if(VISTA_AGENDA==='calendario') renderAgendaActual(CITAS_ACTUALES);
}
function hmAMin(h){ if(!h)return null; const [a,b]=String(h).split(':').map(Number); return a*60+(b||0); }
function agendaBandas(fecha,horario,bloqueos,profId,iniMin,finMin){
  const out=[];
  const add=(ini,fin,tipo,texto)=>{ ini=Math.max(ini,iniMin); fin=Math.min(fin,finMin); if(fin>ini)out.push({ini,fin,tipo,texto}); };
  const dow=new Date(fecha+'T12:00:00').getDay();
  const h=(horario||[]).find(x=>x.dia_semana===dow);
  if(h){
    if(h.cerrado) add(iniMin,finMin,'cerrado','Cerrado');
    else{
      const ap=hmAMin(h.hora_apertura), ci=hmAMin(h.hora_cierre);
      if(ap!==null) add(iniMin,ap,'cerrado','Fuera de horario');
      if(ci!==null) add(ci,finMin,'cerrado','Fuera de horario');
      const c1=hmAMin(h.hora_colacion_inicio), c2=hmAMin(h.hora_colacion_fin);
      if(c1!==null&&c2!==null) add(c1,c2,'colacion','Colación');
    }
  }
  (bloqueos||[]).forEach(b=>{
    if(!b.activo||b.profesional_id!==profId)return;
    const motivo=b.motivo||'Bloqueo';
    if(b.tipo==='dia_completo'&&b.fecha===fecha) add(iniMin,finMin,'bloqueo',motivo);
    else if(b.tipo==='puntual'&&b.fecha===fecha) add(hmAMin(b.hora_inicio),hmAMin(b.hora_fin),'bloqueo',motivo);
    else if(b.tipo==='recurrente'&&b.dia_semana===dow) add(hmAMin(b.hora_inicio),hmAMin(b.hora_fin),'bloqueo',motivo);
  });
  return out;
}

function claseEstadoCal(e){ return {'Pendiente':'e-pendiente','Confirmada':'e-confirmada','En curso':'e-curso','Atendida':'e-atendida','Cancelada':'e-cancelada','No asistió':'e-noasistio'}[e]||'e-pendiente'; }
function duracionCita(c){ const s=SERVICIOS.find(x=>x.id===c.servicio||x.nombre===c.servicio); return (s&&s.duracion_min)||30; }
// Origen de la reserva (reservas.fuente). Mismo criterio que el panel.
const ORIGEN_SVG={
  web:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>',
  app:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>',
  profesional:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.2 8l11.3 9.5M8.2 16L19.5 6.5"/></svg>',
  panel:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.8"/><path d="M8 20h8M12 16v4"/></svg>'
};
const ORIGENES={
  'Web propia':{k:'web',t:'Reservó por la web'},
  'Club VIP':{k:'app',t:'Reservó desde la app del Club'},
  'Mi Agenda':{k:'profesional',t:'Lo agendó el profesional en su agenda'},
  'Manual':{k:'panel',t:'Se agendó desde el panel (dueño o recepción)'}
};
function iconoOrigenHtml(c){
  const o=c&&c.tipo==='reserva'?ORIGENES[c.fuente]:null; if(!o)return '';
  return `<span class="ag-origen" title="${o.t}" aria-label="${o.t}">${ORIGEN_SVG[o.k]}</span>`;
}
function renderCalendario(lista){
  const cont=document.getElementById('citas-cal');
  const fecha=document.getElementById('ag-fecha').value||hoyStr();
  const conHora=lista.filter(c=>c.hora);
  const sinHora=lista.filter(c=>!c.hora);
  // La grilla cubre 8–20 h y se amplía si hay citas fuera de ese rango.
  let ini=CAL_INI_H*60, fin=CAL_FIN_H*60;
  conHora.forEach(c=>{ const m=hmAMin(c.hora); ini=Math.min(ini,Math.floor(m/60)*60); fin=Math.max(fin,Math.ceil((m+duracionCita(c))/60)*60); });
  const alto=(fin-ini)*CAL_PX_MIN;
  const horas=[]; for(let m=ini;m<=fin;m+=60) horas.push(m);
  const gutter=horas.map((m,i)=>`<div class="cal-hora${i===0?' primera':''}${i===horas.length-1?' ultima':''}" style="top:${(m-ini)*CAL_PX_MIN}px">${String(m/60).padStart(2,'0')}:00</div>`).join('');
  const lineas=[]; for(let m=ini;m<=fin;m+=30) lineas.push(`<div class="cal-linea${m%60===0?' hora':''}" style="top:${(m-ini)*CAL_PX_MIN}px"></div>`);
  const bandas=agendaBandas(fecha,HORARIO_NEGOCIO,BLOQUEOS,BARBERO.id,ini,fin).map(b=>`<div class="cal-banda ${b.tipo}" style="top:${(b.ini-ini)*CAL_PX_MIN}px;height:${(b.fin-b.ini)*CAL_PX_MIN}px"><span>${escapeHtml(b.texto)}</span></div>`).join('');
  const bloques=conHora.map(c=>{
    const top=(hmAMin(c.hora)-ini)*CAL_PX_MIN, h=Math.max(duracionCita(c)*CAL_PX_MIN,26);
    return `<button type="button" class="cal-cita ${claseEstadoCal(c.estado)}${CITA_SEL===c.id?' sel':''}" style="top:${top}px;height:${h}px" onclick="selCitaCal('${c.id}')"><b>${iconoOrigenHtml(c)}${fmtHora(c.hora)} · ${escapeHtml(c.nombre_cliente)||'Cliente'}</b><span>${escapeHtml(c.servicio)||'—'} · ${escapeHtml(c.estado)}</span></button>`;
  }).join('');
  let ahora='';
  if(fecha===hoyStr()){ const d=new Date(), m=d.getHours()*60+d.getMinutes(); if(m>=ini&&m<=fin) ahora=`<div class="cal-ahora" style="top:${(m-ini)*CAL_PX_MIN}px"></div>`; }
  let html=`<div class="cal-wrap"><div class="cal-gutter" style="height:${alto}px">${gutter}</div><div class="cal-col" style="height:${alto}px">${lineas.join('')}${bandas}${bloques}${ahora}</div></div>`;
  if(!lista.length) html+='<div class="card"><div class="empty">Sin citas para este día.</div></div>';
  else html+='<div class="cal-ayuda">Toca una cita para ver sus acciones.</div>';
  if(sinHora.length) html+='<div class="card-title" style="margin:6px 0 10px">Sin hora</div>'+sinHora.map(citaCardHtml).join('');
  const sel=lista.find(c=>c.id===CITA_SEL);
  if(sel) html+='<div id="cal-detalle">'+citaCardHtml(sel)+'</div>';
  cont.innerHTML=html;
}
function selCitaCal(id){ CITA_SEL=CITA_SEL===id?null:id; renderCalendario(CITAS_ACTUALES); if(CITA_SEL){ const d=document.getElementById('cal-detalle'); if(d&&d.scrollIntoView) d.scrollIntoView({block:'nearest',behavior:'smooth'}); } }

function renderAgendaActual(lista){
  if(VISTA_AGENDA==='calendario'){ renderCalendario(lista); return; }
  renderCitas(lista);
}
// Vista Lista (la de siempre).
function renderCitas(lista){
  const cont=document.getElementById('citas-lista');
  if(!lista.length){ cont.innerHTML='<div class="card"><div class="empty">Sin citas para este día.</div></div>'; return; }
  cont.innerHTML=lista.map(citaCardHtml).join('');
}
// Tarjeta de una cita (con todas sus acciones). La usan la vista Lista y el
// detalle de la vista Calendario, así no hay dos formas de cobrar o cancelar.
function citaCardHtml(c){
  {
    const cancelable=c.estado!=='Cancelada';
    const puedePagar=BARBERO?.puede_procesar_pagos&&c.tipo==='reserva'&&c.estado!=='Cancelada';
    const pagoAbierto=PAGO_ABIERTO_MIAGENDA===c.id;
    return `<div class="cita-item">
      <div class="cita-hora">${iconoOrigenHtml(c)}${fmtHora(c.hora)}</div>
      <div class="cita-cliente">${escapeHtml(c.nombre_cliente)||'Cliente'}</div>
      ${c.cliente_notas?`<div class="cita-nota-cliente"><b>Del cliente:</b> ${escapeHtml(c.cliente_notas)}</div>`:''}
      <div class="cita-detalle">${escapeHtml(c.servicio)||'—'} · <span class="badge ${estadoBadge(c.estado)}">${escapeHtml(c.estado)}</span>${c.valor?' · '+fmt(c.valor):''}</div>
      ${c.notas?`<div class="cita-detalle">📝 ${escapeHtml(c.notas)}</div>`:''}
      <div class="cita-acciones">
        ${c.whatsapp_cliente?`<a class="btn-wa" onclick='enviarWhatsAppCita(${jsonAttr(c)})'>📱 ${c.tipo==='reserva'&&c.estado!=='Cancelada'?'Enviar confirmación':'WhatsApp'}</a>`:''}
        ${puedePagar&&pagoAbierto?METODOS_PAGO_MIAGENDA.map(m=>`<button class="btn btn-primary btn-sm" onclick="pagarCitaMiAgenda('${c.id}','${m}')">${m}</button>`).join('')+`<button class="btn btn-ghost btn-sm" onclick="togglePagoMiAgenda('${c.id}')">Cancelar</button>`+`<div class="gift-fila"><input id="gift-${c.id}" type="text" placeholder="Código gift card" autocomplete="off"><button class="btn btn-primary btn-sm" onclick="pagarGiftMiAgenda('${c.id}')">Canjear gift card</button></div>`:''}
        ${puedePagar&&!pagoAbierto?`<button class="btn btn-primary btn-sm" onclick="togglePagoMiAgenda('${c.id}')">Pagar</button>`:''}
        ${!pagoAbierto&&cancelable?`<button class="btn btn-ghost btn-sm" onclick="cancelarCita('${c.id}','${c.tipo}')">Cancelar</button>`:''}
        ${!pagoAbierto&&c.tipo==='reserva'?`<button class="btn btn-danger btn-sm" onclick="borrarCita('${c.id}')">Eliminar</button>`:''}
        ${!pagoAbierto&&c.tipo!=='reserva'?`<button class="btn btn-ghost btn-sm" onclick="eliminarCita('${c.id}','${c.tipo}')">Quitar de mi agenda</button>`:''}
      </div>
    </div>`;
  }
}

function togglePagoMiAgenda(id){
  PAGO_ABIERTO_MIAGENDA=PAGO_ABIERTO_MIAGENDA===id?null:id;
  renderAgendaActual(CITAS_ACTUALES);
}

// Canje de gift card: el código lo valida y lo marca la base de datos en la
// misma operación que registra el pago.
function pagarGiftMiAgenda(id){
  const el=document.getElementById('gift-'+id);
  const codigo=(el&&el.value||'').trim().toUpperCase();
  if(!codigo){ alert('Escribe el código de la gift card.'); return; }
  return pagarCitaMiAgenda(id,'Gift card',codigo);
}

async function pagarCitaMiAgenda(id,metodo,giftCodigo){
  // `data` es el visita_id que devuelve la RPC. Antes se descartaba; ahora
  // dispara la encuesta de satisfacción de esa visita.
  const {data:visitaId,error}=await sb.rpc('mi_agenda_procesar_pago',Object.assign({p_reserva_id:id,p_metodo_pago:metodo},giftCodigo?{p_gift_codigo:giftCodigo}:{}));
  if(error){ alert('Error: '+error.message); return; }

  // Sin await y con catch vacío, igual que el correo de confirmación: el pago
  // ya está registrado. Si el correo falla, la encuesta queda pendiente y el
  // dueño la ve en la lista de WhatsApp de Mensajes.
  if(visitaId){
    fetch('/api/enviar-encuesta',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({visitaId})}).catch(()=>{});
  }
  PAGO_ABIERTO_MIAGENDA=null;
  cargarAgenda();
}

async function cancelarCita(id,tipo){
  if(!confirm('¿Cancelar esta cita? El negocio la va a ver como Cancelada.'))return;
  const {error}=await sb.rpc('mi_agenda_cancelar_cita',{p_id:id,p_tipo:tipo});
  if(error){ alert('Error: '+error.message); return; }
  cargarAgenda();
}

// OCULTAR — para las visitas, o sea lo ya cobrado. El dato queda y el dueño
// lo sigue viendo. El texto dice exactamente eso: prometer un borrado que no
// ocurre haría que alguien creyera que quitó una cita del sistema.
async function eliminarCita(id,tipo){
  if(!confirm('¿Quitar esta cita de tu agenda? No se borra del sistema, solo deja de aparecer en tu vista.'))return;
  const {error}=await sb.rpc('mi_agenda_eliminar_cita',{p_id:id,p_tipo:tipo});
  if(error){ alert('Error: '+error.message); return; }
  cargarAgenda();
}

// BORRAR DE VERDAD — solo reservas sin cobrar. Es irreversible y no deja
// rastro: no hay auditoría, así que el dueño tampoco puede ver después que
// esta cita existió. El confirm lo dice con esas palabras porque es la única
// oportunidad de entenderlo antes de que pase.
//
// No se le pasa el tipo: mi_agenda_borrar_cita ni siquiera acepta ese
// parámetro, justamente para que no exista forma de pedirle que borre una
// visita — ahí vive la plata cobrada y su comisión.
async function borrarCita(id){
  if(!confirm('¿Eliminar esta reserva?\n\nSe borra del sistema y no se puede deshacer. El dueño tampoco va a poder verla después.'))return;
  const {data,error}=await sb.rpc('mi_agenda_borrar_cita',{p_id:id});
  if(error){ alert('Error: '+error.message); return; }
  // La RPC devuelve false sin distinguir el motivo (no existe, es de otro, o
  // ya está cobrada) para no filtrar por qué falló. Acá se traduce a un aviso
  // genérico en vez de dejar creer que se borró.
  if(data===false){ alert('No se pudo eliminar. Si ya la cobraste, no se puede borrar: quítala de tu agenda.'); }
  cargarAgenda();
}

// ─── Nueva reserva ───

function abrirNuevaReserva(){
  document.getElementById('nr-alert').style.display='none';
  document.getElementById('nr-buscar').value='';
  document.getElementById('nr-nombre').value='';
  document.getElementById('nr-wsp').value='';
  document.getElementById('nr-email').value='';
  document.getElementById('nr-cumple').value='';
  document.getElementById('nr-notas').value='';
  document.getElementById('nr-fecha').value=document.getElementById('ag-fecha').value||hoyStr();
  document.getElementById('nr-hora').value='';
  document.getElementById('nr-sugerencias').classList.remove('open');
  CLIENTE_SEL=null;
  const sel=document.getElementById('nr-servicio');
  sel.innerHTML='<option value="">Seleccionar...</option>'+SERVICIOS.map(s=>`<option value="${escapeHtml(s.nombre)}">${escapeHtml(s.nombre)} (${fmt(s.precio)})</option>`).join('');
  document.getElementById('m-reserva').classList.add('open');
}

function cerrarModal(){
  document.getElementById('m-reserva').classList.remove('open');
}

let buscarTimeout=null;
function buscarClienteAgenda(q){
  CLIENTE_SEL=null;
  clearTimeout(buscarTimeout);
  if(!q || q.trim().length<2){ document.getElementById('nr-sugerencias').classList.remove('open'); return; }
  buscarTimeout=setTimeout(async ()=>{
    const {data}=await sb.rpc('mi_agenda_buscar_cliente',{p_query:q.trim()});
    const box=document.getElementById('nr-sugerencias');
    if(!data || !data.length){ box.classList.remove('open'); return; }
    // Dos escapes distintos porque son dos contextos distintos: jsonAttr para
    // lo que va DENTRO del atributo onclick='...' (JSON.stringify no escapa la
    // comilla simple, así que un "D'Elia" rompía el atributo a mitad de camino),
    // y escapeHtml para el texto visible.
    box.innerHTML=data.map(c=>`<div class="suggest-item" onclick='seleccionarClienteAgenda(${jsonAttr(c.id)},${jsonAttr(c.nombre)},${jsonAttr(c.whatsapp)})'>${escapeHtml(c.nombre)} · ${escapeHtml(c.whatsapp)||'—'}</div>`).join('');
    box.classList.add('open');
  },300);
}

function seleccionarClienteAgenda(id,nombre,whatsapp){
  CLIENTE_SEL={id,nombre,whatsapp};
  document.getElementById('nr-nombre').value=nombre;
  document.getElementById('nr-wsp').value=whatsapp||'';
  document.getElementById('nr-buscar').value=nombre;
  document.getElementById('nr-sugerencias').classList.remove('open');
}

async function guardarNuevaReserva(){
  const nombre=document.getElementById('nr-nombre').value.trim();
  const wsp=document.getElementById('nr-wsp').value.trim();
  const email=document.getElementById('nr-email').value.trim();
  const cumple=document.getElementById('nr-cumple').value||null;
  const fecha=document.getElementById('nr-fecha').value;
  const hora=document.getElementById('nr-hora').value;
  const servicio=document.getElementById('nr-servicio').value;
  const notas=document.getElementById('nr-notas').value.trim();
  if(!nombre||!wsp||!fecha||!hora){
    const al=document.getElementById('nr-alert');
    al.textContent='Nombre, WhatsApp, fecha y hora son obligatorios.'; al.style.display='';
    return;
  }
  // El correo es opcional, pero si se escribe algo tiene que parecer un
  // correo. Sin esta validación el dato se pierde SIN AVISO: del lado del
  // servidor email_para_ficha() descarta todo lo que no tenga arroba, así que
  // un "no tiene" tipeado acá se guardaría como reserva y nunca llegaría a la
  // ficha, y nadie se enteraría. Mismo criterio que el formulario público.
  if(email&&!email.includes('@')){
    const al=document.getElementById('nr-alert');
    al.textContent='El correo no parece válido. Revísalo o déjalo vacío.'; al.style.display='';
    return;
  }
  const btn=document.getElementById('btn-guardar-nr');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Guardando...';
  const {data:reservaId,error}=await sb.rpc('mi_agenda_crear_reserva',{
    p_nombre_cliente:nombre, p_whatsapp_cliente:wsp, p_fecha:fecha, p_hora:hora,
    p_servicio:servicio||null, p_notas:notas||null,
    p_email_cliente:email||null, p_cumpleanos_cliente:cumple
  });
  btn.disabled=false; btn.textContent='Guardar reserva';
  if(error){
    const al=document.getElementById('nr-alert');
    al.textContent='Error: '+error.message; al.style.display='';
    return;
  }
  // Correo de registro de la cita. Acá el profesional agenda para sí mismo
  // (mi_agenda_crear_reserva resuelve barbero_nombre server-side y no permite
  // agendar a nombre de otro), así que este correo no le avisa nada nuevo: le
  // deja comprobante de la cita por fuera del panel. El servidor lo detecta
  // leyendo reservas.fuente='Mi Agenda' y le pone un asunto distinto para que
  // se pueda filtrar aparte del aviso que sí es novedad.
  fetch('/api/enviar-confirmacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reservaId})}).catch(()=>{});
  // Resuelve (busca o crea) la ficha de cliente al instante, mismo patrón
  // no bloqueante que reservar.html — si falla, la reserva ya se creó
  // igual, solo no queda la ficha lista hasta que se procese/pague.
  //
  // ⚠ ES mi_agenda_resolver_cliente Y NO buscar_o_crear_cliente_club.
  // Las dos hacen lo mismo, pero reconocen fichas con criterios distintos:
  // esta compara el WhatsApp normalizado (los últimos 9 dígitos), así que el
  // mismo número tipeado '+56 9 8754 2136' o '987542136' cae en la misma
  // ficha en vez de abrir una nueva. La otra sigue con match exacto y se usa
  // en el link público y en el Club VIP, que no se tocaron a propósito:
  // cambiarles el criterio mueve a qué ficha se le suman las visitas y corre
  // reportes históricos. Está explicado en migration_cliente_miagenda.sql.
  //
  // Si se cambia esta llamada de vuelta a la otra, vuelven los duplicados.
  let avisoFicha='';
  try{
    const {data:ficha}=await sb.rpc('mi_agenda_resolver_cliente',{p_reserva_id:reservaId});
    // returns table, así que llega un array de una fila.
    const f=Array.isArray(ficha)?ficha[0]:ficha;
    if(f) avisoFicha=f.creado?' · ficha de cliente creada':' · se usó la ficha que ya existía';
  }catch(e){
    console.log('No se pudo resolver el cliente al instante:',e.message);
  }
  // Se avisa cuál de las dos cosas pasó porque son distintas para quien
  // atiende: "creada" significa cliente nuevo, "ya existía" significa que las
  // visitas se le van a sumar a su historial. Antes esto no se decía en
  // ningún lado y la única forma de saberlo era ir a mirar el panel.
  alert('Reserva guardada'+avisoFicha);
  cerrarModal();
  document.getElementById('ag-fecha').value=fecha;
  cargarAgenda();
}

// ─── Mis ventas y comisiones ───

let COM_RANGO='mes'; // 'hoy' | 'semana' | 'mes' | 'personalizado'

// Mismo criterio de rangos que ya usa app.html en Reportes → Por
// profesional (repProfRango): "semana" es una ventana móvil de 7 días
// terminando hoy, no la semana calendario — consistente en todo el
// producto.
function comRangoFechas(tipo){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(tipo==='hoy') return {desde:f(hoy),hasta:f(hoy)};
  if(tipo==='semana'){ const d=new Date(hoy); d.setDate(d.getDate()-6); return {desde:f(d),hasta:f(hoy)}; }
  const y=hoy.getFullYear(), m=hoy.getMonth();
  return {desde:f(new Date(y,m,1)),hasta:f(new Date(y,m+1,0))};
}

function comSetRango(tipo){
  COM_RANGO=tipo;
  document.querySelectorAll('.com-chip').forEach(b=>b.classList.toggle('active',b.dataset.rango===tipo));
  const personalizado=document.getElementById('com-personalizado');
  if(tipo==='personalizado'){
    personalizado.style.display='';
    if(!document.getElementById('com-desde').value){
      const r=comRangoFechas('mes');
      document.getElementById('com-desde').value=r.desde;
      document.getElementById('com-hasta').value=r.hasta;
    }
  } else {
    personalizado.style.display='none';
  }
  comCargar();
}

function comEtiquetaRango(desde,hasta){
  if(COM_RANGO==='hoy')return'Hoy';
  if(COM_RANGO==='semana')return'Esta semana';
  if(COM_RANGO==='mes')return'Este mes';
  const fmtDia=d=>{ if(!d)return'—'; const [y,mm,dd]=d.split('-'); return dd+'/'+mm+'/'+y; };
  return fmtDia(desde)+' – '+fmtDia(hasta);
}

async function comCargar(){
  let desde,hasta;
  if(COM_RANGO==='personalizado'){
    desde=document.getElementById('com-desde').value||null;
    hasta=document.getElementById('com-hasta').value||null;
  } else {
    const r=comRangoFechas(COM_RANGO);
    desde=r.desde; hasta=r.hasta;
  }
  const cont=document.getElementById('com-resumen');
  cont.innerHTML='<div class="msg-full">Cargando...</div>';
  const {data,error}=await sb.rpc('mi_agenda_comisiones',{p_desde:desde,p_hasta:hasta});
  if(error){ cont.innerHTML='<div class="msg-full">Error: '+escapeHtml(error.message)+'</div>'; return; }
  renderComisionResumen(data||[],desde,hasta);
}

function renderComisionResumen(filas,desde,hasta){
  const cont=document.getElementById('com-resumen');
  const ventas=filas.reduce((s,f)=>s+(f.valor||0),0);
  const comision=filas.reduce((s,f)=>s+(f.comision_monto||0),0);
  // Agrupa por nombre DENTRO de cada tipo. La RPC manda el nombre del
  // producto en la misma columna `servicio` y los separa con `tipo`, así que
  // agrupar sin mirar el tipo mezclaría un corte y un shampoo que se llamaran
  // igual, y sumaría sus comisiones como si fueran lo mismo.
  //
  // Las filas viejas (antes de la migración) no traen `tipo`: cuentan como
  // servicio, que es lo único que había entonces.
  function agrupar(deTipo){
    const acc={};
    filas.filter(f=>(f.tipo||'servicio')===deTipo).forEach(f=>{
      const nombre=f.servicio||'—';
      if(!acc[nombre]) acc[nombre]={cant:0,ventas:0,comision:0};
      acc[nombre].cant++;
      acc[nombre].ventas+=f.valor||0;
      acc[nombre].comision+=f.comision_monto||0;
    });
    return Object.entries(acc).sort((a,b)=>b[1].ventas-a[1].ventas).map(([nombre,d])=>`
      <div class="serv-row"><span>${escapeHtml(nombre)} (${d.cant})</span><span>${fmt(d.ventas)} · <span style="color:#7c6af7">${fmt(d.comision)}</span></span></div>
    `).join('');
  }
  const serviciosHtml=agrupar('servicio')||'<div class="empty">Sin servicios en este período.</div>';
  const productosHtml=agrupar('producto');

  cont.innerHTML=`
    <div class="com-hero">
      <div class="com-hero-label">${comEtiquetaRango(desde,hasta)}</div>
      <div class="com-hero-row">
        <div class="com-hero-item"><div class="val">${fmt(ventas)}</div><div class="lbl">Ventas</div></div>
        <div class="com-hero-item"><div class="val comision">${fmt(comision)}</div><div class="lbl">Comisión</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Desglose por servicio</div>
      ${serviciosHtml}
    </div>
    ${productosHtml?`<div class="card">
      <div class="card-title">Productos vendidos</div>
      ${productosHtml}
    </div>`:''}`;
}

// ─── Init ───

async function init(){
  // Enlace vencido o ya usado: Supabase lo informa por el hash, no por HTTP.
  if(ERROR_ENLACE){
    limpiarHash();
    mostrarLoginError('Ese enlace ya no sirve ('+ERROR_ENLACE+'). Pide uno nuevo con "¿Olvidaste tu contraseña?".');
    return;
  }

  if(ES_ENLACE_CORREO){
    // Se espera a getSession() ANTES de mostrar el formulario: resuelve recién
    // cuando el SDK terminó de consumir el hash, y updateUser() necesita esa
    // sesión. Sin esta espera, un profesional rápido puede apretar "Guardar"
    // antes de que exista y comerse un error inexplicable.
    const {data:{session}}=await sb.auth.getSession();
    limpiarHash();
    if(!session){
      mostrarLoginError('Ese enlace venció o ya se usó. Pide uno nuevo con "¿Olvidaste tu contraseña?".');
      return;
    }
    document.getElementById('login-view').style.display='none';
    document.getElementById('recuperar-view').style.display='';
    return;
  }

  const {data:{session}}=await sb.auth.getSession();
  if(session) await afterLogin();
}

// Saca los tokens de la barra de direcciones una vez usados, para que no queden
// en el historial ni se filtren si el profesional comparte la URL o le sacan una
// foto a la pantalla.
function limpiarHash(){
  history.replaceState(null,'',window.location.pathname+window.location.search);
}

init();

// PWA: registra el service worker acotado a esta página exacta (scope
// "/mi-agenda.html") — nunca controla app.html/reservar.html/club.html/
// index.html/ingresar.html, que ni siquiera enlazan un manifest. El SW en sí no cachea
// nada (ver mi-agenda-sw.js), así que esto no cambia el comportamiento de
// login ni de las RPCs, solo habilita "Agregar a pantalla de inicio".
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/mi-agenda-sw.js',{scope:'/mi-agenda.html'})
    .catch(err=>console.error('No se pudo registrar el service worker de Mi Agenda:',err));
}
