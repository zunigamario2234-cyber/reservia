<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Test — reservar.html y club.html</title>

<!--
  Test de las DOS páginas públicas de reserva: reservar.html y club.html.

  POR QUÉ EXISTE
  app.html ya tenía chequeo de sintaxis versionado (dentro de
  test-comollegar.html, que compila sus <script> inline), pero estas dos no
  tenían ninguno. Son justamente donde un error rompe reservas de clientes
  reales: si un <script> inline no parsea, la página queda viva e inservible
  —el HTML se pinta entero y cada clic muere en silencio— y ningún otro test
  del repo se entera. test-supabase-config.html sí lee estos archivos, pero
  solo mira el cableado de credenciales.

  QUÉ COMPRUEBA
  Prueba los ARCHIVOS REALES: los baja con fetch y los revisa como texto, más
  new Function() para compilar sin ejecutar. No abre Supabase ni crea nada.

  Tiene que quedar en la misma carpeta que los HTML: las rutas son relativas,
  igual que en producción.

  CÓMO SE CORRE EN HEADLESS
  Ver README.md — con Chrome abierto hay una trampa que devuelve salida vacía
  y parece que pasó.
-->
<style>
body{background:#0f1018;color:#e8e6e0;font:13px/1.7 ui-monospace,Consolas,monospace;padding:24px;max-width:900px;margin:0 auto}
h1{font-size:15px;font-family:system-ui,sans-serif;color:#e8e6e0}
p{color:#888;font-family:system-ui,sans-serif;font-size:12px}
#resultado{white-space:pre-wrap;word-break:break-all}
.ok{color:#4ade80}.fail{color:#f87171}
#manual{display:none;margin:16px 0;padding:14px;border:0.5px solid #2a2a2a;border-radius:10px}
</style>

<h1>Test — reservar.html y club.html</h1>
<p>Compila los <code>&lt;script&gt;</code> inline de las dos páginas públicas de
reserva y verifica los invariantes que, si se rompen, se llevan puestas
reservas de clientes.</p>

<div id="manual">
  <p style="margin-top:0">El navegador no me deja leer los archivos por mi cuenta.
  Pásamelos todos juntos y sigo:</p>
  <input type="file" id="archivo" accept=".html" multiple>
</div>

<pre id="resultado">corriendo…</pre>

<script>
'use strict';

var ARCHIVOS = ['reservar.html','club.html'];

var lineas = [], fallos = 0, comprobaciones = 0;

function titulo(t){ lineas.push('', t, '─'.repeat(t.length)); }
function check(nombre, real, esperado){
  comprobaciones++;
  var ok = (real === esperado);
  if(!ok) fallos++;
  lineas.push((ok ? 'OK   ' : 'FALLO') + ' │ ' + nombre);
  if(!ok){
    lineas.push('      │   esperado: ' + esperado);
    lineas.push('      │   obtenido: ' + real);
  }
}

function pintar(){
  var fin = fallos === 0
    ? '\n\n>>> TODO OK — ' + comprobaciones + ' comprobaciones'
    : '\n\n>>> ' + fallos + ' FALLO(S) de ' + comprobaciones + ' comprobaciones';
  var pre = document.getElementById('resultado');
  pre.textContent = lineas.join('\n') + fin;
  pre.className = fallos === 0 ? 'ok' : 'fail';
}

// Los comentarios de estos archivos explican qué YA NO debe estar (por ejemplo
// "Cualquier profesional"), así que nombran justamente lo que se busca. Sin
// sacarlos, el check daría falso positivo contra la propia documentación. Es el
// mismo problema que ya apareció con "service_role" en test-supabase-config.js.
function sinComentarios(js){
  return js.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^[ \t]*\/\/.*$/gm, '');
}

// <script> inline, sin los que traen src.
function inlineScripts(html){
  var re = /<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)<\/script>/gi, m, out = [];
  while((m = re.exec(html)) !== null){ if(m[1].trim()) out.push(m[1]); }
  return out;
}

// Devuelve el objeto de argumentos de cada .rpc('nombre',{...}), cerrando las
// llaves de verdad en vez de cortar por una ventana fija de caracteres: los
// argumentos ocupan varias líneas y una ventana se comería la llamada
// siguiente, que también trae p_barberia_id, y taparía el fallo.
function argsDeRpc(js){
  var re = /\.rpc\('([a-z_]+)'\s*,\s*\{/g, m, out = [];
  while((m = re.exec(js)) !== null){
    var i = re.lastIndex - 1, prof = 0, fin = -1;
    for(var k = i; k < js.length; k++){
      if(js[k] === '{') prof++;
      else if(js[k] === '}'){ prof--; if(prof === 0){ fin = k; break; } }
    }
    out.push({ nombre: m[1], args: fin === -1 ? '' : js.slice(i, fin + 1) });
  }
  return out;
}

// Lecturas de tabla. sb.storage.from() no cuenta: no es una tabla.
function lecturasDeTabla(js){
  var re = /(?:^|[^.\w])(?:sb|supabase)\.from\('([a-z_]+)'\)([^\n]*)/gm, m, out = [];
  while((m = re.exec(js)) !== null){ out.push({ tabla: m[1], resto: m[2] }); }
  return out;
}

// Saca el código de una función por nombre, cerrando las llaves de verdad.
// Se usa para EJECUTAR la función real del archivo, no para mirarla como texto:
// el manejo de zona horaria es justo lo que un regex da por bueno y produccion
// desmiente.
function extraerFuncion(js, nombre){
  var i = js.indexOf('function ' + nombre + '(');
  if(i === -1) return '';
  var ini = js.indexOf('{', i), prof = 0;
  for(var k = ini; k < js.length; k++){
    if(js[k] === '{') prof++;
    else if(js[k] === '}'){ prof--; if(prof === 0) return js.slice(i, k + 1); }
  }
  return '';
}

// Corre la función de "ahora" del archivo real contra un instante fijo,
// sustituyendo el reloj. Sin esto solo se puede comprobar la hora actual, que
// es distinta en cada corrida y nunca cae en los casos que importan.
function ahoraCon(fuente, nombre, isoUtc){
  var Real = window.Date;
  var Falso = function(){ return new Real(isoUtc); };
  Falso.prototype = Real.prototype;
  var f = new Function('Date', 'fmtDateLocal', 'rFmtDateLocal',
                       fuente + '\nreturn ' + nombre + ';')
          (Falso, function(){ return 'LOCAL'; }, function(){ return 'LOCAL'; });
  return f();
}

// Config por archivo: las dos páginas son gemelas pero con nombres distintos.
var NOMBRES = {
  'reservar.html': {
    ahora:'ahoraEnChile',  anticip:'ANTICIPACION_MIN',
    estado:'B',  base:'HORARIOS_BASE',   paso:'PASO_MIN',
    fns:['timeToMin','minToTime','seSolapan','cierreDelDia','cabeEnLaJornada',
         'bloqueoChocaCon','slotsParaDia']
  },
  'club.html': {
    ahora:'rAhoraEnChile', anticip:'R_ANTICIPACION_MIN',
    estado:'RB', base:'R_HORARIOS_BASE', paso:'R_PASO_MIN',
    fns:['rTimeToMin','rMinToTime','rSeSolapan','rCierreDelDia','rCabeEnLaJornada',
         'rBloqueoChocaCon','rSlotsParaDia']
  }
};

// El HORARIOS_BASE real del archivo, no una copia: el fallback tiene un hueco
// implícito de almuerzo (12:30 → 14:00) y una copia desactualizada probaría otra
// cosa que la que corre en producción.
function horariosBase(js, nombre){
  var m = new RegExp(nombre + '\\s*=\\s*\\[([^\\]]*)\\]').exec(js);
  if(!m) return null;
  var out = [], re = /'([^']+)'/g, x;
  while((x = re.exec(m[1])) !== null) out.push(x[1]);
  return out;
}

// Reconstruye las funciones REALES del archivo en un entorno controlado, para
// poder correr el cálculo contra horarios y reservas inventados. Sin esto solo
// se puede comprobar que el código "menciona" la duración, no que la use bien —
// y esa diferencia es justamente la que dejó reservas encimadas en producción.
function armarSandbox(js, cfg, horario){
  var fuentes = [];
  for(var i = 0; i < cfg.fns.length; i++){
    var f = extraerFuncion(js, cfg.fns[i]);
    if(f === '') return null;
    fuentes.push(f);
  }
  var mPaso = new RegExp('(?:const|let|var)\\s+' + cfg.paso + '\\s*=\\s*(\\d+)').exec(js);
  if(!mPaso) return null;
  var base = horariosBase(js, cfg.base);
  if(!base) return null;
  var src = 'var ' + cfg.paso + ' = ' + mPaso[1] + ';\n' +
            fuentes.join('\n') +
            '\nreturn [' + cfg.fns.join(',') + '];';
  var api;
  try {
    api = new Function(cfg.estado, cfg.base, src)({ horario: horario }, base);
  } catch(e){ return null; }
  return {
    paso: Number(mPaso[1]),
    timeToMin: api[0], minToTime: api[1], seSolapan: api[2],
    cierreDelDia: api[3], cabeEnLaJornada: api[4],
    bloqueoChocaCon: api[5], slotsParaDia: api[6]
  };
}

// Horario de prueba. Los días existen para cubrir casos distintos, no para
// parecerse a un negocio real.
var HORARIO_PRUEBA = {
  // Martes: jornada normal con colación de 14:00 a 15:00.
  2: { hora_apertura:'09:00', hora_cierre:'19:00',
       hora_colacion_inicio:'14:00', hora_colacion_fin:'15:00', cerrado:false },
  // Miércoles: cierre NO alineado a la grilla, para el caso que el conjunto de
  // unidades no puede ver por sí solo.
  3: { hora_apertura:'09:00', hora_cierre:'19:20',
       hora_colacion_inicio:null, hora_colacion_fin:null, cerrado:false },
  // Domingo cerrado.
  0: { hora_apertura:'09:00', hora_cierre:'19:00',
       hora_colacion_inicio:null, hora_colacion_fin:null, cerrado:true }
  // El jueves (4) NO existe a propósito: es el fallback a HORARIOS_BASE.
};

function correr(src){
  ARCHIVOS.forEach(function(f){
    titulo(f);
    var html = src[f];
    var js = sinComentarios(inlineScripts(html).join('\n'));

    // 1. Que parsee. Es el hueco que este archivo vino a tapar.
    var scripts = inlineScripts(html);
    check('tiene <script> inline', scripts.length > 0, true);
    var err = '';
    scripts.forEach(function(s){
      try { new Function(s); } catch(e){ if(!err) err = e.message; }
    });
    check('los <script> inline compilan' + (err ? ' — ' + err : ''), err === '', true);

    // 2. La grilla pública no ofrece gente dada de baja (commit e191046). Una
    //    reserva con alguien inactivo no le avisa a nadie: el resolver de
    //    correos lo descarta, igual que descartaba 'Por asignar'.
    var barberos = lecturasDeTabla(js).filter(function(l){ return l.tabla === 'barberos'; });
    check('lee la tabla barberos una sola vez', barberos.length, 1);
    check('filtra los profesionales inactivos',
          barberos.length === 1 && /\.eq\('activo',\s*true\)/.test(barberos[0].resto), true);

    // 3. Aislamiento entre negocios: toda lectura va scopeada. barberias es la
    //    excepción legítima, se busca por su propio id.
    var sinScope = lecturasDeTabla(js).filter(function(l){
      return !/\.eq\('barberia_id'/.test(l.resto) && !/\.eq\('id',\s*BARBERIA_ID\)/.test(l.resto);
    }).map(function(l){ return l.tabla; });
    check('toda lectura de tabla va scopeada por negocio' +
          (sinScope.length ? ' — sueltas: ' + sinScope.join(', ') : ''), sinScope.length, 0);

    // 4. Lo mismo del lado de las RPC: son security definer y bypasean RLS, así
    //    que el scoping viaja en los argumentos o no existe.
    var rpcs = argsDeRpc(js);
    check('hay llamadas a RPC', rpcs.length > 0, true);
    var rpcSinScope = rpcs.filter(function(r){ return !/p_barberia_id/.test(r.args); })
                          .map(function(r){ return r.nombre; });
    check('toda RPC recibe p_barberia_id' +
          (rpcSinScope.length ? ' — sueltas: ' + rpcSinScope.join(', ') : ''), rpcSinScope.length, 0);

    // 5. El profesional es obligatorio en las tres puertas (168e7c8, 8deb317 y
    //    la migración de b4ee158). Acá se comprueba que el navegador no volvió a
    //    abrir la puerta: ni opción "Cualquiera", ni fallback a 'Por asignar'.
    check('no ofrece "Cualquier profesional"', /Cualquier/i.test(js), false);
    check('no manda "Por asignar" a la RPC', /Por asignar/i.test(js), false);
    var reserva = rpcs.filter(function(r){ return /^crear_reserva_publica/.test(r.nombre); });
    check('llama a la RPC de crear reserva', reserva.length, 1);
    check('manda el profesional elegido, sin fallback',
          reserva.length === 1 &&
          /p_barbero_nombre\s*:\s*\w+\.profesional\.nombre\s*[,}]/.test(reserva[0].args), true);

    // 6. Si al filtrar no queda nadie, el cliente tiene que ver por qué, no una
    //    grilla vacía con "Continuar" apagado para siempre.
    check('explica la lista vacía en vez de dejarla muda',
          /profesionales disponibles por ahora/.test(html), true);

    // 7. Horas ya pasadas. A las 22:00 la grilla seguía ofreciendo las 10:00 del
    //    mismo día: nada en el flujo comparaba contra la hora actual, solo el
    //    calendario tachaba días enteros.
    var N = NOMBRES[f];
    var fnAhora = extraerFuncion(js, N.ahora);
    check('define ' + N.ahora + '()', fnAhora !== '', true);

    //    Anclada a Chile, no al reloj del dispositivo: un cliente de viaje veía
    //    la grilla de SU zona. Se comprueba con instantes fijos, que es donde
    //    esto se rompe de verdad.
    if(fnAhora){
      //    Invierno chileno = UTC-4.
      var inv = ahoraCon(fnAhora, N.ahora, '2026-07-30T12:00:00Z');
      check('invierno: 12:00 UTC son las 08:00 en Chile', inv.minutos, 8*60);
      check('invierno: la fecha es la chilena', inv.fecha, '2026-07-30');

      //    Verano chileno = UTC-3. Hardcodear el offset se rompe acá.
      var ver = ahoraCon(fnAhora, N.ahora, '2026-01-15T12:00:00Z');
      check('verano: 12:00 UTC son las 09:00 en Chile (DST)', ver.minutos, 9*60);

      //    Medianoche: hour12:false devuelve "24" en algunos motores, y 24*60
      //    dejaría el día entero fuera de la grilla. hourCycle:'h23' lo evita.
      var med = ahoraCon(fnAhora, N.ahora, '2026-07-30T04:00:00Z');
      check('medianoche en Chile da 0 minutos, no 1440', med.minutos, 0);

      //    Fecha distinta a la de UTC: si la grilla y el calendario no usan la
      //    misma fuente, acá se contradicen.
      var cruce = ahoraCon(fnAhora, N.ahora, '2026-07-30T02:00:00Z');
      check('antes de medianoche UTC la fecha chilena es la anterior',
            cruce.fecha + ' ' + cruce.minutos, '2026-07-29 1320');

      //    No cae al reloj local salvo que Intl falle de verdad.
      check('no cae al reloj local', inv.fecha === 'LOCAL', false);
    }

    //    OJO — este check de texto es LOAD-BEARING, no decorativo.
    //    Los de arriba corren la función real, pero si el equipo que corre el
    //    test está en Chile (UTC-4), "hora local" y "hora de Chile" dan el mismo
    //    número y TODOS pasan igual aunque se haya borrado el ancla de zona.
    //    Se comprobó: quitando timeZone:'America/Santiago' los 6 checks de
    //    comportamiento seguían en verde. Y no se puede forzar otra zona al
    //    runner — Chrome en Windows ignora la variable TZ (sigue resolviendo
    //    America/Santiago). Así que esto es lo único que ve la regresión que
    //    importa: la que solo se manifiesta en el celular de un cliente que no
    //    está en Chile.
    check('ancla la hora a America/Santiago, no al dispositivo',
          /timeZone\s*:\s*'America\/Santiago'/.test(js), true);
    check('usa hourCycle h23 (h12/hour12 devuelve 24 a medianoche)',
          /hourCycle\s*:\s*'h23'/.test(js), true);

    //    La anticipación mínima acordada, igual en las dos páginas.
    var anticip = new RegExp('(?:const|let|var)\\s+' + N.anticip + '\\s*=\\s*(\\d+)').exec(js);
    check('define ' + N.anticip, anticip !== null, true);
    check('la anticipación mínima es de 30 min', anticip && anticip[1], '30');

    //    Y que el filtro esté efectivamente aplicado sobre los slots del día:
    //    tener la función de "ahora" sin usarla es el fallo silencioso obvio.
    check('filtra los slots del día por la hora actual',
          /delDia\s*\.filter\s*\(/.test(js) && /desdeMin/.test(js), true);
    check('el filtro solo aplica al día de hoy', /esHoy/.test(js), true);

    //    El calendario tiene que usar la MISMA fuente de "hoy" que la grilla.
    //    Antes usaba new Date() local: cerca de medianoche se contradecían.
    check('el calendario ya no compara contra el reloj local',
          /const past = fecha < hoy/.test(js), false);
    check('el calendario usa la fecha chilena', /fechaStr < hoyStr/.test(js), true);

    // 8. La duración del servicio no bloqueaba los horarios siguientes. Un corte
    //    de 60 min a las 11:30 marcaba ocupado SOLO el slot 11:30, así que un
    //    segundo cliente reservaba encima. Confirmado en producción.
    //
    //    Estos checks corren las funciones REALES del archivo contra un horario
    //    inventado, así que prueban el cálculo, no su apariencia.
    var S = armarSandbox(js, N, HORARIO_PRUEBA);
    check('se puede reconstruir el cálculo de slots', S !== null, true);

    if(S){
      var MAR = 2, MIE = 3, DOM = 0, JUE = 4;
      var t = S.timeToMin;
      var unidadesDe = function(dia){
        var out = {}, arr = S.slotsParaDia(dia);
        for(var i=0;i<arr.length;i++) out[t(arr[i])] = true;
        return { has: function(m){ return out[m] === true; } };
      };

      //    EL CASO REPORTADO. Reserva de 60 min a las 11:30 → ocupa 11:30-12:30.
      //    Un servicio de 30 min a las 12:00 se le mete adentro.
      check('un servicio a las 12:00 choca con una reserva de 60 min de las 11:30',
            S.seSolapan(t('12:00'), 30, t('11:30'), 60), true);

      //    Y el borde, que es donde viven los off-by-one: la reserva TERMINA a
      //    las 12:30, así que las 12:30 quedan libres. Bloquearlas sería perder
      //    una hora vendible cada vez.
      check('las 12:30 quedan libres: la reserva de 11:30 termina justo ahí',
            S.seSolapan(t('12:30'), 30, t('11:30'), 60), false);

      //    El solapamiento va en los dos sentidos: el servicio NUEVO también
      //    puede ser largo y comerse una reserva corta posterior.
      check('un servicio de 60 min a las 12:00 choca con una reserva de las 12:30',
            S.seSolapan(t('12:00'), 60, t('12:30'), 30), true);
      check('dos citas consecutivas que no se tocan conviven',
            S.seSolapan(t('09:00'), 30, t('09:30'), 30), false);

      //    CIERRE. Un servicio largo cerca del cierre se pasaba de largo.
      var uMar = unidadesDe(MAR), cMar = S.cierreDelDia(MAR);
      check('cierre 19:00 — un servicio de 30 min cabe a las 18:30',
            S.cabeEnLaJornada(t('18:30'), 30, cMar, uMar), true);
      check('cierre 19:00 — uno de 60 min NO cabe a las 18:30',
            S.cabeEnLaJornada(t('18:30'), 60, cMar, uMar), false);

      //    COLACIÓN. Antes solo se miraba el inicio, así que un servicio de 60
      //    min a las 13:30 se metía media hora en el almuerzo.
      check('colación 14:00 — uno de 30 min cabe a las 13:30',
            S.cabeEnLaJornada(t('13:30'), 30, cMar, uMar), true);
      check('colación 14:00 — uno de 60 min NO cabe a las 13:30',
            S.cabeEnLaJornada(t('13:30'), 60, cMar, uMar), false);
      check('después de la colación se puede de nuevo',
            S.cabeEnLaJornada(t('15:00'), 60, cMar, uMar), true);

      //    CIERRE NO ALINEADO A LA GRILLA. Es el hueco que el conjunto de
      //    unidades no ve solo: la unidad de las 19:00 existe (19:00 < 19:20),
      //    así que sin el chequeo explícito contra el cierre esto pasaría.
      var uMie = unidadesDe(MIE), cMie = S.cierreDelDia(MIE);
      check('la unidad de las 19:00 existe con cierre 19:20',
            uMie.has(t('19:00')), true);
      check('cierre 19:20 — uno de 30 min a las 19:00 se pasaría, y se rechaza',
            S.cabeEnLaJornada(t('19:00'), 30, cMie, uMie), false);

      //    FALLBACK HORARIOS_BASE (día sin fila configurada). No hay hora_cierre
      //    que consultar, pero la lista trae su propio hueco de almuerzo.
      check('sin horario configurado hay slots igual', S.slotsParaDia(JUE).length > 0, true);
      check('sin horario configurado no hay cierre que consultar',
            S.cierreDelDia(JUE), null);
      var uJue = unidadesDe(JUE);
      check('fallback — uno de 30 min cabe a las 12:30',
            S.cabeEnLaJornada(t('12:30'), 30, null, uJue), true);
      check('fallback — uno de 60 min a las 12:30 cae en el hueco del almuerzo',
            S.cabeEnLaJornada(t('12:30'), 60, null, uJue), false);

      //    DÍA CERRADO: no se ofrece nada, pase lo que pase.
      check('domingo cerrado no genera slots', S.slotsParaDia(DOM).length, 0);

      //    BLOQUEOS. Mismo defecto que la colación: se miraba solo el inicio.
      var blo = { tipo:'puntual', fecha:'2026-08-04', hora_inicio:'14:00', hora_fin:'15:00' };
      check('bloqueo 14:00-15:00 — uno de 60 min a las 13:30 choca',
            S.bloqueoChocaCon(blo, t('13:30'), 60, '2026-08-04', MAR), true);
      check('bloqueo 14:00-15:00 — uno de 30 min a las 13:30 termina justo antes',
            S.bloqueoChocaCon(blo, t('13:30'), 30, '2026-08-04', MAR), false);
      check('bloqueo de otra fecha no afecta',
            S.bloqueoChocaCon(blo, t('14:00'), 30, '2026-08-05', MAR), false);
      var bloDia = { tipo:'dia_completo', fecha:'2026-08-04' };
      check('bloqueo de día completo tapa cualquier hora',
            S.bloqueoChocaCon(bloDia, t('09:00'), 30, '2026-08-04', MAR), true);

      //    La grilla sigue generándose con el paso esperado.
      check('el paso de la grilla es de 30 min', S.paso, 30);
      var mar = S.slotsParaDia(MAR);
      check('la grilla del martes empieza a las 09:00', mar[0], '09:00');
      check('la grilla del martes no incluye la colación',
            mar.indexOf('14:00') === -1 && mar.indexOf('14:30') === -1, true);
      check('la grilla del martes termina antes del cierre',
            mar[mar.length-1], '18:30');
    }

    //    La consulta tiene que pedir la duración, y ya no filtrar por procesado:
    //    app.html marca procesado=true junto con estado='Atendida', y el dueño
    //    cobra cuando el cliente se sienta, no cuando se va.
    var vista = lecturasDeTabla(js).filter(function(l){
      return l.tabla === 'reservas_disponibilidad';
    });
    check('lee la vista de disponibilidad una sola vez', vista.length, 1);
    check('pide la duración de las reservas existentes',
          vista.length === 1 && /duracion_min/.test(vista[0].resto), true);
    check('ya no filtra por procesado',
          vista.length === 1 && /\.eq\('procesado'/.test(vista[0].resto), false);
  });

  pintar();
}

// Modo automático. Falla con file:// salvo que Chrome corra con
// --allow-file-access-from-files, y ahí cae al selector de archivo.
Promise.all(ARCHIVOS.map(function(f){
  return fetch(f).then(function(r){
    if(!r.ok) throw new Error(f + ' respondió HTTP ' + r.status);
    return r.text();
  });
})).then(function(textos){
  var src = {};
  ARCHIVOS.forEach(function(f, i){ src[f] = textos[i]; });
  correr(src);
}).catch(function(){
  document.getElementById('manual').style.display = 'block';
  document.getElementById('resultado').textContent =
    'Esperando los archivos… (el navegador no me deja leerlos solo)';
  document.getElementById('archivo').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files);
    var src = {}, pend = ARCHIVOS.slice();
    files.forEach(function(f){
      var fr = new FileReader();
      fr.onload = function(){
        src[f.name] = String(fr.result);
        pend = pend.filter(function(x){ return x !== f.name; });
        if(pend.length === 0) correr(src);
      };
      fr.readAsText(f);
    });
  });
});
</script>
